# The test suite, ruff and ESLint (tests/README.md). On every push and pull request: ruff, the suite without the slow
# PDF renders (with ESLint on the dashboard files), and the tests on Home Assistant itself (tests_ha/) on the oldest
# supported and the newest tested Home Assistant. Every night, on a release tag and when started by hand: the whole
# suite, the PDF renders included. Python 3.14: Home Assistant requires it from 2026.3, the oldest Home Assistant
# release GlucoCraft supports (hacs.json).
name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
      - uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .

  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
      - uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.14"
      - uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install -r requirements_test.txt
      # tests/test_javascript_lint.py runs ESLint where the command is installed
      - run: npm install --global eslint@9.39.1
      - name: Tests without the PDF renders
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        run: python -m pytest -m "not slow"
      - name: All tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: python -m pytest

  home-assistant:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported Home Assistant (hacs.json) and the newest tested release
        requirements: ["requirements_minimum.txt", "requirements.txt"]
    steps:
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
      - uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r tests_ha/${{ matrix.requirements }}
      - run: python -m pytest tests_ha
