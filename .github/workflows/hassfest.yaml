# Home Assistant's hassfest validation of the integration (manifest, translations, services, dependencies), the same
# check Home Assistant runs on its own integrations (https://developers.home-assistant.io/blog/2020/04/16/hassfest/).
name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      # The project's own validator, on its moving branch on purpose: it must check against Home Assistant's current
      # rules, which a pinned version would not follow. The GitHub-owned actions are pinned to a commit (Dependabot).
      - uses: "home-assistant/actions/hassfest@master"
