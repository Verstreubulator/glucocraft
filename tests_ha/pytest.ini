[pytest]
# GlucoCraft on Home Assistant itself (pytest-homeassistant-custom-component): see tests/README.md. A separate
# virtual environment with tests_ha/requirements.txt; run from the repository root:  python -m pytest tests_ha
# The repository root is on the path, so that Home Assistant finds custom_components/glucocraft.
testpaths = .
pythonpath = ..
addopts = -ra --strict-markers -p no:cacheprovider
xfail_strict = true
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
