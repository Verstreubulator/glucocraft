panel.date.weekday_short.wednesday: "Wed"
panel.date.weekday_short.thursday: "Thu"
panel.date.weekday_short.friday: "Fri"
panel.date.weekday_short.saturday: "Sat"
panel.date.month.january: "January"
panel.date.month.february: "February"
