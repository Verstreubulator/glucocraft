# =====================================================================================================================
# GlucoCraft panels: the text catalogue, English (the source language and the fallback for every missing key)
# =====================================================================================================================
# Every text a GlucoCraft panel shows lives here, under a key. A panel's language is a build choice: the substitution
# "language: en" in the panel's configuration selects i18n/<language>.yaml.
#
# A new language: copy this file to i18n/<code>.yaml (the Home Assistant language code, for example de or pt-BR),
# translate the values, keep the keys, then run
#     python tools/make_panel_texts.py
# which checks every catalogue and writes i18n/generated/<code>/ (the texts for the configurations and the firmware,
# and the glyph lists of the fonts), and
#     python tools/worst_case_fit.py <code>
# which checks that every text fits on every panel layout. A key missing from a catalogue takes the English text.
#
# Format (the same as GlucoCraft's other catalogues):
#   - flat, dotted, lower-case keys, by area (panel.<area>.<name>); one text per key, never assembled from fragments;
#   - values are inserted through named placeholders such as {value} or {minutes}: keep every placeholder of the
#     English text (the order may change); "\n" is a line break;
#   - plural forms would be separate keys <key>.one / <key>.other; the panel texts need none (they use abbreviations
#     such as "5 min" and "3d 2h");
#   - numbers, dates and times keep GlucoCraft's regional settings (the decimal separator, the 12- or 24-hour clock,
#     the date order); this file holds the words only;
#   - not translated: proper names (GlucoCraft, Home Assistant, Wi-Fi, CGM), the license notice's names and address,
#     and the citations ("Battelino 2019").
#
# GlucoCraft's disclaimer in its short form (panel.about.title and panel.about.disclaimer, together word for word as
# GlucoCraft's const.py DISCLAIMER_SHORT; the long form is in the Documentation) and the disclaimer line of the
# start-up screen (panel.startup.line, as const.py DISCLAIMER_LINE, with a line break between its two sentences: each
# on a line of its own, centered) are the integration's texts; a translation translates them like every other text
# and keeps the line break.
# =====================================================================================================================

# ---------------------------------------------------------------- the start-up screen (with GlucoCraft's icon)
panel.startup.name: "GlucoCraft"
panel.startup.version: "Panel version {panel_version}"
panel.startup.line: "For development and testing only.\nNot for medical use."

# ---------------------------------------------------------------- the About page (page 16)
# GlucoCraft's disclaimer in its short form, its first sentence as the title; then the version line and the
# copyright line
panel.about.title: "For development and testing only."
panel.about.disclaimer: "GlucoCraft is free, open-source software, made available for development and testing. It is not intended for any medical purpose, such as diagnosing, monitoring or managing diabetes or making treatment decisions, and has not been cleared or approved by the FDA or any other regulator. Its information and notifications can be late, missing or wrong. Its notifications are not alarms. GlucoCraft is licensed under the AGPL-3.0-only, without warranty or, as far as the law allows, liability."
panel.about.version: "GlucoCraft Panel v{panel_version}"
# under the version: the copyright notice and where to read the license (AGPL-3.0-only, section 0, "Appropriate Legal
# Notices"), the same words as on the display card (card.about.copyright), in two lines
panel.about.copyright: "Copyright (C) 2026 The GlucoCraft authors.\nLicense: gnu.org/licenses/agpl-3.0"

# ---------------------------------------------------------------- the clock header
# the header's first texts after a start: no time and no date until a clock source has set the time (the same as
# the clock's own first text, so no made-up time or date is shown, in any time or date format)
panel.header.clock_initial: "--:--"
panel.header.date_initial: ""
# the header's date: the weekday above the day and month ({date}: "October 22" or "22 October", the date order)
panel.header.date: "{weekday}\n{date}"

