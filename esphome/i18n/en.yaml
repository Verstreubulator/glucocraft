# the 12-hour clock ({time}: "7:46"); the 24-hour clock has no words
panel.time.am: "{time} AM"
panel.time.pm: "{time} PM"
# an hour on a graph's time axis ({hour}: "6")
panel.time.hour_am: "{hour}am"
panel.time.hour_pm: "{hour}pm"

# ---------------------------------------------------------------- the glucose block
# a limit reading (outside the sensor's measurement range) instead of the number
panel.value.lo: "LO"
panel.value.hi: "HI"
panel.glucose.trend_label: "TREND"
panel.glucose.delta_label: "5 MIN DELTA"
# The zone word under the value (GlucoCraft's display_word) and the trend word of the TREND column (the Trend arrow
# attribute word, with the setting Trend shown as: word), in the words GlucoCraft sends. These must be the same words
# as GlucoCraft's in this language (zone.word.* and trend.word.* of its backend catalogue). The panels only measure
# them (worst_case_fit.py) and take their letters into the fonts.
panel.word.zone.very_low: "Very low"
panel.word.zone.low: "Low"
panel.word.zone.in_range: "In range"
panel.word.zone.tight_range: "Tight range"
panel.word.zone.high: "High"
panel.word.zone.very_high: "Very high"
panel.word.zone.sensor_limit: "Sensor limit"
panel.word.trend.changing_slowly: "Changing slowly"
panel.word.trend.falling_quickly: "Falling quickly"
panel.word.trend.rising_quickly: "Rising quickly"
panel.word.trend.falling: "Falling"
panel.word.trend.rising: "Rising"

# ---------------------------------------------------------------- no current reading
# in the glucose value's place, never a number: during a sensor warm-up; without current data after the sensor's
# stated expiry (GlucoCraft does not monitor the sensor: only its stated expiry has passed); without current data
# otherwise. The same words as the display card's (card.no_reading.*)
panel.no_reading.warming_up: "Sensor warming up"
panel.no_reading.sensor_expired: "Sensor expired"
panel.no_reading.no_current_data: "No current data"
# under the words, the last reading ({value} in the display unit, {unit} "mg/dL" or "mmol/L"; a limit reading as its
# LO / HI, without a unit), then when it was taken: {time} "5:39 PM" or "17:39", {date} "Oct 22" or "22 Oct", in Home
# Assistant's time zone; {ago} its age: minutes under an hour, hours and minutes under a day, then days and hours. The
# larger layouts show when and the age on one line (time_ago); the square and 3.5-inch panels split it before the
# bracket (the age on a line of its own: ago_line). The same texts as the display card's (card.no_reading.*)
panel.no_reading.last_reading: "Last reading: {value} {unit}"
panel.no_reading.last_reading_limit: "Last reading: {value}"
panel.no_reading.when_today: "Today at {time}"
panel.no_reading.when_yesterday: "Yesterday at {time}"
panel.no_reading.when_date: "{date} at {time}"
panel.no_reading.ago_minutes: "{minutes} min ago"
panel.no_reading.ago_hours: "{hours} h {minutes} min ago"
panel.no_reading.ago_days: "{days} d {hours} h ago"
panel.no_reading.time_ago: "{when} ({ago})"
panel.no_reading.ago_line: "({ago})"

# ---------------------------------------------------------------- how long something has lasted
# whole minutes, rounded down: "45 min", "2 h 5 min", from a day on days and hours "1 d 2 h" (the limit screen and the
# screen without Home Assistant; the same forms as the display card's)
panel.duration.minutes: "{minutes} min"
panel.duration.hours: "{hours} h {minutes} min"
panel.duration.days: "{days} d {hours} h"
# since when ({time}: today "3:12 AM" or "03:12", yesterday panel.limit_screen.when_yesterday, earlier
# panel.no_reading.when_date; {duration}: one of the three above)
panel.since.line: "Since {time} ({duration})"

# ---------------------------------------------------------------- the limit screen
# while the current reading is a limit reading, in the value's place instead of a value, four lines: the zone (large,
# in the zone color), the sensor range ({limit}: panel.value.lo / panel.value.hi), since when (panel.since.line) and
# the newest measured reading before the stretch ({value} in the display unit, {unit}, {time} today's clock time;
# on an earlier day last_measured_day with {when}: "yesterday at 3:10 AM" or "Oct 22 at 3:10 AM"); without a trusted
# reading time the last line has no time. The same texts as the display card's (card.limit_screen.*)
panel.limit_screen.low.title: "Very low"
panel.limit_screen.high.title: "Very high"
panel.limit_screen.low.range: "Below sensor range ({limit})"
panel.limit_screen.high.range: "Above sensor range ({limit})"
panel.limit_screen.last_measured: "Last measured: {value} {unit} at {time}"
panel.limit_screen.last_measured_day: "Last measured: {value} {unit}, {when}"
panel.limit_screen.last_measured_value: "Last measured: {value} {unit}"
# a time on the day before, within a line ("Since yesterday at 3:12 AM (1 d 2 h)")
panel.limit_screen.when_yesterday: "yesterday at {time}"

# ---------------------------------------------------------------- the screen without Home Assistant
# after an hour without the connection to Home Assistant or without a successful download of GlucoCraft's files,
# below the clock and the date: the title, since when (panel.since.line), the last reading with its time ({value} in
# the display unit, a limit reading as its LO / HI; without a trusted time panel.no_reading.last_reading), and what
# to check
panel.no_connection.title: "Cannot reach Home Assistant or load its data"
panel.no_connection.last_reading: "Last reading: {value} {unit} at {time}"
panel.no_connection.last_reading_limit: "Last reading: {value} at {time}"
panel.no_connection.check: "Check Home Assistant and the wall-panel address"

# ---------------------------------------------------------------- loading (the start)
panel.loading.initializing: "Initializing..."
panel.loading.downloading: "Downloading\nglucose data..."
panel.loading.readings: "Loading glucose data..."
panel.loading.graph_24h: "Loading 24-hour graph..."
panel.loading.graph_7d: "Loading 7-day graph..."
panel.loading.graph_14d: "Loading 14-day graph..."
panel.loading.graph_30d: "Loading 30-day graph..."
panel.loading.graph_90d: "Loading 90-day graph..."
panel.loading.graph_180d: "Loading 6-month graph..."
panel.loading.drawing: "Drawing graphs..."
# the history file could not be downloaded at the start (the display card shows "Loading..." in its graphs instead)
panel.loading.failed: "History not available\n\nShowing live data..."

# ---------------------------------------------------------------- the status bar
# the age of the newest reading: whole minutes up to 99, then whole hours (both rounded down; "min" and "h" have no
# plural); "---" before any reading, and while the reading's time is more than 5 minutes ahead of the clock (its age
# cannot be known)
panel.status.reading_minutes: "Reading: {minutes} min ago"
panel.status.reading_hours: "Reading: {hours} h ago"
panel.status.reading_none: "Reading: ---"
panel.status.warm_up: "Warm-up"
panel.status.warm_up_minutes: "Warm-up: {minutes} min"
panel.status.custom_ranges: "Custom ranges"
# while a GlucoCraft notice is open in Home Assistant's Repairs: in the middle of the status bar, taking turns with the
# warm-up text or "Custom ranges" (never the notice's own text)
panel.status.check_home_assistant: "Check Home Assistant"
panel.status.expiry_none: "Sensor Exp: ---"
panel.status.expiry_minutes: "Sensor Exp: {minutes}m"
panel.status.expiry_hours: "Sensor Exp: {hours}h {minutes}m"
panel.status.expiry_days: "Sensor Exp: {days}d {hours}h"
# after the stated expiry; it throbs until a new sensor is seen (the same fade as the words without a current reading,
# with no 30-minute limit: it is small, and a new sensor can take a while), unless the fade setting is off
panel.status.expired: "Sensor expiry passed"

