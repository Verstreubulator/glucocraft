  top_layer:
    widgets:
      - obj:
          id: header_current
          x: 0
          y: 0
          width: @W@
          height: @HDR@
          styles: theme_background
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          widgets:
            - label:
                id: clock_current
                align: LEFT_MID
                x: @MX@
                y: 0
                text_font: @clock_font@
                styles: theme_text
                text: "${t_header_clock_initial}"
            - label:
                id: date_current
                align: RIGHT_MID
                x: -@MX@
                y: 0
                text_font: @date_font@
                styles: theme_text_label
                text_align: RIGHT
                text: "${t_header_date_initial}"

      # Glucose block (left, @LW@ x @BH@), always visible - also on the weekly pages. Press and hold for 1 second (so
      # that a swipe is never read as a tap): from a graph page to the weekly pages, from a weekly page back to the
      # 6-hour page; sync_page_mode shows the new page's top layer at once. Swipes here change pages like the page
      # itself (script nav_next / nav_prev).
      - obj:
          id: glucose_data_container
          hidden: true
          x: 0
          y: @HDR@
          width: @LW@
          height: @BH@
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          on_long_press:
            - if:
                condition:
                  lambda: 'return id(current_page) >= 7 && id(current_page) <= 15;'
                then:
                  - lambda: 'id(page_idle_seconds) = 0; id(current_page) = 0;'
                  - lvgl.page.show:
                      id: page_6h
                      animation: FADE_IN
                      time: 300ms
                  - script.execute: sync_page_mode
                else:
                  - lambda: |-
                      if (!backfill_has_trends() || id(current_page) > 6) return;   // graph pages only, like the card
                      id(current_page) = 7;
                      id(page_idle_seconds) = 0;
                  - if:
                      condition:
                        lambda: 'return id(current_page) == 7;'
                      then:
                        - lvgl.page.show:
                            id: page_trend_tir
                            animation: MOVE_LEFT
                            time: 300ms
                        - script.execute: sync_page_mode
          widgets:
            - label:
                id: glucose_value
                align: TOP_MID
                y: @value_y@
                text_font: @value_font@
                styles: theme_text_label   # "---" in gray until the first value
                text: "---"
            # the zone word under the value, in the text color (GlucoCraft's display_word)
            - label:
                id: display_word_label
                align: TOP_MID
                y: @word_y@
                width: @word_w@
                text_font: @word_font@
                styles: theme_text
                text_align: CENTER
                text: ""
                long_mode: CLIP
            # Without a current reading, in the value's place, never a number (update_glucose_display), stacked and
            # centered between the value's top and the columns: the words "Sensor warming up" / "Sensor expired" /
            # "No current data" at the zone word's large size, wrapped at its width, throbbing (refresh_glucose_block);
            # under them the last reading and when it was taken (update_last_reading; nr_line_font, nr_time_font,
            # nr_split). Without any reading only the words.
            - obj:
                id: no_reading_box
                align: TOP_MID
                y: @value_y@
                width: @word_w@
                height: @NR_H@
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                scrollable: false
                hidden: true
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_row: 0
                widgets:
                  - label:
                      id: no_reading_label
                      width: @word_w@
                      text_font: @word_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: ""
                  - label:
                      id: last_reading_label
                      width: @word_w@
                      text_font: @nr_line_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: CLIP
                      text: ""
                      hidden: true
                  - label:
                      id: reading_when_label
                      width: @word_w@
                      text_font: @nr_time_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: CLIP
                      text: ""
                      hidden: true
                  - label:
                      id: reading_ago_label
                      width: @word_w@
                      text_font: @nr_time_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: CLIP
                      text: ""
                      hidden: true
            # A current limit reading (LO / HI): the limit screen in the value's place, never a number
            # (update_limit_screen; gc_units.h limit_screen), stacked and centered like the words above: the zone at the
            # zone word's large size in its zone color, the sensor range (nr_line_font), since when and the last
            # measured reading (nr_time_font), each wrapped at the zone word's width; a line without data is hidden.
            - obj:
                id: limit_box
                align: TOP_MID
                y: @value_y@
                width: @word_w@
                height: @NR_H@
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                scrollable: false
                hidden: true
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_row: 0
                widgets:
                  - label:
                      id: limit_title_label
                      width: @word_w@
                      text_font: @word_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: ""
                  - label:
                      id: limit_range_label
                      width: @word_w@
                      text_font: @nr_line_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: ""
                      hidden: true
                  - label:
                      id: limit_since_label
                      width: @word_w@
                      text_font: @nr_time_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: ""
                      hidden: true
                  - label:
                      id: limit_measured_label
                      width: @word_w@
                      text_font: @nr_time_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: ""
                      hidden: true
            - obj:
                x: 0
                y: @col_y@
                width: @COL_W@
                height: @col_h@
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      align: TOP_MID
                      y: @col_lbl_y@
                      text_font: @col_lbl_font@
                      styles: theme_text_label
                      text: "${t_glucose_trend_label}"
                  - image:
                      id: trend_arrow
                      src: trend_arrow_img
                      align: CENTER
                      y: @arrow_y@
                      styles: theme_text
                      image_recolor_opa: COVER
                      hidden: true
                  # the trend word (the setting Trend shown as: word), wrapped at @trend_word_w@ px
                  - label:
                      id: trend_word_label
                      align: CENTER
                      y: @arrow_y@
                      width: @trend_word_w@
                      text_font: @trend_word_font@
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: ""
                      hidden: true
                  # without a current reading: "---", as the 5-minute delta (update_glucose_display)
                  - label:
                      id: trend_none_label
                      align: CENTER
                      y: @arrow_y@
                      text_font: @delta_font@
                      styles: theme_text_secondary
                      text: "---"
                      hidden: true
                  - label:
                      id: data_source_label
                      align: BOTTOM_MID
                      y: @src_y@
                      width: @SRC_W@
                      height: @src_h@
                      text_font: @src_font@
                      styles: theme_text_label
                      text_align: CENTER
                      long_mode: DOT
                      text: ""
            - obj:
                x: @COL_W@
                y: @col_y@
                width: @COL_W@
                height: @col_h@
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      align: TOP_MID
                      y: @col_lbl_y@
                      text_font: @col_lbl_font@
                      styles: theme_text_label
                      text: "${t_glucose_delta_label}"
                  - label:
                      id: delta_value
                      align: CENTER
                      y: @delta_y@
                      text_font: @delta_font@
                      styles: theme_text_secondary
                      text: "---"

      - obj:
          id: loading_container
          x: 0
          y: 0
          width: @W@
          height: @H@
          styles: theme_background
          border_width: 0
          pad_all: 0
          hidden: true
          widgets:
            - label:
                id: loading_progress_label
                align: CENTER
                y: 0
                text_font: @load_font@
                styles: theme_text_progress
                text_align: CENTER
                text: "${t_loading_initializing}"

      # Weekly page (right, current_page 7-15): title, description, "Last 14 days" line; press and hold for 1 second
      # = back to 6 hours (sync_page_mode hides the weekly information at once); swipes change pages (nav_next /
      # nav_prev)
      - obj:
          id: trend_info_container
          x: @RX@
          y: @HDR@
          width: @RW@
          height: @ti_h@
          styles: theme_background
          border_width: 0
          pad_all: 0
          hidden: true
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          on_long_press:
            - lambda: 'id(page_idle_seconds) = 0; id(current_page) = 0;'
            - lvgl.page.show:
                id: page_6h
                animation: FADE_IN
                time: 300ms
            - script.execute: sync_page_mode
          widgets:
            - label:
                id: trend_title_label
                x: 10
                y: @ti_title_y@
                width: @TI_W@
                text_font: @ti_title_font@
                styles: theme_text
                text_align: CENTER
                text: ""
                clickable: false
            - label:
                id: trend_desc_label
                x: 10
                y: @ti_desc_y@
                width: @TI_W@
                text_font: @ti_desc_font@
                styles: theme_text_secondary
                text_align: CENTER
                text: ""
                clickable: false
            - label:
                id: trend_status_label
                x: 10
                y: @ti_status_y@
                width: @TI_W@
                text_font: @ti_status_font@
                styles: theme_text
                text_align: CENTER
                text: ""
                clickable: false
      - canvas:
          id: trend_canvas
          x: @TC_X@
          y: @tc_y@
          width: @CW@
          height: @TCH@
          hidden: true
          clickable: false

      - obj:
          id: status_bar
          x: 0
          y: @SB_Y@
          width: @W@
          height: @SB@
          bg_color: 0x9E9E9E
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          widgets:
            - label:
                id: time_since_update
                align: LEFT_MID
                x: @MX@
                text_font: @sb_font@
                text_color: 0xFFFFFF
                text: "${t_status_reading_none}"
            - label:
                id: warmup_countdown_label
                align: CENTER
                text_font: @sb_font@
                text_color: 0xFFFFFF
                text: "${t_status_warm_up}"
                hidden: true
            - label:
                id: custom_ranges_label
                align: CENTER
                text_font: @sb_font@
                text_color: 0xFFFFFF
                text: "${t_status_custom_ranges}"
                hidden: true
            # while a GlucoCraft notice is open in Repairs: taking turns with the warm-up text or "Custom ranges"
            - label:
                id: check_ha_label
                align: CENTER
                text_font: @sb_check_font@
                text_color: 0xFFFFFF
                text: "${t_status_check_home_assistant}"
                hidden: true
            - label:
                id: sensor_expiry_label
                align: RIGHT_MID
                x: -@MX@
                text_font: @sb_font@
                text_color: 0xFFFFFF
                text: "${t_status_expiry_none}"

      # The screen without Home Assistant (the square panel's no_ha_screen block, in this layout's size): everything
      # below the clock and the date black, with the four lines of gc_units.h no_connection_screen, centered; the title
      # in the zone word's large size, the other lines in the loading text's size, wrapped at the screen's width less
      # 40 px (worst_case_fit.py). It takes every touch below the header and passes none on.
      - obj:
          id: no_ha_screen
          hidden: true
          x: 0
          y: @HDR@
          width: @W@
          height: @NO_HA_H@
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          gesture_bubble: false
          layout:
            type: flex
            flex_flow: COLUMN
            flex_align_main: CENTER
            flex_align_cross: CENTER
            flex_align_track: CENTER
            pad_row: 12
          widgets:
            - label:
                id: no_ha_title_label
                width: @NO_HA_W@
                text_font: @word_font@
                text_color: 0xFFFFFF
                text_align: CENTER
                long_mode: WRAP
                text: ""
            - label:
                id: no_ha_since_label
                width: @NO_HA_W@
                text_font: @load_font@
                text_color: 0xFFFFFF
                text_align: CENTER
                long_mode: WRAP
                text: ""
            - label:
                id: no_ha_reading_label
                width: @NO_HA_W@
                text_font: @load_font@
                text_color: 0xFFFFFF
                text_align: CENTER
                long_mode: WRAP
                text: ""
            - label:
                id: no_ha_check_label
                width: @NO_HA_W@
                text_font: @load_font@
                text_color: 0xFFFFFF
                text_align: CENTER
                long_mode: WRAP
                text: ""
