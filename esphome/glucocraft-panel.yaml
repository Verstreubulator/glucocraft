            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  # time and date formats (GlucoCraft's settings)
  - platform: homeassistant
    id: ha_time_format
    entity_id: sensor.glucocraft_configuration
    attribute: time_format
    internal: true
    on_value:
      then:
        - lambda: 'gcu::set_time_format(x.c_str());'
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: draw_glucose_graph
              - delay: 200ms
              - script.execute: draw_period_graphs
  - platform: homeassistant
    id: ha_date_format
    entity_id: sensor.glucocraft_configuration
    attribute: date_format
    internal: true
    on_value:
      then:
        - lambda: 'gcu::set_date_format(x.c_str());'
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: draw_period_graphs
              - script.wait: draw_period_graphs
              - delay: 200ms
              - if:
                  condition:
                    lambda: 'return id(current_page) >= 7 && id(current_page) <= 15;'
                  then:
                    - script.execute: draw_trend_page
  # decimal separator and A1C / GMI unit (GlucoCraft's International settings, resolved). Absent (a GlucoCraft
  # version that does not send them) = the point and percent. Every displayed decimal / every GMI is redrawn on a change.
  - platform: homeassistant
    id: ha_decimal_separator
    entity_id: sensor.glucocraft_configuration
    attribute: decimal_separator
    internal: true
    on_value:
      then:
        - lambda: 'gcu::set_decimal_separator(x.c_str());'
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: redraw_all
  - platform: homeassistant
    id: ha_a1c_unit
    entity_id: sensor.glucocraft_configuration
    attribute: a1c_unit
    internal: true
    on_value:
      then:
        - lambda: |-
            // a change of the A1C unit downloads the files at once (the weekly GMI goal line carries the unit); the
            // first value after a boot only sets the unit
            static std::string last;
            gcu::set_a1c_unit(x.c_str());
            if (x.empty() || x == "None" || x == "unavailable" || x == "unknown") return;
            if (!last.empty() && x != last && id(boot_sequence_complete)) id(backfill_settings_changed).execute();
            last = x;
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: populate_period_stats
              - if:
                  condition:
                    lambda: 'return id(current_page) == 11;'   # the weekly GMI page
                  then:
                    - script.execute: draw_trend_page
  # LO / HI: GlucoCraft marks a reading outside the sensor's measurement range (stored at
  # the sensor's limit); every display of the current value shows "LO" / "HI" instead of the number, in GlucoCraft's
  # zone color (gc_units.h). "None" = no limit reading; nothing arrives while the sensor is unavailable (kept).
  - platform: homeassistant
    id: ha_limit
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: limit
    internal: true
    on_value:
      then:
        - lambda: |-
            gcu::set_limit(x.c_str());
            // The updates of one reading (its value and this mark; its own time and value on the Last reading time
            // sensor) arrive in any order, and a limit reading has no value (never a point of the graph). A mark that
            // arrives after its reading was stored corrects it, by the reading's own time: a limit reading is taken out
            // of the 6-hour ring again (only that reading, never another one in the same 2-minute slot), and the
            // reading's saved copy (kept across a restart) gets the mark either way. A measured reading that came while
            // the last mark still said limit is stored by store_glucose_reading, which this mark runs again.
            const uint32_t own = (uint32_t) strtoul(id(ha_last_reading_ts).state.c_str(), nullptr, 10);
            if (gcu::limit() != 0 && own > 1600000000UL && id(glucose_history_count) > 0) {
              const int k = (id(glucose_history_index) + 179) % 180;
              if (id(glucose_history_ts)[k] == own) {
                id(glucose_history)[k] = 0;
                id(glucose_history_ts)[k] = 0;
                id(glucose_history_index) = k;
                id(glucose_history_count)--;
              }
            }
            if (own > 1600000000UL && id(saved_glucose_ts) == own) id(saved_glucose_limit) = gcu::limit();
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: store_glucose_reading
              - script.execute: update_glucose_display
  - platform: homeassistant
    id: ha_limit_text
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: limit_text
    internal: true
    on_value:
      then:
        - lambda: 'gcu::set_limit_text(x.c_str());'
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  # The limit screen's facts (gc_units.h limit_screen), attributes of the same sensor, as text (epoch seconds and
  # mg/dL, read as GlucoCraft's doubles; "None" outside a stretch or without a measured reading before it):
  # limit_since, the first reading of the current unbroken stretch of limit readings; last_measured_mgdl and
  # last_measured_ts, the newest measured reading before it
  - platform: homeassistant
    id: ha_limit_since
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: limit_since
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  - platform: homeassistant
    id: ha_last_measured_mgdl
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: last_measured_mgdl
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  - platform: homeassistant
    id: ha_last_measured_ts
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: last_measured_ts
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  # A GlucoCraft notice is open in Home Assistant's Repairs (and not ignored there): the configuration attribute
  # attention, a boolean, which Home Assistant sends as "on" / "off" (anything else, Home Assistant restarting, keeps
  # the last value). Drives "Check Home Assistant" in the status bar (the 1-second interval); never the notice's text.
  - platform: homeassistant
    id: ha_attention
    entity_id: sensor.glucocraft_configuration
    attribute: attention
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x == "on" || x == "off") id(attention_on) = x == "on";
  # The newest reading's time is more than 5 minutes ahead of the clock (the Last reading time sensor's boolean
  # attribute time_untrusted, "on" / "off"): its age cannot be known, so the status bar shows "Reading: ---" and the
  # words without a current reading have no time line under them
  - platform: homeassistant
    id: ha_time_untrusted
    entity_id: sensor.glucocraft_last_reading_time
    attribute: time_untrusted
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x == "on" || x == "off") id(time_untrusted) = x == "on";
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  # the display unit: the Last glucose reading sensor's unit (GlucoCraft's Display unit setting)
  - platform: homeassistant
    id: ha_unit
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: unit
    internal: true
    on_value:
      then:
        - lambda: |-
            bool was = gcu::mmol();
            gcu::set_unit(x.c_str());
            if (was != gcu::mmol()) ESP_LOGI("unit", "Display unit: %s", gcu::unit());
            // a unit change downloads the files at once (the weekly descriptions carry the unit);
            // the first value after a boot only sets the unit
            static bool seen = false;
            if (seen && was != gcu::mmol() && id(boot_sequence_complete)) id(backfill_settings_changed).execute();
            seen = true;
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: redraw_all
  # A change of the ranges, the goals or the weekly pages' standard (GlucoCraft's settings; the
  # configuration sensor's attributes) downloads the files at once (backfill_settings_changed), not at the next hourly
  # refresh; the first value after a boot or a reconnect only records
  - platform: homeassistant
    id: ha_cfg_ranges
    entity_id: sensor.glucocraft_configuration
    attribute: ranges
    internal: true
    on_value:
      then:
        - lambda: |-
            static std::string last;
            if (x.empty() || x == "None" || x == "unavailable" || x == "unknown") return;
            if (!last.empty() && x != last && id(boot_sequence_complete)) id(backfill_settings_changed).execute();
            last = x;
  # The optional feature Custom ranges and goals: which 6-hour summary sensor the statistics use before the first
  # file. Home Assistant sends a boolean attribute to an ESPHome device as "on" / "off"; nothing arrives while the
  # sensor is unavailable (the last value is kept).
  - platform: homeassistant
    id: ha_cfg_custom
    entity_id: sensor.glucocraft_configuration
    attribute: custom_ranges_and_goals
    internal: true
    on_value:
      then:
        - lambda: 'if (x == "on" || x == "off") id(gc_custom_ranges_on) = x == "on";'
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  - platform: homeassistant
    id: ha_cfg_weekly
    entity_id: sensor.glucocraft_configuration
    attribute: weekly_pages
    internal: true
    on_value:
      then:
        - lambda: |-
            static std::string last;
            if (x.empty() || x == "None" || x == "unavailable" || x == "unknown") return;
            if (!last.empty() && x != last && id(boot_sequence_complete)) id(backfill_settings_changed).execute();
            last = x;
  - platform: homeassistant
    id: ha_cfg_goals
    entity_id: sensor.glucocraft_configuration
    attribute: goals
    internal: true
    on_value:
      then:
        - lambda: |-
            static std::string last;
            if (x.empty() || x == "None" || x == "unavailable" || x == "unknown") return;
            if (!last.empty() && x != last && id(boot_sequence_complete)) id(backfill_settings_changed).execute();
            last = x;
  - platform: homeassistant
    id: ha_cfg_goals_custom
    entity_id: sensor.glucocraft_configuration
    attribute: goals_custom
    internal: true
    on_value:
      then:
        - lambda: |-
            static std::string last;
            if (x.empty() || x == "None" || x == "unavailable" || x == "unknown") return;
            if (!last.empty() && x != last && id(boot_sequence_complete)) id(backfill_settings_changed).execute();
            last = x;
  # When GlucoCraft saw the warm-up start (UTC ISO) - the warm-up minutes count from it, like the display card
  - platform: homeassistant
    id: ha_warmup_started
    entity_id: binary_sensor.glucocraft_sensor_warm_up
    attribute: started_at
    internal: true
  # When GlucoCraft received the newest reading (epoch s; changes with every reading, so Home Assistant always re-sends it).
  # Text, not a number: ESPHome sensors are float32 and an epoch in a float is only accurate to ~128 s.
  # (A minutes-since-reading value would not do: it is 0.0 at every write, so Home Assistant would not re-send it.)
  # ONE SYSTEM: the trend category, the trend word, the value's color and the status come from GlucoCraft.
  # "Unknown" (category) = no trend known: hide; "None" / empty / "unavailable" = Home Assistant restarting: keep the
  # last value.
  - platform: homeassistant
    id: ha_trend_description
    entity_id: sensor.glucocraft_trend_arrow
    attribute: description
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  # the trend word in GlucoCraft's language ("Changing slowly"; empty while the trend is unknown), shown in the TREND
  # column with the setting Trend shown as: word
  - platform: homeassistant
    id: ha_trend_word
    entity_id: sensor.glucocraft_trend_arrow
    attribute: word
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  # the zone word under the value: GlucoCraft's display_word (empty while there is no current data); without it no
  # word is shown
  - platform: homeassistant
    id: ha_display_word
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: display_word
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  - platform: homeassistant
    id: ha_zone_color
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: zone_color
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  # GlucoCraft's graph range colors (the configuration sensor's band_colors attribute; gc_units.h set_band_colors):
  # the bands behind the graphs. A change redraws everything.
  - platform: homeassistant
    id: ha_band_colors
    entity_id: sensor.glucocraft_configuration
    attribute: band_colors
    internal: true
    on_value:
      then:
        - if:
            condition:
              # set_band_colors() runs first on every value; the redraw only after a change and once the screen is up
              lambda: 'return gcu::set_band_colors(x.c_str()) && id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: redraw_all
  # GlucoCraft's range colors (the configuration sensor's zone_colors attribute; gc_units.h set_zone_colors): the
  # graphs' marks of the stretches at the sensor's limit, in the very-low / very-high color. A change redraws everything.
  - platform: homeassistant
    id: ha_zone_colors
    entity_id: sensor.glucocraft_configuration
    attribute: zone_colors
    internal: true
    on_value:
      then:
        - if:
            condition:
              # set_zone_colors() runs first on every value; the redraw only after a change and once the screen is up
              lambda: 'return gcu::set_zone_colors(x.c_str()) && id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: redraw_all
  # GlucoCraft's panel background and the text color for it (the configuration sensor's panel_background and
  # panel_foreground attributes; gc_units.h "Panel colors"). A change restyles the screen at once (apply_panel_theme);
  # the graphs keep their own colors and are not redrawn.
  - platform: homeassistant
    id: ha_panel_background
    entity_id: sensor.glucocraft_configuration
    attribute: panel_background
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return gcu::set_panel_background(x.c_str());'
            then:
              - script.execute: apply_panel_theme
  - platform: homeassistant
    id: ha_panel_foreground
    entity_id: sensor.glucocraft_configuration
    attribute: panel_foreground
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return gcu::set_panel_foreground(x.c_str());'
            then:
              - script.execute: apply_panel_theme
  # GlucoCraft's setting Outline text (the configuration sensor's boolean attribute text_outline, which Home Assistant
  # sends as "on" / "off"): a 1-pixel edge around the graph labels and the labels in a zone color (lvgl_compat.h). A
  # change redraws the labels at once and the graphs once the screen is up; any other text (Home Assistant
  # restarting) keeps the setting.
  - platform: homeassistant
    id: ha_text_outline
    entity_id: sensor.glucocraft_configuration
    attribute: text_outline
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                if (x != "on" && x != "off") return false;
                const bool on = x == "on";
                if (on == id(text_outline_on)) return false;
                id(text_outline_on) = on;
                lvc_outline_text() = on;
                lv_obj_invalidate(lv_screen_active());
                return id(boot_sequence_complete) && !id(loading_mode_active);
            then:
              - script.execute: redraw_all
  # GlucoCraft's setting Trend shown as (the configuration sensor's attribute trend_display, "arrow" / "word", the
  # arrow by default): the TREND column shows the arrow or the trend word. Any other text (Home Assistant restarting)
  # keeps the setting.
  - platform: homeassistant
    id: ha_trend_display
    entity_id: sensor.glucocraft_configuration
    attribute: trend_display
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                if (x != "arrow" && x != "word") return false;
                const bool on = x == "word";
                if (on == id(trend_word_on)) return false;
                id(trend_word_on) = on;
                return !id(loading_mode_active);
            then:
              - script.execute: update_glucose_display
  # GlucoCraft's setting Fade the words when there is no current reading (the configuration sensor's boolean
  # attribute flash_no_current_data, "on" / "off", on by default): the throb of the words in the value's place while
  # there is no current reading (refresh_glucose_block; lvgl_compat.h lvc_throb). Any other text (Home Assistant
  # restarting) keeps the setting.
  - platform: homeassistant
    id: ha_flash_no_current_data
    entity_id: sensor.glucocraft_configuration
    attribute: flash_no_current_data
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                if (x != "on" && x != "off") return false;
                const bool on = x == "on";
                if (on == id(flash_on)) return false;
                id(flash_on) = on;
                return true;
            then:
              - script.execute: refresh_glucose_block
  - platform: homeassistant
    id: ha_status
    entity_id: sensor.glucocraft_status
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.empty() || x == "unavailable" || x == "unknown" || x == "None") return;   // keep the last status
            id(gc_status) = x;
            // the status decides the words without current data ("Sensor expired") and the throb of the status bar's
            // "Sensor expiry passed" (the 1-second interval); whether the data are current is GlucoCraft's flag
            // (ha_data_stale), never the status
            bool exp = (x == "expired");
            if (exp != id(sensor_expired)) {
              id(sensor_expired) = exp;
              id(refresh_glucose_block).execute();
              id(update_glucose_display).execute();
            }
  - platform: homeassistant
    id: ha_status_color
    entity_id: sensor.glucocraft_status
    attribute: color
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.size() == 7 && x[0] == '#') id(gc_status_color) = (int) strtol(x.c_str() + 1, nullptr, 16);
  # the newest reading's value (mg/dL), an attribute of the same sensor: what the value from Last glucose reading must
  # equal. Home Assistant sends an attribute only when it changes, so a value that stays the same is never missed here;
  # if that value's entity is gone (its id was changed), the two differ. Without the attribute: no check.
  - platform: homeassistant
    id: ha_last_reading_mgdl
    entity_id: sensor.glucocraft_last_reading_time
    attribute: last_reading_mgdl
    internal: true
    on_value:   # the three updates of one reading arrive in any order: the last of them stores it
      then:
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: store_glucose_reading
  # the newest reading's own time (epoch seconds): an attribute of the Last reading time sensor, whose state changes
  # with every reading
  - platform: homeassistant
    id: ha_last_reading_ts
    entity_id: sensor.glucocraft_last_reading_time
    attribute: last_reading_ts
    internal: true
    on_value:   # a new reading (even an unchanged value) -> store it at its own time
      then:
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - script.execute: store_glucose_reading
              - script.execute: update_glucose_display   # the trend rule uses the new reading time
  # Source name exactly as the user's source calls it in Home Assistant (no list of known services, any CGM works).
  # GlucoCraft's sensor.glucocraft_active_source = the source entity's friendly name; rename it in Home Assistant to change it.
  - platform: homeassistant
    id: glucose_data_source
    entity_id: sensor.glucocraft_active_source
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: data_source_label
            text: !lambda |-
              // typographic quotation marks, dashes and the ellipsis as plain ones: the fonts do not hold them
              // "unknown" / "unavailable" (Home Assistant restarting) keep the name shown; GlucoCraft's "Unknown" (no
              // source known) clears it, as on the display card
              if (x == "unknown" || x == "unavailable") return std::string(lv_label_get_text(id(data_source_label)));
              std::string s = gcu::plain_punctuation(x);
              if (s == "Unknown") return std::string("");
              return s;
  - platform: homeassistant
    id: cgm_sensor_expiry
    # GlucoCraft's expiry, normalized from whatever expiry entity the user picked (or none): UTC ISO, or
    # None when there is no usable expiry -> nothing shown and never "expired"
    entity_id: sensor.glucocraft_sensor_expiry
    attribute: expires_at
    internal: true
    on_value:
      then:
        - lambda: |-
            // x is already passed as the new value
            // too short / not a date = no usable expiry; GlucoCraft sends ISO
            if (x.length() < 16 || atoi(x.substr(0, 4).c_str()) < 2000) {
              id(global_sensor_expiry_str) = "";
              id(sensor_expiry_epoch) = 0;
              if (id(sensor_expired)) {   // expiry gone: no expired state left
                id(sensor_expired) = false;
                id(refresh_glucose_block).execute();
                id(update_glucose_display).execute();
              }
              return;
            }

            // Parse ISO 8601 datetime: YYYY-MM-DDThh:mm:ss+00:00 (UTC)
            std::string dt = x;

            // Parse UTC year, month, day, hour, minute
            int year = atoi(dt.substr(0, 4).c_str()), month = atoi(dt.substr(5, 2).c_str()),
                day = atoi(dt.substr(8, 2).c_str()), hour = atoi(dt.substr(11, 2).c_str()),
                minute = atoi(dt.substr(14, 2).c_str());
            // seconds too (without them the countdown would run up to 59 s early, unlike the card)
            int second = (dt.length() >= 19 && dt[16] == ':') ? atoi(dt.substr(17, 2).c_str()) : 0;

            // UTC -> epoch with plain date arithmetic (days_from_civil), not setenv("TZ") / mktime: the process
            // time zone stays untouched. The string's offset is honored.
            auto days_from_civil = [](long y, long m, long d) -> long {
              y -= m <= 2;
              const long era = (y >= 0 ? y : y - 399) / 400;
              const long yoe = y - era * 400;
              const long doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
              const long doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
              return era * 146097 + doe - 719468;
            };
            long offset_s = 0;
            if (dt.length() >= 25 && (dt[19] == '+' || dt[19] == '-')) {
              offset_s = atoi(dt.substr(20, 2).c_str()) * 3600L + atoi(dt.substr(23, 2).c_str()) * 60L;
              if (dt[19] == '-') offset_s = -offset_s;
            }
            // 64-bit arithmetic: long is 32 bits on these chips and an epoch in seconds passes its range in 2038
            time_t utc_epoch = (time_t)((int64_t) days_from_civil(year, month, day) * 86400
                                        + hour * 3600L + minute * 60L + second - offset_s);
            // the countdown (1-second interval) works from this UTC epoch alone (no DST error)
            id(sensor_expiry_epoch) = (uint32_t) utc_epoch;

            // Initial display string (will be updated by interval with countdown)
            id(global_sensor_expiry_str) = gct::status_expiry_none;

            struct tm local_tm;
            localtime_r(&utc_epoch, &local_tm);
            ESP_LOGD("sensor", "CGM expiry: %s (local %d-%02d-%02d %02d:%02d)", x.c_str(), local_tm.tm_year + 1900,
                     local_tm.tm_mon + 1, local_tm.tm_mday, local_tm.tm_hour, local_tm.tm_min);

binary_sensor:
  # Warm-up = GlucoCraft's flag (new sensor seen via the expiry entity, or the source's warm-up marker), any CGM
  - platform: homeassistant
    id: ha_sensor_warmup
    entity_id: binary_sensor.glucocraft_sensor_warm_up
    internal: true
    # the first value after a boot runs on_state too (ESPHome skips it by default): a panel started during a
    # warm-up or without current data shows it at once
    trigger_on_initial_state: true
    on_state:
      then:
        - lambda: |-
            id(sensor_warmup_active) = x;
        - script.execute: refresh_glucose_block    # the warm-up words throb too
        - script.execute: update_glucose_display   # the warm-up words in the value's place
  # GlucoCraft's custom ranges switch -> "Custom ranges" in the status bar
  - platform: homeassistant
    id: ha_custom_ranges
    entity_id: binary_sensor.glucocraft_using_custom_ranges
    internal: true
  - platform: status
    name: "Status"
    entity_category: diagnostic
  - platform: homeassistant
    id: ha_data_stale
    entity_id: binary_sensor.glucocraft_no_current_data
    internal: true
    # the first value after a boot runs on_state too (ESPHome skips it by default): a panel started during a
    # warm-up or without current data shows it at once
    trigger_on_initial_state: true
    on_state:
      then:
        - lambda: |-
            id(data_stale) = x;
            if (x) ESP_LOGW("stale", "GlucoCraft reports no current data");
            else ESP_LOGI("stale", "The glucose data are current again");
        - script.execute: refresh_glucose_block
        - script.execute: update_glucose_display   # the words in the value's place, or the value again

button:
  - platform: restart
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
    icon: "mdi:shield-check"
    internal: true
  - platform: template
    name: "Request Backfill"
    icon: "mdi:download"
    on_press:
      - logger.log: "Manual backfill requested"
      # Background re-download; the current screen stays up and is replaced only on success
      - lambda: |-
          id(bf_ok) = false;
          id(bf_retry_ms) = 0;
      - script.execute: backfill_retry


script:
  # ================================================================
  # BACKFILL: downloads run in a background task (glucocraft_panel_binary.h),
  # the loop only waits for the result - a slow network cannot trip the
  # task watchdog. A failed boot download shows live data and retries with
  # backoff (15 s -> 5 min) instead of waiting for the hourly refresh.
  # ================================================================
  - id: backfill_boot_sequence
    mode: single
    then:
      - logger.log: "=== BACKFILL BOOT SEQUENCE ==="
      - script.execute: enter_loading_mode
      - delay: 1s
      # Step 1: download binary + delta in the background (normally ~2 s)
      - lambda: |-
          ESP_LOGI("boot", "Step 1: Download binary to PSRAM (background task)");
          lv_label_set_text(id(loading_progress_label), gct::loading_downloading);
          backfill_start_download(true);
      - wait_until:
          condition:
            lambda: 'return backfill_download_state() != 1;'
          timeout: 45s
      - if:
          condition:
            lambda: |-
              if (backfill_download_state() == 2 && backfill_commit_download()) return true;
              ESP_LOGW("boot", "Backfill not available yet - showing live data, retrying in background");
              return false;
          then:
            - script.execute: backfill_apply_full
            - script.wait: backfill_apply_full
            - lambda: 'lv_label_set_text(id(loading_progress_label), gct::loading_drawing);'
            - delay: 200ms
            - script.execute: exit_loading_mode
          else:
            - lambda: 'lv_label_set_text(id(loading_progress_label), gct::loading_failed);'
            - delay: 1s
            - script.execute: exit_loading_mode
            - script.execute: backfill_retry

  # Load a committed backfill into the 6h ring buffer + all period graphs.
  # Used at boot (inside loading mode) and after a successful retry (live screen stays up).
  - id: backfill_apply_full
    mode: single
    then:
      # Step 2: 6h readings from the binary, Step 3: merge the delta (downloaded with it)
      - lambda: |-
          ESP_LOGI("boot", "Step 2: Loading readings from binary");
          if (id(loading_mode_active)) lv_label_set_text(id(loading_progress_label), gct::loading_readings);
          for (int i = 0; i < 180; i++) {
            id(glucose_history)[i] = 0;
            id(glucose_history_ts)[i] = 0;
          }
          id(glucose_history_count) = 0;
          id(glucose_history_index) = 0;

          int loaded = backfill_load(id(glucose_history), id(glucose_history_ts), 180);

          if (loaded > 0) {
            id(glucose_history_count) = loaded;
            id(glucose_history_index) = loaded % 180;

            int delta_added = backfill_load_delta(
              id(glucose_history), id(glucose_history_ts),
              id(glucose_history_count),
              180
            );
            if (delta_added > 0) {
              int new_count = id(glucose_history_count) + delta_added;
              if (new_count > 180) new_count = 180;
              id(glucose_history_count) = new_count;
              id(glucose_history_index) = new_count % 180;
            }

            {
              auto tb = id(ha_time).now();
              if (tb.is_valid()) gc_rebuild_6h(id(glucose_history), id(glucose_history_ts), &id(glucose_history_count),
                                               &id(glucose_history_index), (uint32_t) tb.timestamp);
            }
            ESP_LOGI("boot", "Loaded %d readings (+%d from delta)", loaded, delta_added);   // counts only (health data)
          } else {
            ESP_LOGW("boot", "No 6h readings in binary - 6h graph fills from live updates");
          }
          id(bf_ok) = true;
          id(bf_retry_ms) = 15000;
      - delay: 100ms
      # Step 4: period graphs
      - lambda: |-
          if (id(loading_mode_active)) lv_label_set_text(id(loading_progress_label), gct::loading_graph_24h);
          int valid = backfill_load_period(
            id(glucose_graph_24h), 340, 24,
            id(glucose_graph_24h_min), id(glucose_graph_24h_max), id(glucose_graph_24h_join)
          );
          ESP_LOGI("boot", "24h graph: %d valid slots", valid);
      - delay: 100ms
      - lambda: |-
          if (id(loading_mode_active)) lv_label_set_text(id(loading_progress_label), gct::loading_graph_7d);
          int valid = backfill_load_period(
            id(glucose_graph_7d), 340, 168,
            id(glucose_graph_7d_min), id(glucose_graph_7d_max), id(glucose_graph_7d_join)
          );
          ESP_LOGI("boot", "7d graph: %d valid slots", valid);
      - delay: 100ms
      - lambda: |-
          if (id(loading_mode_active)) lv_label_set_text(id(loading_progress_label), gct::loading_graph_14d);
          int valid = backfill_load_period(
            id(glucose_graph_14d), 340, 336,
            id(glucose_graph_14d_min), id(glucose_graph_14d_max), id(glucose_graph_14d_join)
          );
          ESP_LOGI("boot", "14d graph: %d valid slots", valid);
      - delay: 100ms
      - lambda: |-
          if (id(loading_mode_active)) lv_label_set_text(id(loading_progress_label), gct::loading_graph_30d);
          int valid = backfill_load_period(
            id(glucose_graph_30d), 340, 720,
            id(glucose_graph_30d_min), id(glucose_graph_30d_max), id(glucose_graph_30d_join)
          );
          ESP_LOGI("boot", "30d graph: %d valid slots", valid);
      - delay: 100ms
      - lambda: |-
          if (id(loading_mode_active)) lv_label_set_text(id(loading_progress_label), gct::loading_graph_90d);
          int valid = backfill_load_period(
            id(glucose_graph_90d), 340, 2160,
            id(glucose_graph_90d_min), id(glucose_graph_90d_max), id(glucose_graph_90d_join)
          );
          ESP_LOGI("boot", "90d graph: %d valid slots", valid);
      - delay: 100ms
      - lambda: |-
          if (id(loading_mode_active)) lv_label_set_text(id(loading_progress_label), gct::loading_graph_180d);
          int valid = backfill_load_period(
            id(glucose_graph_180d), 340, 4320,
            id(glucose_graph_180d_min), id(glucose_graph_180d_max), id(glucose_graph_180d_join)
          );
          ESP_LOGI("boot", "180d graph: %d valid slots", valid);
      - delay: 100ms
      - if:
          condition:
            lambda: 'return !id(loading_mode_active);'
          then:
            # one redraw per loop pass (back to back they block the loop for about 6.8 s)
            - script.execute: update_stats_display
            - delay: 200ms
            - script.execute: populate_period_stats
            - delay: 200ms
            - script.execute: draw_period_graphs
            - delay: 500ms
            - script.execute: draw_glucose_graph

  # Retry until a backfill is applied: 15 s, 30 s, 1, 2, 4, then every 5 min.
  - id: backfill_retry
    mode: single
    then:
      - while:
          condition:
            lambda: 'return !id(bf_ok);'
          then:
            - delay: !lambda 'return id(bf_retry_ms);'
            - wait_until:
                condition:
                  lambda: 'return backfill_download_state() != 1;'
                timeout: 100s
            - if:
                condition:
                  lambda: 'return backfill_download_state() != 2;'
                then:
                  - lambda: 'backfill_start_download(true);'
                  - wait_until:
                      condition:
                        lambda: 'return backfill_download_state() != 1;'
                      timeout: 100s
            - if:
                condition:
                  lambda: 'return backfill_download_state() == 2 && backfill_commit_download();'
                then:
                  - logger.log: "Backfill retry succeeded - loading history"
                  - script.execute: backfill_apply_full
                  - script.wait: backfill_apply_full
                else:
                  - lambda: |-
                      id(bf_retry_ms) = id(bf_retry_ms) < 15000 ? 15000 : std::min<uint32_t>(id(bf_retry_ms) * 2, 300000);
                      ESP_LOGW("backfill", "Backfill retry failed - next try in %u s", (unsigned) (id(bf_retry_ms) / 1000));

  # Hourly refresh of the period graphs/stats; a failed attempt keeps the current
  # data and retries every 5 min (not only an hour later).
  - id: backfill_hourly
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("refresh", "Hourly backfill refresh - background download");
          id(bf_refresh_tries) = 0;
      - while:
          condition:
            lambda: 'return id(bf_ok) && id(bf_refresh_tries) < 10;'
          then:
            - lambda: |-
                id(bf_refresh_tries)++;
                backfill_start_download(false);
            - wait_until:
                condition:
                  lambda: 'return backfill_download_state() != 1;'
                timeout: 100s
            - if:
                condition:
                  lambda: 'return backfill_download_state() == 2 && backfill_commit_download();'
                then:
                  # one period per loop pass (each scans up to 200 days of readings), as the boot path does
                  - lambda: |-
                      backfill_load_period(id(glucose_graph_24h), 340, 24,
                                           id(glucose_graph_24h_min), id(glucose_graph_24h_max), id(glucose_graph_24h_join));
                  - delay: 100ms
                  - lambda: |-
                      backfill_load_period(id(glucose_graph_7d), 340, 168,
                                           id(glucose_graph_7d_min), id(glucose_graph_7d_max), id(glucose_graph_7d_join));
                  - delay: 100ms
                  - lambda: |-
                      backfill_load_period(id(glucose_graph_14d), 340, 336,
                                           id(glucose_graph_14d_min), id(glucose_graph_14d_max), id(glucose_graph_14d_join));
                  - delay: 100ms
                  - lambda: |-
                      backfill_load_period(id(glucose_graph_30d), 340, 720,
                                           id(glucose_graph_30d_min), id(glucose_graph_30d_max), id(glucose_graph_30d_join));
                  - delay: 100ms
                  - lambda: |-
                      backfill_load_period(id(glucose_graph_90d), 340, 2160,
                                           id(glucose_graph_90d_min), id(glucose_graph_90d_max), id(glucose_graph_90d_join));
                  - delay: 100ms
                  - lambda: |-
                      backfill_load_period(id(glucose_graph_180d), 340, 4320,
                                           id(glucose_graph_180d_min), id(glucose_graph_180d_max), id(glucose_graph_180d_join));
                      ESP_LOGI("refresh", "Period graphs reloaded (download %u ms)", (unsigned) backfill_download_ms());
                      id(bf_refresh_tries) = 99;
                  - delay: 100ms
                  - script.execute: populate_period_stats
                  - delay: 200ms
                  - script.execute: update_stats_display
                  - delay: 200ms
                  - script.execute: draw_period_graphs
                  - script.wait: draw_period_graphs
                else:
                  - lambda: 'ESP_LOGW("refresh", "Hourly refresh attempt %d failed - keeping current data, retry in 5 min", id(bf_refresh_tries));'
                  - delay: 5min

  # A change of unit, ranges or weekly standard downloads the files at once (not at the next hourly refresh, which
  # would leave the old unit in the weekly descriptions for up to 60 min). GlucoCraft reloads on a settings change:
  # 15 s for it to start; a failed attempt retries as the hourly refresh does.
  - id: backfill_settings_changed
    mode: restart
    then:
      - delay: 15s
      - wait_until:
          condition:
            lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
          timeout: 120s
      - script.wait: backfill_hourly
      - if:
          condition:
            lambda: 'return id(bf_ok);'
          then:
            - logger.log: "Settings changed - downloading the files"
            - script.execute: backfill_hourly
            - script.wait: backfill_hourly
            - if:
                condition:
                  lambda: 'return id(current_page) >= 7 && id(current_page) <= 15;'
                then:
                  - script.execute: draw_trend_page

  # The glucose block on the screen, and the throb of the words in its value's place (update_glucose_display draws
  # them): while there is no current reading (gc_units.h no_reading_words: a warm-up, or no current data by Home
  # Assistant's flag or the panel's own count past GlucoCraft's limit), all three words, "Sensor warming up" /
  # "Sensor expired" / "No current data", throb while the setting is on (lvgl_compat.h lvc_throb), for the first 30
  # minutes of each episode (words_throb, gc_units.h throb_window); never on a hidden block or under the screen
  # without Home Assistant. Called on every state change, on a change of the setting, when the 30 minutes end and
  # whenever the screen returns from a weekly page, so the block cannot get lost.
  - id: refresh_glucose_block
    mode: restart
    then:
      - lambda: |-
          const bool owned = (id(current_page) >= 7 && id(current_page) <= 15) || id(loading_mode_active);  // weekly pages / loading own the screen
          const bool words = gcu::no_reading_words(id(sensor_warmup_active), id(data_stale) || id(local_stale),
                                                   id(sensor_expired)) != nullptr;   // no current reading
          lvc_throb(id(no_reading_label), words && !owned && id(flash_on) && id(words_throb) && !id(no_ha_screen_on));
          if (owned) return;
          lv_obj_clear_flag(id(glucose_data_container), LV_OBJ_FLAG_HIDDEN);

  # Under the words without a current reading (no_reading_box), the last reading and when it was taken, in the text
  # color and still (only the words throb): "Last reading: 64 mg/dL" (the live value, or the saved one after a reboot
  # without Home Assistant, each with its LO / HI mark; gc_units.h last_reading), then "Today at 17:39 (2 h 0 min ago)"
  # (gc_units.h reading_when and reading_ago, from last_reading_epoch), split before the bracket into "Today at 17:39" /
  # "(2 h 0 min ago)" where one line does not fit (SPLIT_AGE: the square and 3.5-inch layouts; make_glucocraft_landscape.py
  # nr_split). A line that is not known is hidden: without any reading only the words show; while the reading's time
  # is ahead of the clock (time_untrusted) the last reading has no time line.
  # Called by update_glucose_display and, while the words show, every second by the interval; a label is set only when
  # its text changes.
  - id: update_last_reading
    mode: restart
    then:
      - lambda: |-
          constexpr bool SPLIT_AGE = true;   // true: the age on a line of its own (nr_split)
          static std::string shown[3];
          lv_obj_t *labels[3] = {id(last_reading_label), id(reading_when_label), id(reading_ago_label)};
          char line[3][96] = {"", "", ""};
          // the value and the time of one reading: while the value in hand is not the newest reading's (value_lost:
          // the value's entity id was changed and not undone), the newest reading's own value from the Last reading
          // time sensor, with the time that belongs to it
          const bool live = !isnan(id(glucose_current).state);
          const double newest = gcu::attr_value(id(ha_last_reading_mgdl).state);
          if (id(value_lost) && newest > 0) gcu::last_reading(line[0], sizeof(line[0]), (float) newest, 0);
          else gcu::last_reading(line[0], sizeof(line[0]), live ? id(glucose_current).state : id(saved_glucose_mgdl),
                                 live ? gcu::limit() : id(saved_glucose_limit));
          const auto now = id(ha_time).now();
          const uint32_t at = id(last_reading_epoch);
          char when[64];
          // no time line while the reading's time is ahead of the clock (its age cannot be known)
          if (!id(time_untrusted) && now.is_valid() && at > 0 &&
              gcu::reading_when(when, sizeof(when), at, (uint32_t) now.timestamp)) {
            char ago[48];
            gcu::reading_ago(ago, sizeof(ago), ((uint32_t) now.timestamp > at ? (uint32_t) now.timestamp - at : 0) / 60);
            if (SPLIT_AGE) {
              snprintf(line[1], sizeof(line[1]), "%s", when);
              gcu::fill(line[2], sizeof(line[2]), gct::no_reading_ago_line, {{"ago", ago}});
            } else {
              gcu::fill(line[1], sizeof(line[1]), gct::no_reading_time_ago, {{"when", when}, {"ago", ago}});
            }
          }
          for (int i = 0; i < 3; i++) {
            if (shown[i] == line[i]) continue;
            shown[i] = line[i];
            lv_label_set_text(labels[i], line[i]);
            if (line[i][0] != '\0') lv_obj_remove_flag(labels[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(labels[i], LV_OBJ_FLAG_HIDDEN);
          }

  - id: enter_loading_mode
    mode: single
    then:
      - lambda: |-
          id(loading_mode_active) = true;

          id(glucose_history_index) = 0;
          id(glucose_history_count) = 0;
          id(current_page) = 0;
          id(page_idle_seconds) = 0;

          ESP_LOGI("loading", "Entering loading mode");
      - lvgl.widget.hide: glucose_data_container
      - lvgl.widget.hide: graph_container
      - lvgl.widget.hide: status_bar
      - lvgl.widget.show: loading_container

  - id: exit_loading_mode
    mode: restart
    then:
      - lambda: |-
          if (!id(loading_mode_active)) {
            ESP_LOGI("exit_loading", "Already exited, ignoring");
            return;
          }

          ESP_LOGI("exit_loading", "Exiting with %d readings", id(glucose_history_count));
          id(loading_mode_active) = false;
          id(boot_sequence_complete) = true;
      - if:
          condition:
            lambda: 'return !id(loading_mode_active);'
          then:
            - lvgl.widget.show: glucose_data_container
            - lvgl.widget.show: graph_container
            - lvgl.widget.show: status_bar
            - lvgl.widget.hide: loading_container
            - lvgl.page.show:
                id: page_6h
                animation: NONE
                time: 0ms
            - lvgl.widget.hide: about_screen   # the About page is left with it
            - lambda: 'if (id(current_page) >= 16) id(current_page) = 0;'
            - lvgl.canvas.fill:
                id: glucose_canvas
                color: 0x0a0a0a
            - script.execute: update_glucose_display
            - script.execute: store_glucose_reading
            - script.execute: refresh_glucose_block
            - delay: 200ms
            - script.execute: update_stats_display
            - delay: 200ms
            - script.execute: populate_period_stats
            - delay: 200ms
            - script.execute: draw_period_graphs

  # ================================================================
  # PAGE NAVIGATION: swipes work on the whole screen, not only on the graph, with one rule for
  # every swipe. The pages' own swipe handlers and the top layer's containers (clock header, glucose block, the
  # no-data / expired blocks, weekly-page text, status bar) call these two scripts. current_page 0-15 in order;
  # 16 = About (a full-screen top-layer screen, show_outer_page); the cycle has 17 pages; right from 0 opens About,
  # right from About = the last weekly page. Nothing while loading (the loading screen covers
  # the pages). lv_indev_wait_release: the rest of this touch is ignored, so a finger left on the
  # screen after a swipe is never read as a press and hold (or as a tap) on what is shown next.
  # ================================================================
  # The top layer that belongs to the page now shown, at once: the weekly information and canvas on pages 7-15, the
  # glucose block on the others. Called after every page change (both scripts
  # below, the press-and-hold handlers); the 1-second interval calls it as well, so a missed call is made up.
  # last_drawn_trend_page records what the top layer shows, so a weekly page is drawn once.
  - id: sync_page_mode
    mode: queued
    then:
      - lambda: |-
          const int cp = id(current_page);
          if (cp >= 7 && cp <= 15) {
            if (cp != id(last_drawn_trend_page)) {
              id(last_drawn_trend_page) = cp;
              id(draw_trend_page).execute();
            }
          } else if (id(last_drawn_trend_page) != -1) {
            id(exit_trend_to_glucose).execute();   // sets last_drawn_trend_page = -1
          }

  - id: nav_next
    mode: single
    then:
      - if:   # a swipe on the start-up screen ends it, and the page stays (end_startup clears startup_active at once,
              # so the page change is in the else branch, never in a second test after it)
          condition:
            lambda: 'return id(startup_active);'
          then:
            - lambda: 'lv_indev_wait_release(lv_indev_active());'
            - script.execute: end_startup
          else:
            - if:
                condition:   # nothing while loading or while the screen without Home Assistant is up
                  lambda: 'return !id(loading_mode_active) && !id(no_ha_screen_on);'
                then:
                  - lambda: 'lv_indev_wait_release(lv_indev_active());'
                  - if:
                      condition:
                        lambda: 'return id(current_page) < 15;'
                      then:
                        - lvgl.page.next:
                            animation: NONE
                            time: 0ms
                        - lambda: 'id(page_idle_seconds) = 0; id(current_page) += 1;'
                      else:   # 15 -> 16 (About) -> 0 (the 6-hour page)
                        - lambda: 'id(page_idle_seconds) = 0; id(current_page) = id(current_page) >= 16 ? 0 : id(current_page) + 1;'
                        - script.execute: show_outer_page
                  - script.execute: sync_page_mode

  - id: nav_prev
    mode: single
    then:
      - if:   # a swipe on the start-up screen ends it, and the page stays (end_startup clears startup_active at once,
              # so the page change is in the else branch, never in a second test after it)
          condition:
            lambda: 'return id(startup_active);'
          then:
            - lambda: 'lv_indev_wait_release(lv_indev_active());'
            - script.execute: end_startup
          else:
            - if:
                condition:   # nothing while loading or while the screen without Home Assistant is up
                  lambda: 'return !id(loading_mode_active) && !id(no_ha_screen_on);'
                then:
                  - lambda: 'lv_indev_wait_release(lv_indev_active());'
                  - if:
                      condition:
                        lambda: 'return id(current_page) >= 1 && id(current_page) <= 15;'
                      then:
                        - lvgl.page.previous:
                            animation: NONE
                            time: 0ms
                        - lambda: 'id(page_idle_seconds) = 0; id(current_page) -= 1;'
                      else:   # 0 -> 16 (About) -> 15 (the last weekly page)
                        - lambda: 'id(page_idle_seconds) = 0; id(current_page) = id(current_page) == 0 ? 16 : id(current_page) - 1;'
                        - script.execute: show_outer_page
                  - script.execute: sync_page_mode

  # The page and the top-layer screen for the pages at the ends of the cycle: 0 the 6-hour page, 15 the last weekly page,
  # 16 About (about_screen, which covers the empty page_about).
  - id: show_outer_page
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            - lvgl.page.show:
                id: page_6h
                animation: NONE
                time: 0ms
      - if:
          condition:
            lambda: 'return id(current_page) == 15;'
          then:
            - lvgl.page.show:
                id: page_trend_minmax
                animation: NONE
                time: 0ms
      - if:
          condition:
            lambda: 'return id(current_page) >= 16;'
          then:
            - lvgl.page.show:
                id: page_about
                animation: NONE
                time: 0ms
      - lambda: |-
          if (id(current_page) == 16) lv_obj_remove_flag(id(about_screen), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(about_screen), LV_OBJ_FLAG_HIDDEN);

  # The start-up screen ends (its 15 seconds, or a swipe): the normal screen. Only once: the 15 seconds after a swipe
  # ended it call it again.
  - id: end_startup
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(startup_active);'
          then:
            - lambda: 'id(startup_active) = false;'
            - lvgl.widget.hide: startup_screen

  # The screen without Home Assistant (no_ha_screen in the top layer; the 1-second interval decides and fills its
  # lines): shown, it covers everything below the clock and the date (the About page, which covers the clock, is left
  # for the 6-hour page first); hidden again, the screen it covered is there as it was.
  - id: no_ha_screen_apply
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(no_ha_screen_on);'
          then:
            - if:
                condition:
                  lambda: 'return id(current_page) >= 16;'
                then:
                  - lambda: 'id(current_page) = 0;'
                  - script.execute: show_outer_page
            - lvgl.widget.show: no_ha_screen
          else:
            - lvgl.widget.hide: no_ha_screen
      - script.execute: refresh_glucose_block

  # ================================================================
  # TREND PAGE DRAWING
  # ================================================================
  - id: exit_trend_to_glucose
    mode: single
    then:
      - lambda: 'id(last_drawn_trend_page) = -1;'
      - lvgl.widget.hide: trend_info_container
      - lvgl.widget.hide: trend_canvas
      - script.execute: refresh_glucose_block

  - id: draw_trend_page
    mode: restart
    then:
      # Show trend UI, hide glucose UI (keep status bar visible)
      - lvgl.widget.hide: glucose_data_container
      - script.execute: refresh_glucose_block   # the hidden block's throb stops
      - lvgl.widget.show: trend_info_container
      - lvgl.widget.show: trend_canvas
      # >>> weekly mini value (call)
      - script.execute: update_weekly_mini
      # <<< weekly mini value (call)
      - lambda: |-
          // current_page: 7=TIR, 8=TITR, 9=Mean, 10=CV, 11=GMI, 12=Low, 13=High, 14=StdDev, 15=Min/Max
          int pg = id(current_page) - 7;
          int tc = backfill_trend_count();
          ESP_LOGI("trend", "Drawing trend page %d (%d weeks)", pg, tc);

          // Weekly pages (the 14-day values at each week's end): the title, and the y range used before any weeks
          // exist. The description line, the target or goal and the standard come from the file alone (GCX1
          // extension, one system); a file without them shows the title alone and no target line. Same texts as the
          // display card. No verdicts and no good/bad zones (GlucoCraft: data only, cited).
          struct TrendPageDef {
            const char* title;
            const char* desc;  // from the file ("" = none)
            float y_min;
            float y_max;
            float target;      // target or goal line from the file, NAN = none
            bool above_meets;  // true: values ABOVE the target are within it (TIR); false: below (CV, Low, High)
          };

          TrendPageDef pages[9] = {
            {gct::weekly_tir_title,       "", 50, 100, NAN, false},
            {gct::weekly_titr_title,      "", 30, 100, NAN, false},
            {gct::weekly_mean_title,      "", 70, 200, NAN, false},
            {gct::weekly_cv_title,        "", 20, 50, NAN, false},
            {gct::weekly_gmi_title,       "", 5, 8, NAN, false},
            {gct::weekly_time_low_title,  "", 0, 25, NAN, false},
            {gct::weekly_time_high_title, "", 0, 25, NAN, false},
            {gct::weekly_sd_title,        "", 15, 55, NAN, false},
            {gct::weekly_min_max_title,   "", 10, 350, NAN, false},
          };

          auto& def = pages[pg];
          // the standard shown, from the file: consensus target or the goal in the settings
          {
            const char* d = backfill_trend_desc(pg);
            if (d) def.desc = d;
            float tv = 0;
            int op = backfill_trend_target(pg, &tv);
            if (op >= 0) { def.target = op == 0 ? NAN : tv; def.above_meets = (op == 1 || op == 2); }
          }

          // Update title and description labels
          lv_label_set_text(id(trend_title_label), def.title);
          {   // the description from the file always has the point: the separator in use, as the display card's dtx()
            char desc[128];
            gcu::sep_copy(desc, sizeof(desc), def.desc);
            lv_label_set_text(id(trend_desc_label), desc);
          }

          // Current week value + direction
          char status_buf[160];
          float current_val = 0;
          const char* direction = "---";

          // Get current week value based on page
          if (tc > 0) {
            switch(pg) {
              case 0: current_val = get_trend_tir(0); break;
              case 1: current_val = get_trend_titr(0); break;
              case 2: current_val = get_trend_mean(0); break;
              case 3: current_val = get_trend_cv(0); break;
              case 4: current_val = get_trend_gmi(0); break;
              case 5: current_val = get_trend_time_low(0); break;
              case 6: current_val = get_trend_time_high(0); break;
              case 7: current_val = get_trend_std_dev(0); break;
              case 8: current_val = get_trend_mean(0); break;  // Will show min/max separately
            }
          }

          // Direction: GlucoCraft's (last 4 weeks vs the 4 before, in plain words), from the file header - one system
          {
            const char* d = backfill_trend_direction(pg);
            if (d) direction = d;
          }

          // Status text: "Last 14 days: VALUE  DIRECTION" (the text color, no verdict)
          if (tc == 0) {   // no file yet = Loading..., a file without weeks = No weekly data yet (like the card)
            snprintf(status_buf, sizeof(status_buf), "%s", backfill_has_stats() ? gct::weekly_status_no_data : gct::weekly_status_loading);
          } else if (pg == 8) {   // first, as on the display card: an empty newest week reads "Min: ---  Max: ---"
            float wk_min = get_trend_min(0);
            float wk_max = get_trend_max(0);
            char a[12] = "---", b2[12] = "---";
            if (wk_min > 0 && wk_max > 0) {   // a week with readings at the sensor's limit alone has no value
              gcu::fmt(a, sizeof(a), wk_min);
              gcu::fmt(b2, sizeof(b2), wk_max);
            }
            gcu::fill(status_buf, sizeof(status_buf), gct::weekly_status_min_max, {{"min", a}, {"max", b2}, {"direction", direction}});
          } else if (isnan(current_val) || (pg == 4 && !(current_val > 0))) {   // this week empty / no GMI
            gcu::fill(status_buf, sizeof(status_buf), gct::weekly_status_value, {{"value", "---"}, {"direction", direction}});
          } else if (pg == 2 || pg == 7) {
            char a[12]; gcu::fmt(a, sizeof(a), current_val);
            gcu::fill(status_buf, sizeof(status_buf), gct::weekly_status_glucose, {{"value", a}, {"unit", gcu::unit()}, {"direction", direction}});
          } else if (pg == 4) {   // GMI in the A1C unit: "6.5%" / "48 mmol/mol" / "6.5% (48 mmol/mol)" (gc_units.h)
            char a[32]; gcu::fmt_gmi(a, sizeof(a), current_val, get_trend_mean(0), true);
            gcu::fill(status_buf, sizeof(status_buf), gct::weekly_status_value, {{"value", a}, {"direction", direction}});
          } else {
            // "12.5%" / "12,5%"; beside the page's target or goal "69.96%" where "70.0%" would be on its other side
            char a[16]; gcu::pct_against(a, sizeof(a), current_val, def.target);
            gcu::fill(status_buf, sizeof(status_buf), gct::weekly_status_value, {{"value", a}, {"direction", direction}});
          }
          lv_label_set_text(id(trend_status_label), status_buf);
          // a line wider than its label (the GMI in both units or in mmol/mol): the description's smaller font, so it
          // stays on one line
          {
            static const lv_font_t *status_font = nullptr;
            if (!status_font) status_font = lv_obj_get_style_text_font(id(trend_status_label), LV_PART_MAIN);
            lv_point_t tsz;
            lv_text_get_size(&tsz, status_buf, status_font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
            int32_t lw = lv_obj_get_style_width(id(trend_status_label), LV_PART_MAIN);
            lv_obj_set_style_text_font(id(trend_status_label), tsz.x > lw
                ? lv_obj_get_style_text_font(id(trend_desc_label), LV_PART_MAIN) : status_font, 0);
          }

          // ========================================
          // DRAW TREND GRAPH ON CANVAS
          // ========================================
          int cw = 480;
          int ch = 189;

          // auto-scale (the same as the display card): 15 % margin top and bottom, the weeks'
          // values centered in the middle 70 %; a spread under the page's minimum is widened evenly. The fixed
          // y_min/y_max above stay only as the fallback before any weeks exist.
          if (tc > 0) {
            static const float min_spread[9] = {10, 10, 20, 10, 0.5f, 4, 4, 10, 20};
            float lo = 1e9f, hi = -1e9f;
            for (int w = 0; w < tc; w++) {
              float v = 0;
              switch (pg) {
                case 0: v = get_trend_tir(w); break;
                case 1: v = get_trend_titr(w); break;
                case 2: v = get_trend_mean(w); break;
                case 3: v = get_trend_cv(w); break;
                case 4: v = get_trend_gmi(w); break;
                case 5: v = get_trend_time_low(w); break;
                case 6: v = get_trend_time_high(w); break;
                case 7: v = get_trend_std_dev(w); break;
                case 8: v = get_trend_min(w); break;
              }
              if (pg == 4 && !(v > 0)) v = NAN;   // no GMI that week: not in the scale
              if (!isnan(v)) { lo = fminf(lo, v); hi = fmaxf(hi, v); }
              if (pg == 8) { float mx = get_trend_max(w); if (!isnan(mx)) { lo = fminf(lo, mx); hi = fmaxf(hi, mx); } }
            }
            if (hi >= lo) {
              if (hi - lo < min_spread[pg]) { float c = (lo + hi) / 2.0f; lo = c - min_spread[pg] / 2.0f; hi = c + min_spread[pg] / 2.0f; }
              float m = (hi - lo) * 0.15f / 0.70f;
              def.y_min = lo - m;
              def.y_max = hi + m;
            }
          }
          lv_canvas_fill_bg(id(trend_canvas), lv_color_hex(0x0a0a0a), LV_OPA_COVER);
          // every shape below goes on one draw layer, rendered once at the end (lvgl_compat.h lvc_begin / lvc_end)
          const uint32_t draw_t0 = millis();
          lvc_begin(id(trend_canvas));

          // Draw colored zone backgrounds
          float y_range = def.y_max - def.y_min;
          auto val_to_y = [&](float val) -> int {
            return ch - (int)((val - def.y_min) / y_range * ch);
          };
          // zone_y: clamped to the canvas - unclamped, a zone value outside the page's y range paints a full row at
          // y = ch (189), about 480 LVGL errors per row, and blocks the loop for 23 s
          auto zone_y = [&](float val) -> int {
            int y = val_to_y(val);
            return y < 0 ? 0 : (y > ch ? ch : y);
          };

          // All graph and trend backgrounds: 60 % (alpha 153) over the black canvas, exactly like the display card
          // (card and panels always match).
          // Target, where one exists (the consensus target, or for the custom standard the goal in the settings):
          // green = within it, red = outside it - the consensus authors' line or the user's goal, not GlucoCraft's
          // judgment. Green #43A047 and red #E53935 at 60 % over black (alpha 153), the same as the card. Two
          // rectangles = two draw calls (fast); no target = neutral gray.
          if (!isnan(def.target)) {
            const uint32_t inside = 0x43A047, outside = 0xE53935;
            int ty = def.target >= def.y_max ? 0 : (def.target <= def.y_min ? ch : zone_y(def.target));
            uint32_t top = def.above_meets ? inside : outside;   // canvas top = values above the target
            uint32_t bottom = def.above_meets ? outside : inside;
            if (ty > 0) lvc_fill_rect(id(trend_canvas), 0, 0, cw, ty, lv_color_hex(top), 153);
            if (ty < ch) lvc_fill_rect(id(trend_canvas), 0, ty, cw, ch - ty, lv_color_hex(bottom), 153);
            if (ty > 0 && ty < ch) lvc_fill_rect(id(trend_canvas), 0, ty, cw, 1, lv_color_hex(0xBBBBBB));
          } else {
            // No target or goal for this measure (consensus: TITR, mean, GMI, SD, min/max): neutral gray #616161
            // - no judgment, no meaning; the white line reads well on it.
            lvc_fill_rect(id(trend_canvas), 0, 0, cw, ch, lv_color_hex(0x616161), 153);
          }

          // Draw axis labels (same style as glucose mode: Roboto 14, white; its glyphs come from the text catalogue, so
          // accented weekday and month names of another language can be drawn)
          lv_draw_label_dsc_t label_dsc;
          lv_draw_label_dsc_init(&label_dsc);
          label_dsc.color = lv_color_hex(0xFFFFFF);  // graph labels white
          label_dsc.font = id(roboto_14)->get_lv_font();

          char y_buf[16];

          // Horizontal grid at round values, labeled like the history graphs
          {
            static const float steps[] = {0.1f, 0.2f, 0.25f, 0.5f, 1, 2, 2.5f, 5, 10, 20, 25, 50, 100};
            // glucose pages (mean, SD, min and max) in mmol/L: steps and labels in mmol/L, positions in mg/dL
            const bool glu_page = (pg == 2 || pg == 7 || pg == 8);
            const float sf = (glu_page && gcu::mmol()) ? 1.0f / gcu::MGDL_PER_MMOLL : 1.0f;
            // the GMI page with the A1C unit mmol/mol: the axis in mmol/mol by the GMI formula (gc_units.h
            // gmi_mmol_from_pct, as the display card); "both": in %
            const bool mmol_mol = (pg == 4 && gcu::a1c_mode() == 1);
            auto to_d = [&](float v) -> float { return mmol_mol ? (float) gcu::gmi_mmol_from_pct(v) : v * sf; };
            auto from_d = [&](float d) -> float { return mmol_mol ? (float) gcu::gmi_pct_from_mmol(d) : d / sf; };
            float raw = (to_d(def.y_max) - to_d(def.y_min)) / 4.0f, step = 100;
            for (float st : steps) { if (st >= raw) { step = st; break; } }
            for (int k = (int)ceilf(to_d(def.y_min) / step - 1e-4f); k * step <= to_d(def.y_max); k++) {
              float gd = k * step;          // display unit
              float g = from_d(gd);         // mg/dL (or %) for the position
              int gy = val_to_y(g);
              if (g < -1e-4f || gy <= 8 || gy >= ch - 24) continue;
              lvc_fill_rect(id(trend_canvas), 0, gy, cw, 1, lv_color_hex(0x404040));
              // one format per axis, the step's decimals for every label ("6.5 / 7.0 / 7.5"), with the decimal
              // separator in use (gc_units.h weekly_axis_label)
              gcu::weekly_axis_label(y_buf, sizeof(y_buf), gd, step);
              lvc_draw_text_edged(id(trend_canvas), 5, gy - 7, 40, &label_dsc, y_buf);   // 5 px from the edge
            }
          }

          // Whose target colors the chart, top right: "Consensus target" or "Custom goal"; no label on a page
          // without a target or goal (its description line says so)
          label_dsc.color = lv_color_hex(0xFFFFFF);
          label_dsc.align = LV_TEXT_ALIGN_RIGHT;
          label_dsc.font = id(roboto_16)->get_lv_font();
          lvc_draw_text_edged(id(trend_canvas), cw - 180, 5, 170, &label_dsc,
                        !isnan(def.target) ? (backfill_trend_custom() ? gct::weekly_target_custom : gct::weekly_target_consensus) : "");
          label_dsc.font = id(roboto_14)->get_lv_font();  // restore
          label_dsc.color = lv_color_hex(0xFFFFFF);  // graph labels white
          label_dsc.align = LV_TEXT_ALIGN_LEFT;

          // Vertical grid lines and X-axis week labels (one week too)
          if (tc > 0) {
            float x_step = tc > 1 ? (float)(cw - 20) / (float)(tc - 1) : 0.0f;
            int margin_left = 10;
            lv_color_t grid_color = lv_color_hex(0x2a2a2a);

            // Draw vertical grid line at every 4th week
            for (int i = 0; i < tc; i += 4) {
              int gx = margin_left + (int)(i * x_step);
              if (gx >= 0 && gx < cw) lvc_fill_rect(id(trend_canvas), gx, 0, 1, ch - 16, grid_color);
            }

            // Left and right borders
            lvc_fill_rect(id(trend_canvas), 0, 0, 1, ch, grid_color);
            lvc_fill_rect(id(trend_canvas), cw - 1, 0, 1, ch, lv_color_hex(0x404040));

            // X-axis labels every 4 weeks
            label_dsc.align = LV_TEXT_ALIGN_CENTER;

            int wk_prev_end = -1000;   // right edge of the label drawn before
            for (int i = 0; i < tc; i += 4) {
              int w = tc - 1 - i;  // Oldest on left
              uint32_t ts = get_trend_start_ts(w);
              if (ts == 0) continue;

              time_t t = (time_t)ts;
              struct tm tm_buf;
              localtime_r(&t, &tm_buf);

              char x_buf[32];
              gcu::day_month(x_buf, sizeof(x_buf), tm_buf.tm_mon, tm_buf.tm_mday, false);   // "Oct 3" / "3 Oct": the middle of the 14-day window

              int lx = margin_left + (int)(i * x_step);
              // measured, centered where the 45 px box centered it; >= 4 px from the neighbor and the edges (so the
              // labels do not overlap on the 3.5-inch layout)
              lv_point_t tsz;
              lv_text_get_size(&tsz, x_buf, label_dsc.font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
              int x0 = (lx - 15 < 0 ? 0 : lx - 15) + 22 - tsz.x / 2;
              if (x0 >= 4 && x0 + tsz.x <= cw - 4 && x0 >= wk_prev_end + 4) {
                lvc_draw_text_edged(id(trend_canvas), x0 - 2, ch - 20, tsz.x + 4, &label_dsc, x_buf);   // 20 px: descenders + 2 px
                wk_prev_end = x0 + tsz.x;
              }
            }
          }
          // The weekly line(s) after the grid, as on every graph (the labels over the data): twice, first the black underlay (4 px
          // wide, a 5 x 5 square under each dot), then the white line (2 px) and its 3 x 3 dots on it; a single
          // week = its dot (a line needs two weeks). The labels follow when the batch ends, over the line.
          for (int pass = 0; pass < 2; pass++) {
            const bool underlay = pass == 0;
            const lv_color_t col = lv_color_hex(underlay ? 0x000000 : 0xFFFFFF);
            const int lw = underlay ? 4 : 2, dot = underlay ? 5 : 3;
            if (tc > 0) {
              auto get_val = [&](int w) -> float {
                switch(pg) {
                  case 0: return get_trend_tir(w);
                  case 1: return get_trend_titr(w);
                  case 2: return get_trend_mean(w);
                  case 3: return get_trend_cv(w);
                  case 4: return get_trend_gmi(w);
                  case 5: return get_trend_time_low(w);
                  case 6: return get_trend_time_high(w);
                  case 7: return get_trend_std_dev(w);
                  case 8: return get_trend_min(w);
                  default: return 0;
                }
              };

              // Plotted oldest (week tc-1) on the left to newest (week 0) on the right
              float x_step = tc > 1 ? (float)(cw - 20) / (float)(tc - 1) : 0.0f;
              int margin_left = 10;

              lv_draw_line_dsc_t line_dsc;
              lv_draw_line_dsc_init(&line_dsc);
              line_dsc.color = col;
              line_dsc.width = lw;
              line_dsc.round_start = true;
              line_dsc.round_end = true;

              for (int i = 0; i < tc - 1; i++) {
                int w1 = tc - 1 - i;      // Older week
                int w2 = tc - 2 - i;      // Newer week
                float v1 = get_val(w1);
                float v2 = get_val(w2);
                if (isnan(v1) || isnan(v2) || (pg == 4 && (!(v1 > 0) || !(v2 > 0)))) continue;   // empty week / no GMI: gap

                // Clamp to y range
                v1 = fmaxf(def.y_min, fminf(def.y_max, v1));
                v2 = fmaxf(def.y_min, fminf(def.y_max, v2));

                int x1 = margin_left + (int)(i * x_step);
                int x2 = margin_left + (int)((i + 1) * x_step);
                int y1 = val_to_y(v1);
                int y2 = val_to_y(v2);

                lv_point_t points[2] = {{(lv_coord_t)x1, (lv_coord_t)y1}, {(lv_coord_t)x2, (lv_coord_t)y2}};
                lvc_draw_line(id(trend_canvas), points, 2, &line_dsc);
              }

              // Draw dots at each data point
              for (int i = 0; i < tc; i++) {
                int w = tc - 1 - i;
                float v = get_val(w);
                if (isnan(v) || (pg == 4 && !(v > 0))) continue;   // no dot for an empty week / a week without GMI
                v = fmaxf(def.y_min, fminf(def.y_max, v));
                int x = margin_left + (int)(i * x_step);
                int y = val_to_y(v);
                lvc_fill_rect(id(trend_canvas), x - dot / 2, y - dot / 2, dot, dot, col);   // a 3 x 3 dot (on 5 x 5 black)
              }
            }

            // Draw second line for Min/Max page (max values)
            if (pg == 8 && tc > 0) {
              float x_step = tc > 1 ? (float)(cw - 20) / (float)(tc - 1) : 0.0f;
              int margin_left = 10;

              lv_draw_line_dsc_t line_dsc2;
              lv_draw_line_dsc_init(&line_dsc2);
              line_dsc2.color = col;
              line_dsc2.width = lw;
              line_dsc2.round_start = true;
              line_dsc2.round_end = true;

              for (int i = 0; i < tc - 1; i++) {
                int w1 = tc - 1 - i;
                int w2 = tc - 2 - i;
                if (isnan(get_trend_max(w1)) || isnan(get_trend_max(w2))) continue;   // empty week: gap (fminf would hide NAN)
                float v1 = fmaxf(def.y_min, fminf(def.y_max, get_trend_max(w1)));
                float v2 = fmaxf(def.y_min, fminf(def.y_max, get_trend_max(w2)));
                int x1 = margin_left + (int)(i * x_step);
                int x2 = margin_left + (int)((i + 1) * x_step);
                int y1 = val_to_y(v1);
                int y2 = val_to_y(v2);
                lv_point_t pts[2] = {{(lv_coord_t)x1, (lv_coord_t)y1}, {(lv_coord_t)x2, (lv_coord_t)y2}};
                lvc_draw_line(id(trend_canvas), pts, 2, &line_dsc2);
              }
              // Dots for max line
              for (int i = 0; i < tc; i++) {
                int w = tc - 1 - i;
                if (isnan(get_trend_max(w))) continue;   // empty week: no dot
                float v = fmaxf(def.y_min, fminf(def.y_max, get_trend_max(w)));
                int x = margin_left + (int)(i * x_step);
                int y = val_to_y(v);
                lvc_fill_rect(id(trend_canvas), x - dot / 2, y - dot / 2, dot, dot, col);   // a 3 x 3 dot (on 5 x 5 black)
              }
            }
          }

          lvc_end(id(trend_canvas));
          ESP_LOGD("trend", "Weekly page drawn in %u ms", (unsigned) (millis() - draw_t0));

  # >>> weekly mini value (script)
  # The square panel's weekly pages (current_page 7-15) hide the glucose block, so a small current value sits in the
  # top-right corner, so the current value is never off screen (widgets in trend_info_container): the value or LO / HI
  # in its range color, its zone word (GlucoCraft's display_word, in the text color: the zone is never shown by color
  # alone), the trend arrow and the reading time (local). The same rule as the glucose block: without a current
  # reading (a warm-up, or no current data) "---" in gray, never a number, with no zone word and no arrow; after the
  # stated expiry, while readings arrive, the value in its zone color as everywhere. Called when a weekly
  # page is drawn and every second on the weekly pages; it changes only what changed. The landscape panels keep the
  # glucose block on the weekly pages: make_glucocraft_landscape.py removes these blocks.
  - id: update_weekly_mini
    mode: restart
    then:
      - lambda: |-
          char v[64], clk[32] = "";
          int col = id(global_glucose_color), ang = -999;
          const bool none = gcu::no_reading_words(id(sensor_warmup_active), id(data_stale) || id(local_stale),
                                                  id(sensor_expired)) != nullptr;   // no current reading
          snprintf(v, sizeof(v), "%s", none ? "---" : id(global_glucose_str).c_str());
          if (!none) ang = id(global_trend_angle);
          const bool gray = none;   // "---" in gray; a value keeps its zone color, also after the stated expiry
          if (gray) col = gcu::theme_color(gcu::TH_TEXT_LABEL);
          if (gray) lv_obj_add_flag(id(weekly_mini_value), LV_OBJ_FLAG_USER_1);   // no Outline text edge on gray
          else lv_obj_remove_flag(id(weekly_mini_value), LV_OBJ_FLAG_USER_1);
          // the reading time: GlucoCraft's last_reading_ts (the saved reading's after a reboot without Home Assistant), local
          uint32_t rts = (uint32_t) strtoul(id(ha_last_reading_ts).state.c_str(), nullptr, 10);
          if (rts <= 1600000000UL) rts = id(saved_glucose_ts);
          if (rts > 1600000000UL) {
            time_t t = (time_t) rts;
            struct tm lt;
            if (localtime_r(&t, &lt)) gcu::clock(clk, sizeof(clk), lt.tm_hour, lt.tm_min);   // "7:46 AM" / "07:46"
          }
          static std::string last_v, last_t = "?", last_w = "?";
          static int last_col = -1, last_ang = -1000, last_wcol = -1;
          if (last_v != v || last_col != col) {
            lv_label_set_text(id(weekly_mini_value), v);
            lv_obj_set_style_text_color(id(weekly_mini_value), lv_color_hex(col), 0);
            last_v = v; last_col = col;
          }
          // the zone word: the glucose block's (global_display_word, empty while the value is not current), in the
          // text color
          const std::string &w = id(global_display_word);
          const int wcol = gcu::theme_color(gcu::TH_TEXT);
          if (last_w != w || last_wcol != wcol) {
            lv_label_set_text(id(weekly_mini_word), w.c_str());
            lv_obj_set_style_text_color(id(weekly_mini_word), lv_color_hex(wcol), 0);
            if (w.empty()) lv_obj_add_flag(id(weekly_mini_word), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(id(weekly_mini_word), LV_OBJ_FLAG_HIDDEN);
            last_w = w; last_wcol = wcol;
          }
          if (ang != last_ang) {   // LVGL 9: 0.1 deg clockwise, the image points right (as the glucose block's arrow)
            if (ang == -999) lv_obj_add_flag(id(weekly_mini_arrow), LV_OBJ_FLAG_HIDDEN);
            else {
              int a = -ang * 10;
              if (a < 0) a += 3600;
              lv_image_set_rotation(id(weekly_mini_arrow), a);
              lv_obj_remove_flag(id(weekly_mini_arrow), LV_OBJ_FLAG_HIDDEN);
            }
            last_ang = ang;
          }
          if (last_t != clk) {
            lv_label_set_text(id(weekly_mini_time), clk);
            if (clk[0]) lv_obj_remove_flag(id(weekly_mini_time), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(weekly_mini_time), LV_OBJ_FLAG_HIDDEN);
            last_t = clk;
          }
  # <<< weekly mini value (script)

  # The panel colors on the screen: the theme_* styles (the LVGL section's style_definitions) take the colors of
  # gc_units.h theme_color(), and every widget that uses one is redrawn. At boot (the colors saved last) and after a change of
  # panel_background or panel_foreground. The graphs' canvases do not use these styles and are not redrawn.
  - id: apply_panel_theme
    mode: queued
    then:
      - lambda: |-
          const lv_color_t background = lv_color_hex(gcu::theme_color(gcu::TH_BACKGROUND));
          const lv_color_t text = lv_color_hex(gcu::theme_color(gcu::TH_TEXT));
          lv_style_set_bg_color(id(theme_background), background);
          lv_style_set_bg_color(id(theme_box), background);
          lv_style_set_border_color(id(theme_box), lv_color_hex(gcu::theme_color(gcu::TH_FRAME)));
          lv_style_set_text_color(id(theme_text), text);
          lv_style_set_image_recolor(id(theme_text), text);
          lv_style_set_text_color(id(theme_text_secondary), lv_color_hex(gcu::theme_color(gcu::TH_TEXT_SECONDARY)));
          lv_style_set_text_color(id(theme_text_label), lv_color_hex(gcu::theme_color(gcu::TH_TEXT_LABEL)));
          lv_style_set_text_color(id(theme_text_progress), lv_color_hex(gcu::theme_color(gcu::TH_PROGRESS)));
          lv_obj_report_style_change(nullptr);   // every widget with any style: these styles are on most of them
          ESP_LOGI("theme", "Panel colors: background #%06X, text #%06X", gcu::theme_color(gcu::TH_BACKGROUND),
                   gcu::theme_color(gcu::TH_TEXT));

  # Every number and every graph again (a change of the unit, the decimal separator, the zone or the band colors):
  # one redraw per loop pass with a pause between them, as the boot path does, so that touches and the Home Assistant
  # connection are served in between (back to back the redraws blocked the loop for seconds)
  - id: redraw_all
    mode: restart
    then:
      - script.execute: update_glucose_display
      - script.execute: update_stats_display
      - delay: 200ms
      - script.execute: populate_period_stats
      - delay: 200ms
      - script.execute: draw_glucose_graph
      - delay: 200ms
      - script.execute: draw_period_graphs
      - script.wait: draw_period_graphs
      - delay: 200ms
      - if:
          condition:
            lambda: 'return id(current_page) >= 7 && id(current_page) <= 15;'
          then:
            - script.execute: draw_trend_page

  # Home Assistant's time zone arrived or changed (the 1-second interval watches it): the
  # time axes, hour and date labels are redrawn in the new zone, one graph per loop pass
  - id: redraw_time_zone
    mode: restart
    then:
      - delay: 200ms
      - script.execute: draw_glucose_graph
      - delay: 300ms
      - script.execute: draw_period_graphs
      - delay: 300ms
      - if:
          condition:
            lambda: 'return id(current_page) >= 7 && id(current_page) <= 15;'
          then:
            - script.execute: draw_trend_page

  - id: update_glucose_display
    mode: restart
    then:
      - lambda: |-
          char buf[64];
          // ONE SYSTEM (docs/DISPLAY_CONTRACT.md): the value's color, the zone, the arrow's angle and the 5-minute
          // delta are GlucoCraft's; the panel only shows them.
          if (!isnan(id(glucose_current).state)) {
            // "120" / "6.7"; a limit reading "LO" / "HI" (gc_units.h)
            gcu::fmt_current(buf, sizeof(buf), id(glucose_current).state, gcu::limit());
            id(global_glucose_str) = buf;
            // the zone color, also of a LO / HI reading (GlucoCraft's zone of a LO reading is always very low and
            // of a HI reading always very high); "#RRGGBB", anything else (Home Assistant restarting) = keep
            const std::string &zc = id(ha_zone_color).state;
            if (zc.size() == 7 && zc[0] == '#') id(global_glucose_color) = (int) strtol(zc.c_str() + 1, nullptr, 16);
          }
          {
            // The zone word under the value: GlucoCraft's display_word ("" while there is no current data, and without
            // the attribute); "unavailable" or "unknown" while Home Assistant restarts keeps the last word. Not shown
            // without a current reading: no current data (also when Home Assistant cannot tell) and warm-up (the value
            // is the last one before the new sensor), when the words take the value's place, nor with a limit reading,
            // when the limit screen takes it. In the text color, also after the stated expiry.
            static std::string word;
            const std::string &dw = id(ha_display_word).state;
            if (id(ha_display_word).has_state() && dw != "unavailable" && dw != "unknown")
              word = (dw == "None") ? std::string("") : dw;
            const bool current = !isnan(id(glucose_current).state) && !id(data_stale) && !id(local_stale) &&
                                 !id(sensor_warmup_active) && gcu::limit() == 0;
            id(global_display_word) = current ? word : std::string("");
          }
          {
            // "Unknown" (GlucoCraft knows no trend) hides the arrow, the trend word and the delta
            const std::string &w = id(ha_trend_description).state;
            if (w == "Unknown") {                 // GlucoCraft knows no trend (after a gap / restart / new sensor)
              id(global_trend_angle) = -999;
              id(global_trend_word) = "";
              id(global_delta_str) = "---";
            } else if (w.size() > 3 && w != "None" && w != "unavailable" && w != "unknown") {
              if (!isnan(id(ha_trend_angle).state)) id(global_trend_angle) = (int) lroundf(id(ha_trend_angle).state);
              // the trend word as GlucoCraft sends it (its language); "unavailable", "unknown" or "None" while Home
              // Assistant restarts keeps the last word
              const std::string &tw = id(ha_trend_word).state;
              if (id(ha_trend_word).has_state() && tw != "unavailable" && tw != "unknown" && tw != "None")
                id(global_trend_word) = tw;
              const double d5 = gcu::attr_value(id(ha_change5).state);   // none: "None" / "unknown"
              if (!isnan(d5)) {
                gcu::fmt_delta(buf, sizeof(buf), d5);   // "+5" / "+0.3"
                id(global_delta_str) = buf;
              }
            }                                     // otherwise (Home Assistant restarting): keep the last ones
          }
      - if:
          condition:
            lambda: 'return !id(loading_mode_active);'
          then:
            - lvgl.label.update:
                id: glucose_value
                text: !lambda return id(global_glucose_str).c_str();
                # GlucoCraft's zone color, also after the sensor's stated expiry while readings still arrive (the red
                # status bar's "Sensor expiry passed" carries the expiry), as on the display card
                text_color: !lambda return lv_color_hex(id(global_glucose_color));
            - lambda: |-
                // No current reading (a warm-up, or no current data by GlucoCraft's flag or the panel's own count):
                // the words in the value's place ("Sensor warming up" / "Sensor expired" / "No current data", at the
                // zone word's large size, wrapped at its width), never a number, with the last reading and its time
                // under them (update_last_reading); the zone word is empty then (global_display_word), and the TREND
                // column and the 5-minute delta show "---". A current limit reading (LO / HI): the limit screen in the
                // value's place (update_limit_screen), the trend blank and the 5-minute delta "---".
                const char *words = gcu::no_reading_words(id(sensor_warmup_active), id(data_stale) || id(local_stale),
                                                          id(sensor_expired));
                const bool limit_now = words == nullptr && gcu::limit() != 0 && !isnan(id(glucose_current).state);
                auto show = [](lv_obj_t *o, bool on) {
                  if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
                  else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
                };
                if (words != nullptr) {
                  lv_label_set_text(id(no_reading_label), words);
                  id(update_last_reading).execute();
                }
                if (limit_now) id(update_limit_screen).execute();
                show(id(no_reading_box), words != nullptr);
                show(id(limit_box), limit_now);
                show(id(glucose_value), words == nullptr && !limit_now);
                show(id(trend_none_label), words != nullptr);
                // The TREND column: the arrow, or with the setting Trend shown as: word the trend word (wrapped at
                // the column's width, a longer word on two lines; worst_case_fit.py); neither while no trend is
                // known. The arrow also while no word has been received yet.
                const bool known = id(global_trend_angle) != -999 && words == nullptr && !limit_now;
                const bool as_word = known && id(trend_word_on) && !id(global_trend_word).empty();
                if (!known || as_word) {
                  lv_obj_add_flag(id(trend_arrow), LV_OBJ_FLAG_HIDDEN);
                } else {
                  // LVGL 9: rotation in 0.1 deg, clockwise. The image points right; +90 deg (rising) = 270 deg.
                  int a = -id(global_trend_angle) * 10;
                  if (a < 0) a += 3600;
                  lv_image_set_rotation(id(trend_arrow), a);
                  lv_obj_remove_flag(id(trend_arrow), LV_OBJ_FLAG_HIDDEN);
                }
                if (as_word) {
                  lv_label_set_text(id(trend_word_label), id(global_trend_word).c_str());
                  lv_obj_remove_flag(id(trend_word_label), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(trend_word_label), LV_OBJ_FLAG_HIDDEN);
                }
                // the zone word under the value in one of two sizes: the smaller where the larger is wider than the
                // label (a long zone word of a translation), measured as LVGL draws it (worst_case_fit.py)
                lv_obj_set_style_text_font(id(display_word_label), lvc_font_that_fits(id(display_word_label),
                    id(global_display_word).c_str(), id(roboto_32)->get_lv_font(), id(roboto_40)->get_lv_font()), 0);
                // 5 MIN DELTA ("---" without a current reading and with a limit reading): "+88" @64 = 108 px in the
                // 115 px column; 4 characters ("-100" = 126 px @64, only on a data jump of >= 20 mg/dL/min) drop to
                // 40 px (76-87 px) so nothing is cut off
                const char *delta = (words != nullptr || limit_now) ? "---" : id(global_delta_str).c_str();
                lv_obj_set_style_text_font(id(delta_value), strlen(delta) > 3
                    ? id(roboto_40)->get_lv_font() : id(roboto_64)->get_lv_font(), 0);
                lv_label_set_text(id(delta_value), delta);
            - lvgl.label.update:
                id: display_word_label
                text: !lambda return id(global_display_word).c_str();
                text_color: !lambda return lv_color_hex(gcu::theme_color(gcu::TH_TEXT));

  # The limit screen in the value's place (limit_box; gc_units.h limit_screen): the zone large in its zone color, the
  # sensor range, since when and the last measured reading; a line without data is hidden. Called by
  # update_glucose_display and, while the screen shows, every second by the interval (the duration counts); a label is
  # set only when its text changes.
  - id: update_limit_screen
    mode: restart
    then:
      - lambda: |-
          static std::string shown[4];
          lv_obj_t *labels[4] = {id(limit_title_label), id(limit_range_label), id(limit_since_label),
                                 id(limit_measured_label)};
          char line[4][gcu::SCREEN_LINE];
          const auto now = id(ha_time).now();
          gcu::limit_screen(line, gcu::limit(), gcu::attr_value(id(ha_limit_since).state),
                            gcu::attr_value(id(ha_last_measured_mgdl).state),
                            gcu::attr_value(id(ha_last_measured_ts).state),
                            now.is_valid() ? (uint32_t) now.timestamp : 0, !id(time_untrusted));
          for (int i = 0; i < 4; i++) {
            if (shown[i] == line[i]) continue;
            shown[i] = line[i];
            lv_label_set_text(labels[i], line[i]);
            if (line[i][0] != '\0') lv_obj_remove_flag(labels[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(labels[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_set_style_text_color(id(limit_title_label), lv_color_hex(id(global_glucose_color)), 0);

  # The updates of one reading arrive one by one (its value and LO / HI mark from Last glucose reading, its own time
  # and value from Last reading time), in any order: the store waits 300 ms after the last of them (mode restart), so
  # that it sees one reading's updates together, whatever their order.
  - id: store_glucose_reading
    mode: restart
    then:
      - delay: 300ms
      - lambda: |-
          // By TIMESTAMP: one reading per 2-minute CLOCK slot (ts / 120, 6 h / 180), the newest
          // in the slot wins - the same rule as gc_rebuild_6h and the display card, never "every 2nd reading".
          // The reading's own time = GlucoCraft's last_reading_ts, Home Assistant clock as the fallback. The gaps in the graph
          // come from these times (the gap rule), not from skipped readings.
          // Not stored: a value that is not this reading's (it would be an old number at a new time). Normal while one
          // reading's updates arrive; the last of them stores it.
          {
            const double want = gcu::attr_value(id(ha_last_reading_mgdl).state);
            const float have = id(glucose_current).state;
            if (!isnan(want) && !isnan(have) && fabs(have - want) > 0.05) return;
          }
          uint32_t rts = 0;
          {
            auto tn = id(ha_time).now();
            uint32_t lr = (uint32_t) strtoul(id(ha_last_reading_ts).state.c_str(), nullptr, 10);
            // the reading's own time, up to the one tolerance ahead of the clock (gc_units.h FUTURE_TOLERANCE_S); a
            // reading further ahead is stored at the clock's time (its own cannot be trusted)
            const bool own_time = tn.is_valid() && lr > 1600000000UL &&
                                  lr <= (uint32_t) tn.timestamp + gcu::FUTURE_TOLERANCE_S;
            // Not stored: a reading older than GlucoCraft's stale threshold (Home Assistant's last state, sent again
            // after a reconnect), and, without the reading's own time, any value while GlucoCraft reports no current
            // data. Home Assistant's stale flag alone is not the test: the reading that ends a no-current-data period arrives
            // before the flag turns off.
            const float thr = id(stale_threshold_min) > 0 ? id(stale_threshold_min) : 15.0f;   // kept across a restart
            if (own_time && (uint32_t) tn.timestamp > lr && (uint32_t) tn.timestamp - lr > (uint32_t) (thr * 60.0f)) return;
            if (!own_time && id(data_stale)) return;
            if (tn.is_valid()) rts = own_time ? lr : (uint32_t) tn.timestamp;
          }
          bool slot_free = rts != 0, same_slot = false;
          if (slot_free && id(glucose_history_count) > 0) {
            uint32_t last_ts = id(glucose_history_ts)[(id(glucose_history_index) + 179) % 180];
            if (last_ts != 0 && rts / 120 == last_ts / 120) { same_slot = rts > last_ts; slot_free = false; }
            else slot_free = last_ts == 0 || rts > last_ts;
          }
          // a reading at the sensor's limit (LO / HI) has no value: never a point of the graph (its stretch is marked at
          // the graph's edge instead)
          const bool measured = gcu::limit() == 0;
          if (!isnan(id(glucose_current).state) && same_slot && measured) {   // newer reading in the same slot replaces it
            int glucose = (int)lroundf(id(glucose_current).state);
            if (glucose > 0 && glucose <= gcu::GLU_MAX) {
              int k = (id(glucose_history_index) + 179) % 180;
              id(glucose_history)[k] = glucose;
              id(glucose_history_ts)[k] = rts;
            }
          }
          if (!isnan(id(glucose_current).state) && slot_free) {
            int glucose = (int)lroundf(id(glucose_current).state);
            if (glucose > 0 && glucose <= gcu::GLU_MAX) {
              if (rts >= id(saved_glucose_ts) + 600 || rts < id(saved_glucose_ts)) {   // survives a reboot
                id(saved_glucose_ts) = rts;
                id(saved_glucose_mgdl) = id(glucose_current).state;
                id(saved_glucose_limit) = gcu::limit();   // with its LO / HI mark
              }
              if (measured) {
                id(glucose_history)[id(glucose_history_index)] = glucose;
                id(glucose_history_ts)[id(glucose_history_index)] = rts;   // the reading's own time
                id(glucose_history_index) = (id(glucose_history_index) + 1) % 180;
                if (id(glucose_history_count) < 180) {
                  id(glucose_history_count)++;
                }
              }
            }
          }
      - if:
          condition:
            lambda: 'return !id(loading_mode_active);'
          then:
            - delay: 500ms
            - script.execute: draw_glucose_graph


  - id: draw_glucose_graph
    mode: restart
    then:
      - lvgl.canvas.fill:
          id: glucose_canvas
          color: 0x0a0a0a
      - lambda: |-
          auto canvas_obj = id(glucose_canvas);
          const int canvas_width = 340;
          const int canvas_height = 150;
          const uint32_t draw_t0 = millis();

          // --- Auto-scale: find data min/max ---
          int data_min = 999, data_max = 0;
          int num_points = id(glucose_history_count);
          if (num_points > 180) num_points = 180;

          auto time_now = id(ha_time).now();
          if (!time_now.is_valid()) return;
          uint32_t now_ts = (uint32_t)time_now.timestamp;
          uint32_t window_seconds = 6 * 3600;
          uint32_t window_start = now_ts - window_seconds;

          for (int i = 0; i < num_points; i++) {
            int idx;
            if (id(glucose_history_count) >= 180) {
              idx = (id(glucose_history_index) - 180 + i + 180) % 180;
            } else {
              idx = i;
            }
            int v = id(glucose_history)[idx];
            uint32_t ts = id(glucose_history_ts)[idx];
            if (ts == 0 || ts < window_start || ts > now_ts) continue;
            if (v > 0 && v <= gcu::GLU_MAX) {
              if (v < data_min) data_min = v;
              if (v > data_max) data_max = v;
            }
          }

          // no reading in the window: the scale of the consensus range (70-180 mg/dL)
          if (data_min >= 999 || data_max <= 0) {
            data_min = 70;
            data_max = 180;
          }

          // 15 % margin at the top and the bottom, the data filling the middle 70 % and centered in it
          // (the same as the display card); a spread under 20 mg/dL is widened evenly
          float lo_v = (float)data_min, hi_v = (float)data_max;
          if (hi_v - lo_v < 20.0f) { float c = (lo_v + hi_v) / 2.0f; lo_v = c - 10.0f; hi_v = c + 10.0f; }
          float margin = (hi_v - lo_v) * 0.15f / 0.70f;
          float glucose_min = lo_v - margin;
          float glucose_max = hi_v + margin;

          float glucose_range = glucose_max - glucose_min;

          // --- glucose_to_y lambda ---
          auto glucose_to_y = [&](float glucose_val) -> int {
            float clamped = glucose_val;
            if (clamped < glucose_min) clamped = glucose_min;
            if (clamped > glucose_max) clamped = glucose_max;
            float y_ratio = (clamped - glucose_min) / glucose_range;
            int y = canvas_height - (int)(y_ratio * canvas_height);
            if (y < 0) y = 0;
            if (y >= canvas_height) y = canvas_height - 1;
            return y;
          };

          // --- Draw color zones (clamped to visible range) ---
          float crit_min = !isnan(id(range_critical_min).state) ? id(range_critical_min).state : 54.0f;
          float crit_max = !isnan(id(range_critical_max).state) ? id(range_critical_max).state : 250.0f;
          float ideal_min = !isnan(id(range_ideal_min).state) ? id(range_ideal_min).state : 70.0f;
          float ideal_max = !isnan(id(range_ideal_max).state) ? id(range_ideal_max).state : 140.0f;
          float normal_min = !isnan(id(range_normal_min).state) ? id(range_normal_min).state : 70.0f;
          float normal_max = !isnan(id(range_normal_max).state) ? id(range_normal_max).state : 180.0f;

          // Zone boundaries sorted high to low: crit_max, normal_max, ideal_max, ideal_min, normal_min, crit_min
          struct Zone { int y_start; int y_end; uint32_t color; };
          // the graph range colors in use (GlucoCraft's band_colors; gc_units.h)
          Zone zones[] = {
            {0,                        glucose_to_y(crit_max),   (uint32_t) gcu::band_color(gcu::Z_VERY_HIGH)},
            {glucose_to_y(crit_max),   glucose_to_y(normal_max), (uint32_t) gcu::band_color(gcu::Z_HIGH)},
            {glucose_to_y(normal_max), glucose_to_y(ideal_max),  (uint32_t) gcu::band_color(gcu::Z_NEAR_HIGH)},
            {glucose_to_y(ideal_max),  glucose_to_y(ideal_min),  (uint32_t) gcu::band_color(gcu::Z_TIGHT)},
            {glucose_to_y(ideal_min),  glucose_to_y(normal_min), (uint32_t) gcu::band_color(gcu::Z_NEAR_LOW)},
            {glucose_to_y(normal_min), glucose_to_y(crit_min),   (uint32_t) gcu::band_color(gcu::Z_LOW)},
            {glucose_to_y(crit_min),   canvas_height,            (uint32_t) gcu::band_color(gcu::Z_VERY_LOW)},
          };

          // zones, grid, labels and title on one draw layer (lvgl_compat.h); the data line after it
          lvc_begin(canvas_obj);
          for (auto &z : zones) {
            int ys = z.y_start < 0 ? 0 : z.y_start;
            int ye = z.y_end > canvas_height ? canvas_height : z.y_end;
            if (ys >= ye) continue;  // Zone not visible in auto-scaled range
            lvc_fill_rect(canvas_obj, 0, ys, canvas_width, ye - ys, lv_color_hex(z.color), 153);  // 60 % over black, = the display card
          }

          // --- Dynamic horizontal grid lines and y-axis labels ---
          lv_draw_label_dsc_t label_dsc;
          lv_draw_label_dsc_init(&label_dsc);
          label_dsc.color = lv_color_hex(0xFFFFFF);  // graph labels white
          label_dsc.font = id(roboto_14)->get_lv_font();

          // Calculate nice grid step (aim for 4-6 lines), round in the display unit (gc_units.h)
          float range_span = glucose_max - glucose_min;
          float step = gcu::axis_step(range_span, 5.0f);
          float first_line = gcu::axis_first(glucose_min, step);
          lv_color_t grid_major = lv_color_hex(0x404040);
          lv_color_t grid_minor = lv_color_hex(0x2a2a2a);

          for (float g = first_line; g <= glucose_max; g += step) {
            int gy = glucose_to_y(g);
            if (gy <= 2 || gy >= canvas_height - 2) continue;  // Skip edges

            bool is_major = gcu::axis_major(g, step);
            lv_color_t gc = is_major ? grid_major : grid_minor;
            lvc_fill_rect(canvas_obj, 0, gy, canvas_width, 1, gc);

            // the value label only clear of the time labels' row (canvas_height - 19): a line closer than 28 px to the
            // bottom keeps its line but not its label (as on the display card)
            if (gy > canvas_height - 28) continue;
            char lbl[8];
            gcu::axis_label(lbl, sizeof(lbl), g, step);
            lvc_draw_text_edged(canvas_obj, 5, gy - 7, 40, &label_dsc, lbl);
          }

          // --- Title ---
          label_dsc.color = lv_color_hex(0xFFFFFF);
          label_dsc.align = LV_TEXT_ALIGN_RIGHT;
          label_dsc.font = id(roboto_16)->get_lv_font();
          lvc_draw_text_edged(canvas_obj, 195, 5, 135, &label_dsc, gct::graph_title_6h);
          label_dsc.font = id(roboto_14)->get_lv_font();
          // The stretches of limit readings in the window (glucocraft_panel_binary.h gc_limit_runs): the files' and the
          // live one, while the current reading is a limit reading (from GlucoCraft's limit_since, else its own time,
          // to now); marked at the edge after the line, which breaks across them
          static GcLimitRun runs[48];
          int n_runs = 0;
          {
            GcLimitRun live{0, 0, 0};
            const bool live_on = gcu::limit() != 0 && !isnan(id(glucose_current).state) && !id(data_stale) &&
                                 !id(local_stale);
            if (live_on) {
              const double since = gcu::attr_value(id(ha_limit_since).state);
              const uint32_t own = (uint32_t) strtoul(id(ha_last_reading_ts).state.c_str(), nullptr, 10);
              live.start = since > 1600000000.0 ? (uint32_t) since : own;
              live.end = now_ts;
              live.kind = (uint8_t) gcu::limit();
            }
            n_runs = gc_limit_runs(window_start, now_ts, runs, 48, true,
                                   live_on && live.start > 1600000000UL && live.start <= now_ts ? &live : nullptr);
          }
          auto draw_marks = [&]() {
            gc_draw_limit_marks(canvas_obj, runs, n_runs, window_start, window_seconds, canvas_width, canvas_height);
          };

          // --- Vertical grid lines at hour boundaries ---
          // at LOCAL whole hours (now_ts % 3600 gives UTC hours, wrong in half-hour time zones)
          const uint32_t hour0 = gcu::local_hour_floor(now_ts);
          lv_color_t vgrid_color = lv_color_hex(0x2a2a2a);
          for (int h = 0; h <= 6; h++) {
            uint32_t hour_epoch = gcu::local_hour_floor(hour0 - (uint32_t)h * 3600);
            if (hour_epoch < window_start || hour_epoch > now_ts) continue;
            int gx = (int)(((uint64_t)(hour_epoch - window_start) * (uint64_t)canvas_width) / window_seconds);
            if (gx < 0 || gx >= canvas_width) continue;
            lvc_fill_rect(canvas_obj, gx, 0, 1, canvas_height, vgrid_color);
          }
          // Left border
          lvc_fill_rect(canvas_obj, 0, 0, 1, canvas_height, vgrid_color);
          // Right border
          lv_color_t border_color = lv_color_hex(0x404040);
          lvc_fill_rect(canvas_obj, canvas_width - 1, 0, 1, canvas_height, border_color);

          // --- X-axis time labels ---
          label_dsc.color = lv_color_hex(0xFFFFFF);  // graph labels white
          label_dsc.align = LV_TEXT_ALIGN_CENTER;
          int prev_right = -1000;   // right edge of the label drawn before (labels go right to left)
          for (int h = 0; h <= 6; h++) {
            uint32_t hour_epoch = gcu::local_hour_floor(hour0 - (uint32_t)h * 3600);   // local whole hours
            if (hour_epoch < window_start || hour_epoch > now_ts) continue;
            int lx = (int)(((uint64_t)(hour_epoch - window_start) * (uint64_t)canvas_width) / window_seconds);

            time_t ht = (time_t)hour_epoch;
            struct tm *lt = localtime(&ht);
            if (!lt) continue;
            char lbl[16];
            gcu::hour_label(lbl, sizeof(lbl), lt->tm_hour);   // "6am" / "06:00"
            lv_point_t tsz;
            lv_text_get_size(&tsz, lbl, label_dsc.font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
            int x0 = lx + 5 - tsz.x / 2;   // centered where the short labels were
            // 4 px from both graph edges and from the neighboring label
            if (x0 < 4 || x0 + tsz.x > canvas_width - 4) continue;
            if (prev_right > -1000 && x0 + tsz.x > prev_right - 4) continue;
            prev_right = x0;
            lvc_draw_text_edged(canvas_obj, x0 - 2, canvas_height - 19, tsz.x + 4, &label_dsc, lbl);   // 19 px: descenders + 2 px
          }

          lvc_end_shapes(canvas_obj);   // the labels wait for the line (lvc_texts below: the labels over the data)

          // --- Draw data line (direct pixels, one redraw of the canvas at the end) ---
          if (id(glucose_history_count) < 2) { draw_marks(); lvc_texts(canvas_obj); lvc_done(canvas_obj); return; }

          struct GraphPoint { int x; int y; int value; uint32_t ts; };
          std::vector<GraphPoint> points;
          points.reserve(num_points);

          for (int i = 0; i < num_points; i++) {
            int history_index;
            if (id(glucose_history_count) >= 180) {
              history_index = (id(glucose_history_index) - 180 + i + 180) % 180;
            } else {
              history_index = i;
            }

            int glucose_val = id(glucose_history)[history_index];
            uint32_t ts = id(glucose_history_ts)[history_index];

            if (ts == 0 || ts < window_start || ts > now_ts) continue;

            int x = (int)(((uint64_t)(ts - window_start) * (uint64_t)canvas_width) / window_seconds);
            if (x < 0) x = 0;
            if (x >= canvas_width) x = canvas_width - 1;

            int y;
            if (glucose_val > 0 && glucose_val <= gcu::GLU_MAX) {
              y = glucose_to_y((float)glucose_val);
            } else {
              y = 0;
            }

            GraphPoint gp;
            gp.x = x;
            gp.y = y;
            gp.value = glucose_val;
            gp.ts = ts;
            points.push_back(gp);
          }

          // Bresenham line drawing, twice, as the period graphs' mean line: the black underlay (each point's
          // 2 x 2 pixels with a 1-pixel border, 4 px wide), then the white line on it (2 px thick)
          if (points.size() >= 2) {
            const lv_color_t line_color = lv_color_hex(0xFFFFFF), black = lv_color_hex(0x000000);
            auto pts_ts = [&points](int k) -> uint32_t { return points[k].ts; };
            const int np = (int) points.size();
            for (int pass = 0; pass < 2; pass++)
            for (size_t i = 0; i < points.size() - 1; i++) {
              if (points[i].value == 0 || points[i+1].value == 0) continue;
              // No line across a gap (GlucoCraft's one gap rule, gc_units.h): an interval longer than max(15 min,
              // 3 x the reading interval around it) = missing data, a dead zone that stays empty; the reading
              // interval from the ring's own readings
              if (gcu::is_gap(pts_ts, np, (int) i + 1)) continue;
              // nor across a stretch of limit readings (they have no value; their marks are at the edge)
              if (gc_crosses_run(runs, n_runs, points[i].ts, points[i + 1].ts)) continue;

              int x0 = points[i].x, y0 = points[i].y;
              int x1 = points[i+1].x, y1 = points[i+1].y;
              int dx = abs(x1 - x0), dy = abs(y1 - y0);
              int sx = (x0 < x1) ? 1 : -1;
              int sy = (y0 < y1) ? 1 : -1;
              int err = dx - dy;

              while (true) {   // 2 px thick: the pixel, the one right of it and the one below it
                if (pass == 0) {
                  for (int k = -1; k <= 2; k++) lvc_vline(canvas_obj, x0 + k, y0 - 1, y0 + 2, black);
                } else {
                  lvc_px(canvas_obj, x0, y0, line_color);
                  lvc_px(canvas_obj, x0 + 1, y0, line_color);
                  lvc_px(canvas_obj, x0, y0 + 1, line_color);
                }
                if (x0 == x1 && y0 == y1) break;
                int e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
              }
            }
          }
          draw_marks();   // the limit stretches' marks at the edge, over the line and under the labels
          lvc_texts(canvas_obj);   // the labels over the line
          lvc_done(canvas_obj);
          ESP_LOGD("graph", "6-hour graph drawn in %u ms", (unsigned) (millis() - draw_t0));

  # The six period graphs, one per loop pass (iteration 0 = 24 hours ... 5 = 180 days) with a short pause between
  # them, so that touches and the Home Assistant connection are served in between. Each graph: zones, grid, labels,
  # title and legend on one draw layer (lvgl_compat.h lvc_begin / lvc_end), then the minimum-to-maximum areas and the
  # mean line as direct pixels and one redraw of the canvas.
  - id: draw_period_graphs
    mode: restart
    then:
      - repeat:
          count: 6
          then:
            - lambda: |-
                const uint32_t draw_t0 = millis();
                static uint32_t busy_ms = 0;   // the drawing time of the six passes together (logged after the last)
                if (iteration == 0) busy_ms = 0;
                lv_obj_t *const canvases[6] = {id(glucose_canvas_24h), id(glucose_canvas_7d), id(glucose_canvas_14d),
                                               id(glucose_canvas_30d), id(glucose_canvas_90d), id(glucose_canvas_180d)};
                lv_canvas_fill_bg(canvases[iteration], lv_color_hex(0x0a0a0a), LV_OPA_COVER);
                const int CW = 340;
                const int CH = 150;
                // The stretches of limit readings in this graph's window (the full file's GCR1 block;
                // glucocraft_panel_binary.h gc_limit_runs), filled once the window is known (below); the mean line
                // breaks across them and their marks are drawn at the edge (marks)
                static GcLimitRun runs[96];
                int n_runs = 0;
                uint32_t win_start = 0, win_s = 1;

                float crit_min = !isnan(id(range_critical_min).state) ? id(range_critical_min).state : 54.0f;
                float crit_max = !isnan(id(range_critical_max).state) ? id(range_critical_max).state : 250.0f;
                float ideal_min = !isnan(id(range_ideal_min).state) ? id(range_ideal_min).state : 70.0f;
                float ideal_max = !isnan(id(range_ideal_max).state) ? id(range_ideal_max).state : 140.0f;
                float normal_min = !isnan(id(range_normal_min).state) ? id(range_normal_min).state : 70.0f;
                float normal_max = !isnan(id(range_normal_max).state) ? id(range_normal_max).state : 180.0f;

                // Helper: scan data arrays for min/max, return the auto-scaled range (15 % margins, centered)
                // Uses slot_min/slot_max if available (captures full range including spikes)
                auto calc_range = [](int* data, int width, float* out_min, float* out_max,
                                     int* dmin_arr = nullptr, int* dmax_arr = nullptr) {
                  int dmin = 999, dmax = 0;
                  for (int i = 0; i < width; i++) {
                    // Use per-slot min/max if available (captures spikes that averaging hides)
                    int lo = (dmin_arr && dmin_arr[i] > 0) ? dmin_arr[i] : data[i];
                    int hi = (dmax_arr && dmax_arr[i] > 0) ? dmax_arr[i] : data[i];
                    if (lo > 0 && lo <= gcu::GLU_MAX && lo < dmin) dmin = lo;
                    if (hi > 0 && hi <= gcu::GLU_MAX && hi > dmax) dmax = hi;
                  }
                  if (dmin >= 999 || dmax <= 0) { dmin = 70; dmax = 180; }
                  // 15 % margin top and bottom, data centered; spread under 20 widened evenly
                  float lo = (float)dmin, hi = (float)dmax;
                  if (hi - lo < 20.0f) { float c = (lo + hi) / 2.0f; lo = c - 10.0f; hi = c + 10.0f; }
                  float m = (hi - lo) * 0.15f / 0.70f;
                  *out_min = lo - m;
                  *out_max = hi + m;
                };

                // Helper: glucose value to y pixel (auto-scaled)
                auto g2y = [](float v, float gmin, float gmax) -> int {
                  if (v < gmin) v = gmin;
                  if (v > gmax) v = gmax;
                  int y = 150 - (int)(((v - gmin) / (gmax - gmin)) * 150.0f);
                  return (y < 0) ? 0 : (y >= 150 ? 149 : y);
                };

                // Helper: draw background zones on a canvas (auto-scaled)
                auto draw_bg = [&](lv_obj_t* cv, float gmin, float gmax) {
                  struct Zone { int ys; int ye; uint32_t color; };
                  // the graph range colors in use (GlucoCraft's band_colors; gc_units.h)
                  Zone zones[] = {
                    {0,                             g2y(crit_max, gmin, gmax),   (uint32_t) gcu::band_color(gcu::Z_VERY_HIGH)},
                    {g2y(crit_max, gmin, gmax),     g2y(normal_max, gmin, gmax), (uint32_t) gcu::band_color(gcu::Z_HIGH)},
                    {g2y(normal_max, gmin, gmax),   g2y(ideal_max, gmin, gmax),  (uint32_t) gcu::band_color(gcu::Z_NEAR_HIGH)},
                    {g2y(ideal_max, gmin, gmax),    g2y(ideal_min, gmin, gmax),  (uint32_t) gcu::band_color(gcu::Z_TIGHT)},
                    {g2y(ideal_min, gmin, gmax),    g2y(normal_min, gmin, gmax), (uint32_t) gcu::band_color(gcu::Z_NEAR_LOW)},
                    {g2y(normal_min, gmin, gmax),   g2y(crit_min, gmin, gmax),   (uint32_t) gcu::band_color(gcu::Z_LOW)},
                    {g2y(crit_min, gmin, gmax),     CH,                          (uint32_t) gcu::band_color(gcu::Z_VERY_LOW)},
                  };
                  for (auto &z : zones) {
                    int ys = z.ys < 0 ? 0 : z.ys;
                    int ye = z.ye > CH ? CH : z.ye;
                    if (ys >= ye) continue;
                    lvc_fill_rect(cv, 0, ys, CW, ye - ys, lv_color_hex(z.color), 153);  // 60 % over black, = the display card
                  }
                };

                // Helper: draw dynamic horizontal grid lines and y-axis labels
                auto draw_hgrid_auto = [&](lv_obj_t* cv, float gmin, float gmax) {
                  float range_span = gmax - gmin;
                  float step = gcu::axis_step(range_span, 5.0f);   // round in the display unit (gc_units.h)
                  float first_line = gcu::axis_first(gmin, step);
                  lv_color_t grid_major = lv_color_hex(0x404040);
                  lv_color_t grid_minor = lv_color_hex(0x2a2a2a);

                  lv_draw_label_dsc_t ld;
                  lv_draw_label_dsc_init(&ld);
                  ld.color = lv_color_hex(0xFFFFFF);  // graph labels white
                  ld.font = id(roboto_14)->get_lv_font();

                  for (float g = first_line; g <= gmax; g += step) {
                    int gy = g2y(g, gmin, gmax);
                    if (gy <= 2 || gy >= CH - 2) continue;
                    bool is_major = gcu::axis_major(g, step);
                    lv_color_t gc = is_major ? grid_major : grid_minor;
                    lvc_fill_rect(cv, 0, gy, CW, 1, gc);
                    if (gy > CH - 28) continue;   // the label only clear of the time labels' row
                    char lbl[8];
                    gcu::axis_label(lbl, sizeof(lbl), g, step);
                    lvc_draw_text_edged(cv, 5, gy - 7, 40, &ld, lbl);
                  }
                };

                // Helper: draw title in top-right corner
                auto draw_title = [&](lv_obj_t* cv, const char* title) {
                  lv_draw_label_dsc_t ld;
                  lv_draw_label_dsc_init(&ld);
                  ld.color = lv_color_hex(0xFFFFFF);
                  ld.align = LV_TEXT_ALIGN_RIGHT;
                  ld.font = id(roboto_16)->get_lv_font();
                  lvc_draw_text_edged(cv, 195, 5, 135, &ld, title);
                };

                // Helper: draw the key of the minimum-to-maximum areas and the mean line (period graphs only)
                auto draw_legend = [&](lv_obj_t* cv) {
                  lv_draw_label_dsc_t ld;
                  lv_draw_label_dsc_init(&ld);
                  ld.font = id(roboto_14)->get_lv_font();
                  ld.align = LV_TEXT_ALIGN_LEFT;
                  // the minimum-to-maximum label in the light gray of the areas it labels (the other graph labels
                  // are white), as on the display card
                  ld.color = lv_color_hex(0xBDBDBD);
                  lvc_draw_text_edged(cv, 50, 5, 110, &ld, gct::graph_legend_range);
                  // White sample + "Average" label
                  ld.color = lv_color_hex(0xFFFFFF);
                  lvc_draw_text_edged(cv, 50, 22, 110, &ld, gct::graph_legend_average);
                };

                // Helper: draw vertical grid lines at N equal intervals
                auto draw_vgrid = [](lv_obj_t* cv, int num_divisions) {
                  lv_color_t gc = lv_color_hex(0x2a2a2a);
                  lv_color_t bc = lv_color_hex(0x404040);
                  lvc_fill_rect(cv, 0, 0, 1, 150, gc);
                  lvc_fill_rect(cv, 339, 0, 1, 150, bc);
                  for (int i = 1; i < num_divisions; i++) {
                    int x = (i * 340) / num_divisions;
                    if (x <= 0 || x >= 339) continue;
                    lvc_fill_rect(cv, x, 0, 1, 150, gc);
                  }
                };

                // Helper: draw the data as the display card draws it (glucocraft-shared.js gcRangeAreas): each pixel
                // column's lowest to highest reading as a light-gray area (#BDBDBD) with a 1-pixel black edge around
                // every run of columns with data, so that it stands out on every range band, then the mean line in
                // white over a black underlay, so that it stays visible on the light areas. Direct pixels
                // (lvgl_compat.h), after the canvas's shapes.
                auto draw_data = [&](lv_obj_t* cv, int* data, int* dmin, int* dmax, const uint8_t* join,
                                     int width, float gmin, float gmax) {
                  const lv_color_t area_color = lv_color_hex(0xBDBDBD);   // the areas' light gray
                  const lv_color_t black = lv_color_hex(0x000000);        // the areas' edge and the line's underlay
                  const lv_color_t line_color = lv_color_hex(0xFFFFFF);   // the mean line

                  // First pass: the areas. top / bot: each column's area from the highest reading's y to the lowest
                  // reading's y (higher glucose = lower y); top > bot = no data in the column
                  if (dmin && dmax) {
                    static int top[CW], bot[CW];
                    for (int i = 0; i < width; i++) {
                      const bool has = dmin[i] != 0 && dmax[i] != 0;
                      top[i] = has ? g2y((float)dmax[i], gmin, gmax) : 1;
                      bot[i] = has ? g2y((float)dmin[i], gmin, gmax) : 0;
                    }
                    for (int i = 0; i < width; i++) {
                      // the edge: every pixel outside the areas next to one of them (above, below, left or right)
                      if (top[i] <= bot[i]) {
                        lvc_px(cv, i, top[i] - 1, black);
                        lvc_px(cv, i, bot[i] + 1, black);
                        lvc_vline(cv, i, top[i], bot[i], area_color);
                      }
                      for (int nb = i - 1; nb <= i + 1; nb += 2) {
                        if (nb < 0 || nb >= width || top[nb] > bot[nb]) continue;
                        for (int y = top[nb]; y <= bot[nb]; y++)
                          if (top[i] > bot[i] || y < top[i] || y > bot[i]) lvc_px(cv, i, y, black);
                      }
                    }
                  }

                  // Then the mean line (Bresenham), twice: the black underlay (each point's 2 x 2 pixels with a 1-pixel
                  // border, 4 px wide), then the white line on it (2 px thick: the pixel, the one right of it and the
                  // one below it). A slot with data joins the next slot with data unless a gap lies between them
                  // (GlucoCraft's one gap rule on the file's readings, backfill_load_period's join flags): a 5-minute
                  // CGM that leaves slots empty stays one line, an interval longer than max(15 min, 3 x the reading
                  // interval) breaks it.
                  // the time at the start of a slot (the line between two slots breaks across a limit stretch)
                  auto slot_t = [&](int k) -> uint32_t { return win_start + (uint32_t) (((uint64_t) k * win_s) / width); };
                  auto mean_line = [&](bool underlay) {
                    for (int i = 0; i < width - 1; i++) {
                      if (data[i] == 0) continue;
                      int j = i + 1;
                      while (j < width && data[j] == 0) j++;
                      if (j >= width || !join[i]) continue;
                      if (gc_crosses_run(runs, n_runs, slot_t(i), slot_t(j + 1) - 1)) continue;
                      int y0 = g2y((float)data[i], gmin, gmax);
                      int y1 = g2y((float)data[j], gmin, gmax);
                      int x0 = i, x1 = j;
                      int dx = abs(x1 - x0), dy = abs(y1 - y0);
                      int sx = 1, sy = (y0 < y1) ? 1 : -1;
                      int err = dx - dy;
                      while (true) {
                        if (underlay) {
                          for (int k = -1; k <= 2; k++) lvc_vline(cv, x0 + k, y0 - 1, y0 + 2, black);
                        } else {
                          lvc_px(cv, x0, y0, line_color);
                          lvc_px(cv, x0 + 1, y0, line_color);
                          lvc_px(cv, x0, y0 + 1, line_color);
                        }
                        if (x0 == x1 && y0 == y1) break;
                        int e2 = 2 * err;
                        if (e2 > -dy) { err -= dy; x0 += sx; }
                        if (e2 < dx) { err += dx; y0 += sy; }
                      }
                    }
                  };
                  mean_line(true);
                  mean_line(false);
                  lvc_done(cv);   // one redraw of the canvas after its pixels
                };

                // Helper: draw a complete auto-scaled period graph

                // labels from the same window end as the data: when the full file was fetched
                uint32_t now_ts = backfill_window_end();
                {
                  static const uint32_t HOURS[6] = {24, 168, 336, 720, 2160, 4320};   // the six graphs' windows
                  win_s = HOURS[iteration] * 3600;
                  win_start = now_ts > win_s ? now_ts - win_s : 0;
                  n_runs = now_ts > 0 ? gc_limit_runs(win_start, now_ts, runs, 96, false, nullptr) : 0;
                }
                // the marks of the limit stretches at the graph's edge, after its data and before its labels
                auto marks = [&](lv_obj_t* cv) { gc_draw_limit_marks(cv, runs, n_runs, win_start, win_s, CW, CH); };

                // ===== 24-HOUR GRAPH =====
                if (iteration == 0) {
                  auto cv = id(glucose_canvas_24h);
                  lvc_begin(cv);
                  float gmin24, gmax24;
                  calc_range(id(glucose_graph_24h), CW, &gmin24, &gmax24, id(glucose_graph_24h_min), id(glucose_graph_24h_max));
                  draw_bg(cv, gmin24, gmax24);
                  draw_hgrid_auto(cv, gmin24, gmax24);
                  draw_vgrid(cv, 0);   // the borders only: the hour lines follow
                  draw_title(cv, gct::graph_title_24h);
                  draw_legend(cv);

                  // X-axis time labels every 4 hours: grid lines and labels at LOCAL whole hours (12am, 4am, 8am ...)
                  if (now_ts > 0) {
                    lv_draw_label_dsc_t ld;
                    lv_draw_label_dsc_init(&ld);
                    ld.color = lv_color_hex(0xFFFFFF);  // graph labels white
                    ld.font = id(roboto_14)->get_lv_font();
                    ld.align = LV_TEXT_ALIGN_CENTER;
                    uint32_t window_start = now_ts - 24 * 3600;
                    int prev_end = -1000;   // right edge of the label drawn before (left to right)
                    for (uint32_t ht = gcu::local_hour_floor(window_start) + 3600; ht < now_ts; ht = gcu::local_hour_floor(ht + 3600)) {
                      const int hr = gcu::local_hour(ht);
                      if (hr % 4 != 0) continue;
                      int lx = (int)(((uint64_t)(ht - window_start) * (uint64_t)CW) / (24 * 3600));
                      if (lx <= 0 || lx >= CW - 1) continue;
                      lvc_fill_rect(cv, lx, 0, 1, CH, lv_color_hex(0x2a2a2a));
                      char lbl[16];
                      gcu::hour_label(lbl, sizeof(lbl), hr);   // "6am" / "06:00"
                      lv_point_t tsz;
                      lv_text_get_size(&tsz, lbl, ld.font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
                      int x0 = lx + 5 - tsz.x / 2;
                      if (x0 < 4 || x0 + tsz.x > 340 - 4 || x0 < prev_end + 4) continue;   // 4 px from the edges and the neighbor
                      prev_end = x0 + tsz.x;
                      lvc_draw_text_edged(cv, x0 - 2, 131, tsz.x + 4, &ld, lbl);
                    }
                  }
                  lvc_end_shapes(cv);   // the labels wait for the data (drawn over it)
                  draw_data(cv, id(glucose_graph_24h), id(glucose_graph_24h_min), id(glucose_graph_24h_max), id(glucose_graph_24h_join), CW, gmin24, gmax24);
                  marks(cv);   // the limit stretches' marks at the edge
                  lvc_texts(cv);   // the labels over the data
                }

                // ===== 7-DAY GRAPH =====
                if (iteration == 1) {
                  auto cv = id(glucose_canvas_7d);
                  lvc_begin(cv);
                  float gmin7, gmax7;
                  calc_range(id(glucose_graph_7d), CW, &gmin7, &gmax7, id(glucose_graph_7d_min), id(glucose_graph_7d_max));
                  draw_bg(cv, gmin7, gmax7);
                  draw_hgrid_auto(cv, gmin7, gmax7);
                  draw_vgrid(cv, 7);
                  draw_title(cv, gct::graph_title_7d);
                  draw_legend(cv);

                  // X-axis day labels
                  if (now_ts > 0) {
                    lv_draw_label_dsc_t ld;
                    lv_draw_label_dsc_init(&ld);
                    ld.color = lv_color_hex(0xFFFFFF);  // graph labels white
                    ld.font = id(roboto_14)->get_lv_font();
                    ld.align = LV_TEXT_ALIGN_CENTER;
                    uint32_t window_start = now_ts - 7 * 24 * 3600;
                    int prev_end = -1000;   // right edge of the label drawn before
                    for (int i = 1; i < 7; i++) {
                      uint32_t slot_ts = window_start + (uint32_t)((uint64_t)i * 7 * 24 * 3600 / 7);
                      time_t t = (time_t)slot_ts;
                      struct tm *lt = localtime(&t);
                      if (!lt) continue;
                      int dow = lt->tm_wday;
                      if (dow < 0 || dow > 6) dow = 0;
                      int lx = (i * 340) / 7;
                      {   // measured: >= 4 px from the neighbor and the edges
                        lv_point_t tsz;
                        lv_text_get_size(&tsz, gct::weekday_short[dow], ld.font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
                        int x0 = lx + 3 - tsz.x / 2;
                        if (x0 >= 4 && x0 + tsz.x <= 340 - 4 && x0 >= prev_end + 4) {
                          lvc_draw_text_edged(cv, x0 - 2, 131, tsz.x + 4, &ld, gct::weekday_short[dow]);
                          prev_end = x0 + tsz.x;
