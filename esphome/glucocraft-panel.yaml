                    ld.align = LV_TEXT_ALIGN_CENTER;
                    uint32_t window_start = now_ts - 14 * 24 * 3600;
                    int prev_end = -1000;   // right edge of the label drawn before
                    for (int i = 1; i < 7; i++) {
                      uint32_t slot_ts = window_start + (uint32_t)((uint64_t)i * 14 * 24 * 3600 / 7);
                      time_t t = (time_t)slot_ts;
