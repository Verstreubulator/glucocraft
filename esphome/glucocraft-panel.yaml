      # no_connection_screen, centered (the 1-second interval fills them; script no_ha_screen_apply shows it). It takes
      # every touch below the header and passes none on (no swipe handlers, gesture_bubble false): the page changes
      # do nothing while it is up (nav_next / nav_prev check no_ha_screen_on for the header's swipes). The title at
      # 32 px, the other lines at 24 px, wrapped at 440 px (worst_case_fit.py). The landscape panels have the same
      # block in tools/landscape_top_layer.yaml.
