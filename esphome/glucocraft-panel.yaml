  - platform: homeassistant
    id: stats_6h_custom_std_dev
    entity_id: sensor.glucocraft_6h_custom_ranges
    attribute: std_dev
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  - platform: homeassistant
    id: stats_6h_custom_cv
