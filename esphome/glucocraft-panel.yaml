                  }
                  lvc_end_shapes(cv);   // the labels wait for the data (drawn over it)
                  draw_data(cv, id(glucose_graph_30d), id(glucose_graph_30d_min), id(glucose_graph_30d_max), id(glucose_graph_30d_join), CW, gmin30, gmax30);
                  marks(cv);   // the limit stretches' marks at the edge
                  lvc_texts(cv);   // the labels over the data
                }

                // ===== 90-DAY GRAPH =====
                if (iteration == 4) {
                  auto cv = id(glucose_canvas_90d);
                  lvc_begin(cv);
                  float gmin90, gmax90;
                  calc_range(id(glucose_graph_90d), CW, &gmin90, &gmax90, id(glucose_graph_90d_min), id(glucose_graph_90d_max));
                  draw_bg(cv, gmin90, gmax90);
                  draw_hgrid_auto(cv, gmin90, gmax90);
                  draw_vgrid(cv, 6);
                  draw_title(cv, gct::graph_title_90d);
                  draw_legend(cv);

                  // X-axis date labels every ~15 days
                  if (now_ts > 0) {
                    lv_draw_label_dsc_t ld;
                    lv_draw_label_dsc_init(&ld);
                    ld.color = lv_color_hex(0xFFFFFF);  // graph labels white
                    ld.font = id(roboto_14)->get_lv_font();
                    ld.align = LV_TEXT_ALIGN_CENTER;
                    uint32_t window_start = now_ts - 90 * 24 * 3600;
                    int prev_end = -1000;   // right edge of the label drawn before
                    for (int i = 1; i < 6; i++) {
                      uint32_t slot_ts = window_start + (uint32_t)((uint64_t)i * 90 * 24 * 3600 / 6);
                      time_t t = (time_t)slot_ts;
                      struct tm *lt = localtime(&t);
                      if (!lt) continue;
                      char lbl[8];
                      gcu::numeric_date(lbl, sizeof(lbl), lt->tm_mon + 1, lt->tm_mday);   // "10/22" / "22/10" / "10-22"
                      int lx = (i * 340) / 6;
                      {   // measured: >= 4 px from the neighbor and the edges
                        lv_point_t tsz;
                        lv_text_get_size(&tsz, lbl, ld.font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
                        int x0 = lx + 3 - tsz.x / 2;
                        if (x0 >= 4 && x0 + tsz.x <= 340 - 4 && x0 >= prev_end + 4) {
                          lvc_draw_text_edged(cv, x0 - 2, 131, tsz.x + 4, &ld, lbl);
                          prev_end = x0 + tsz.x;
                        }
                      }
                    }
                  }
                  lvc_end_shapes(cv);   // the labels wait for the data (drawn over it)
                  draw_data(cv, id(glucose_graph_90d), id(glucose_graph_90d_min), id(glucose_graph_90d_max), id(glucose_graph_90d_join), CW, gmin90, gmax90);
                  marks(cv);   // the limit stretches' marks at the edge
                  lvc_texts(cv);   // the labels over the data
                }

                // ===== 180-DAY GRAPH =====
                if (iteration == 5) {
                  auto cv = id(glucose_canvas_180d);
                  lvc_begin(cv);
                  float gmin180, gmax180;
                  calc_range(id(glucose_graph_180d), CW, &gmin180, &gmax180, id(glucose_graph_180d_min), id(glucose_graph_180d_max));
                  draw_bg(cv, gmin180, gmax180);
                  draw_hgrid_auto(cv, gmin180, gmax180);
                  draw_vgrid(cv, 6);
                  draw_title(cv, gct::graph_title_180d);
                  draw_legend(cv);

                  // X-axis date labels every ~30 days
                  if (now_ts > 0) {
                    lv_draw_label_dsc_t ld;
                    lv_draw_label_dsc_init(&ld);
                    ld.color = lv_color_hex(0xFFFFFF);  // graph labels white
                    ld.font = id(roboto_14)->get_lv_font();
                    ld.align = LV_TEXT_ALIGN_CENTER;
                    uint32_t window_start = now_ts - 180 * 24 * 3600;
                    int prev_end = -1000;   // right edge of the label drawn before
                    for (int i = 1; i < 6; i++) {
                      uint32_t slot_ts = window_start + (uint32_t)((uint64_t)i * 180 * 24 * 3600 / 6);
                      time_t t = (time_t)slot_ts;
                      struct tm *lt = localtime(&t);
                      if (!lt) continue;
                      char lbl[8];
                      gcu::numeric_date(lbl, sizeof(lbl), lt->tm_mon + 1, lt->tm_mday);   // "10/22" / "22/10" / "10-22"
                      int lx = (i * 340) / 6;
                      {   // measured: >= 4 px from the neighbor and the edges
                        lv_point_t tsz;
                        lv_text_get_size(&tsz, lbl, ld.font, 0, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
                        int x0 = lx + 3 - tsz.x / 2;
                        if (x0 >= 4 && x0 + tsz.x <= 340 - 4 && x0 >= prev_end + 4) {
                          lvc_draw_text_edged(cv, x0 - 2, 131, tsz.x + 4, &ld, lbl);
                          prev_end = x0 + tsz.x;
                        }
                      }
                    }
                  }
                  lvc_end_shapes(cv);   // the labels wait for the data (drawn over it)
                  draw_data(cv, id(glucose_graph_180d), id(glucose_graph_180d_min), id(glucose_graph_180d_max), id(glucose_graph_180d_join), CW, gmin180, gmax180);
                  marks(cv);   // the limit stretches' marks at the edge
                  lvc_texts(cv);   // the labels over the data
                }

                // no full file yet (also while its download is tried again): "Loading..." in the middle of the graph,
                // as on the display card, on a box of the graph's black (the gray would be too faint on the bands:
                // #888888 on the canvas black reaches 5.58:1)
                if (!backfill_has_stats()) {
                  lv_draw_label_dsc_t ld;
                  lv_draw_label_dsc_init(&ld);
                  ld.color = lv_color_hex(0x888888);
                  ld.font = id(roboto_18)->get_lv_font();
                  ld.align = LV_TEXT_ALIGN_CENTER;
                  const GcBox t = gc_text_box(0, CH / 2 - 11, CW, gct::weekly_status_loading, ld.font, false);
                  const int bw = (t.x1 - t.x0) + 16, bh = (t.y1 - t.y0) + 6;
                  lvc_begin(canvases[iteration]);
                  lvc_fill_rect(canvases[iteration], (CW - bw) / 2, CH / 2 - 11 - 3, bw, bh, lv_color_hex(0x0a0a0a));
                  lvc_draw_text_edged(canvases[iteration], 0, CH / 2 - 11, CW, &ld, gct::weekly_status_loading);
                  lvc_end(canvases[iteration]);
                }
                busy_ms += millis() - draw_t0;
                if (iteration == 5) ESP_LOGI("graph", "Period graphs drawn (24h ... 180d): %u ms of drawing", (unsigned) busy_ms);
            - delay: 50ms

  - id: update_stats_display
    mode: restart
    then:
      - lambda: |-
          char buf[64];
          // 6h numbers: GlucoCraft's files (panel_feed.py; the 5-minute delta, the hourly full file during an
          // outage). GlucoCraft's 6-hour summary sensor only before any file has loaded.
          if (backfill_has_stats()) {
            // The one rule of every period's cells (populate_period_stats; this script is the only writer of the 6-hour
            // TIR, TITR, mean, SD, CV, Low and High): a period GlucoCraft shows no statistics for (no readings, or the
            // sensor covered less than 70 % of it: the all-zero block) shows "---" everywhere; readings at the
            // sensor's limit alone have their times in the ranges (TIR 0%, Low, High; Very low / Very high in
            // populate_period_stats) and no mean, SD or CV. Whole percentages: gcu::pct0, halves away from zero like
            // the display card.
            const bool shown = get_stat_shown(0), with_mean = shown && get_stat_mean(0) > 0;
            auto pct = [&](std::string &dst, float v) {
              if (!shown) { dst = "---"; return; }
              gcu::pct0(buf, sizeof(buf), v);
              dst = buf;
            };
            auto glu = [&](std::string &dst, float v) {
              if (!with_mean) { dst = "---"; return; }
              gcu::fmt(buf, sizeof(buf), v);
              dst = buf;
            };
            pct(id(global_6h_tir), get_stat_tir(0));
            pct(id(global_6h_titr), get_stat_titr(0));
            glu(id(global_6h_mean), get_stat_mean(0));
            glu(id(global_6h_std_dev), get_stat_stddev(0));
            if (with_mean) pct(id(global_6h_cv), get_stat_cv(0));
            else id(global_6h_cv) = "---";
            pct(id(global_6h_low), get_stat_time_low(0));
            pct(id(global_6h_high), get_stat_time_high(0));
          } else {
            // the 6-hour summary of the range set in use: the custom ranges summary while Custom ranges and goals is on
            const bool custom = id(gc_custom_ranges_on);
            // each value as the double GlucoCraft calculated, rounded once as GlucoCraft rounds it (gcu::*_attr);
            // "None" (GlucoCraft shows no value: no readings, or the sensor covered less than 70 % of the 6 hours)
            // shows "---"; nothing ("unavailable", "unknown" while Home Assistant restarts) keeps the text shown
            auto text = [custom](text_sensor::TextSensor *c, text_sensor::TextSensor *s) -> const std::string & {
              return custom ? c->state : s->state;
            };
            auto put = [&](std::string &dst, const std::string &t, void (*f)(char *, size_t, double)) {
              const double v = gcu::attr_value(t);
              if (!isnan(v)) { f(buf, sizeof(buf), v); dst = buf; }
              else if (t == "None") dst = "---";
            };
            put(id(global_6h_tir), text(id(stats_6h_custom_tir), id(stats_6h_consensus_tir)), gcu::pct0_attr);
            put(id(global_6h_titr), text(id(stats_6h_custom_titr), id(stats_6h_consensus_titr)), gcu::pct0_attr);
            // the mean and the standard deviation are mg/dL attributes: shown in the display unit
            put(id(global_6h_mean), text(id(stats_6h_custom_mean), id(stats_6h_consensus_mean)), gcu::fmt_attr);
            put(id(global_6h_std_dev), text(id(stats_6h_custom_std_dev), id(stats_6h_consensus_std_dev)), gcu::fmt_attr);
            put(id(global_6h_cv), text(id(stats_6h_custom_cv), id(stats_6h_consensus_cv)), gcu::pct0_attr);
            put(id(global_6h_low), text(id(stats_6h_custom_low), id(stats_6h_consensus_low)), gcu::pct0_attr);
            put(id(global_6h_high), text(id(stats_6h_custom_high), id(stats_6h_consensus_high)), gcu::pct0_attr);
            auto value = [&](text_sensor::TextSensor *c, text_sensor::TextSensor *s) {
              return gcu::attr_value(text(c, s));
            };
            // Very low, Very high, the minimum and the maximum of the same summary: the
            // labels directly (populate_period_stats fills them once a file is in)
            if (!id(loading_mode_active)) {
              const double vlow = value(id(stats_6h_custom_very_low), id(stats_6h_consensus_very_low));
              const double vhigh = value(id(stats_6h_custom_very_high), id(stats_6h_consensus_very_high));
              const double mn = value(id(stats_6h_custom_min), id(stats_6h_consensus_min));
              const double mx = value(id(stats_6h_custom_max), id(stats_6h_consensus_max));
              if (!isnan(vlow)) { gcu::pct1_cell_attr(buf, sizeof(buf), vlow); lv_label_set_text(id(stat_6h_crit_low), buf); }
              else if (text(id(stats_6h_custom_very_low), id(stats_6h_consensus_very_low)) == "None") lv_label_set_text(id(stat_6h_crit_low), "---");
              if (!isnan(vhigh)) { gcu::pct1_cell_attr(buf, sizeof(buf), vhigh); lv_label_set_text(id(stat_6h_crit_high), buf); }
              else if (text(id(stats_6h_custom_very_high), id(stats_6h_consensus_very_high)) == "None") lv_label_set_text(id(stat_6h_crit_high), "---");
              if (mn > 0) { gcu::fmt_attr(buf, sizeof(buf), mn); lv_label_set_text(id(stat_6h_min), buf); }
              else lv_label_set_text(id(stat_6h_min), "---");
              if (mx > 0) { gcu::fmt_attr(buf, sizeof(buf), mx); lv_label_set_text(id(stat_6h_max), buf); }
              else lv_label_set_text(id(stat_6h_max), "---");
            }
          }
      - if:
          condition:
            lambda: 'return !id(loading_mode_active);'
          then:
            - lvgl.label.update:
                id: stat_6h_tir
                text: !lambda return id(global_6h_tir).c_str();
            - lvgl.label.update:
                id: stat_6h_titr
                text: !lambda return id(global_6h_titr).c_str();
            - lvgl.label.update:
                id: stat_6h_mean
                text: !lambda return id(global_6h_mean).c_str();
            - lvgl.label.update:
                id: stat_6h_std_dev
                text: !lambda return id(global_6h_std_dev).c_str();
            - lvgl.label.update:
                id: stat_6h_cv
                text: !lambda return id(global_6h_cv).c_str();
            - lvgl.label.update:
                id: stat_6h_low
                text: !lambda return id(global_6h_low).c_str();
            - lvgl.label.update:
                id: stat_6h_high
                text: !lambda return id(global_6h_high).c_str();

  - id: populate_period_stats
    mode: restart
    then:
      - lambda: |-
          if (!backfill::data_loaded) {
            ESP_LOGW("stats", "Backfill not loaded, skipping period stats");
            return;
          }
          char buf[16];
          // One rule for every period's cells, like the card: a period GlucoCraft shows no statistics for (no
          // readings, or the sensor covered less than 70 % of it: the all-zero block, get_stat_shown) shows "---" in
          // every cell; a period with readings at the sensor's limit alone has its times in the ranges only, and its
          // mean, SD, CV, GMI, minimum and maximum show ---.
          // a percentage with 0 or 1 decimals, halves away from zero as the display card: "73%" (gcu::pct0), "1.2%" /
          // "1,2%" (gcu::pct1, the decimal separator in use)
          auto gc_stat = [&](lv_obj_t* l, int p, float v, int decimals) {
            if (!get_stat_shown(p)) { lv_label_set_text(l, "---"); return; }
            if (decimals == 0) gcu::pct0(buf, sizeof(buf), v);
            else gcu::pct1_cell(buf, sizeof(buf), v);   // the Very low / Very high cells
            lv_label_set_text(l, buf);
          };
          // the GMI in the A1C unit (gc_units.h): "6.5%" / "48" / "6.5%/48"; in both units a smaller font, so the worst
          // case "12.9%/117" fits the cell (the landscape generator sets both fonts per layout)
          auto gc_gmi = [&](lv_obj_t* l, int p) {
            gcu::fmt_gmi(buf, sizeof(buf), get_stat_shown(p) ? get_stat_gmi(p) : NAN, get_stat_mean(p));
            lv_obj_set_style_text_font(l, gcu::a1c_mode() == 2 ? id(roboto_16)->get_lv_font() : id(roboto_20)->get_lv_font(), 0);
            lv_label_set_text(l, buf);
          };
          // a glucose value (mg/dL in the file) in the display unit
          auto gc_glu = [&](lv_obj_t* l, int p, float v) {
            if (!get_stat_shown(p) || !(get_stat_mean(p) > 0)) { lv_label_set_text(l, "---"); return; }
            gcu::fmt(buf, sizeof(buf), v);
            lv_label_set_text(l, buf);
          };
          // the CV: a whole percentage of the mean, so none without one
          auto gc_cv = [&](lv_obj_t* l, int p) {
            if (!get_stat_shown(p) || !(get_stat_mean(p) > 0)) { lv_label_set_text(l, "---"); return; }
            gcu::pct0(buf, sizeof(buf), get_stat_cv(p));
            lv_label_set_text(l, buf);
          };
          // the period's minimum / maximum: measured values
          auto gc_min = [&](lv_obj_t* l, int p) { gc_glu(l, p, get_stat_min(p)); };
          auto gc_max = [&](lv_obj_t* l, int p) { gc_glu(l, p, get_stat_max(p)); };

          // --- 6h: the minimum, the maximum, Very low and Very high (update_stats_display writes TIR, TITR, the mean,
          // SD, CV, Low and High: the files, the Home Assistant sensors before a file) ---
          gc_min(id(stat_6h_min), 0);
          gc_max(id(stat_6h_max), 0);
          gc_stat(id(stat_6h_crit_low), 0, get_stat_time_crit_low(0), 1);
          gc_stat(id(stat_6h_crit_high), 0, get_stat_time_crit_high(0), 1);

          // --- 24h: the statistics (file period 1) ---
          gc_stat(id(stat_24h_tir), 1, get_stat_tir(1), 0);
          gc_stat(id(stat_24h_titr), 1, get_stat_titr(1), 0);
          gc_min(id(stat_24h_min), 1);
          gc_max(id(stat_24h_max), 1);
          gc_glu(id(stat_24h_mean), 1, get_stat_mean(1));
          gc_glu(id(stat_24h_std_dev), 1, get_stat_stddev(1));
          gc_cv(id(stat_24h_cv), 1);
          gc_stat(id(stat_24h_low), 1, get_stat_time_low(1), 0);
          gc_stat(id(stat_24h_high), 1, get_stat_time_high(1), 0);
          gc_stat(id(stat_24h_crit_low), 1, get_stat_time_crit_low(1), 1);
          gc_stat(id(stat_24h_crit_high), 1, get_stat_time_crit_high(1), 1);

          // --- 7d: the statistics (file period 2) ---
          gc_stat(id(stat_7d_tir), 2, get_stat_tir(2), 0);
          gc_stat(id(stat_7d_titr), 2, get_stat_titr(2), 0);
          gc_min(id(stat_7d_min), 2);
          gc_max(id(stat_7d_max), 2);
          gc_glu(id(stat_7d_mean), 2, get_stat_mean(2));
          gc_glu(id(stat_7d_std_dev), 2, get_stat_stddev(2));
          gc_cv(id(stat_7d_cv), 2);
          gc_stat(id(stat_7d_low), 2, get_stat_time_low(2), 0);
          gc_stat(id(stat_7d_high), 2, get_stat_time_high(2), 0);
          gc_stat(id(stat_7d_crit_low), 2, get_stat_time_crit_low(2), 1);
          gc_stat(id(stat_7d_crit_high), 2, get_stat_time_crit_high(2), 1);
          // 6 h, 24 h, 7 d: the 14-day GMI, labeled GMI14d (GMI needs >= 14 days, Battelino 2019)
          gc_gmi(id(stat_7d_gmi), 3);
          gc_gmi(id(stat_6h_gmi), 3);
          gc_gmi(id(stat_24h_gmi), 3);

          // --- 14d: the statistics (file period 3) ---
          gc_stat(id(stat_14d_tir), 3, get_stat_tir(3), 0);
          gc_stat(id(stat_14d_titr), 3, get_stat_titr(3), 0);
          gc_min(id(stat_14d_min), 3);
          gc_max(id(stat_14d_max), 3);
          gc_glu(id(stat_14d_mean), 3, get_stat_mean(3));
          gc_glu(id(stat_14d_std_dev), 3, get_stat_stddev(3));
          gc_cv(id(stat_14d_cv), 3);
          gc_stat(id(stat_14d_low), 3, get_stat_time_low(3), 0);
          gc_stat(id(stat_14d_high), 3, get_stat_time_high(3), 0);
          gc_stat(id(stat_14d_crit_low), 3, get_stat_time_crit_low(3), 1);
          gc_stat(id(stat_14d_crit_high), 3, get_stat_time_crit_high(3), 1);
          gc_gmi(id(stat_14d_gmi), 3);

          // --- 30d: the statistics (file period 4) ---
          gc_stat(id(stat_30d_tir), 4, get_stat_tir(4), 0);
          gc_stat(id(stat_30d_titr), 4, get_stat_titr(4), 0);
          gc_min(id(stat_30d_min), 4);
          gc_max(id(stat_30d_max), 4);
          gc_glu(id(stat_30d_mean), 4, get_stat_mean(4));
          gc_glu(id(stat_30d_std_dev), 4, get_stat_stddev(4));
          gc_cv(id(stat_30d_cv), 4);
          gc_stat(id(stat_30d_low), 4, get_stat_time_low(4), 0);
          gc_stat(id(stat_30d_high), 4, get_stat_time_high(4), 0);
          gc_stat(id(stat_30d_crit_low), 4, get_stat_time_crit_low(4), 1);
          gc_stat(id(stat_30d_crit_high), 4, get_stat_time_crit_high(4), 1);
          gc_gmi(id(stat_30d_gmi), 4);

          // --- 90d: the statistics (file period 5) ---
          gc_stat(id(stat_90d_tir), 5, get_stat_tir(5), 0);
          gc_stat(id(stat_90d_titr), 5, get_stat_titr(5), 0);
          gc_min(id(stat_90d_min), 5);
          gc_max(id(stat_90d_max), 5);
          gc_glu(id(stat_90d_mean), 5, get_stat_mean(5));
          gc_glu(id(stat_90d_std_dev), 5, get_stat_stddev(5));
          gc_cv(id(stat_90d_cv), 5);
          gc_stat(id(stat_90d_low), 5, get_stat_time_low(5), 0);
          gc_stat(id(stat_90d_high), 5, get_stat_time_high(5), 0);
          gc_stat(id(stat_90d_crit_low), 5, get_stat_time_crit_low(5), 1);
          gc_stat(id(stat_90d_crit_high), 5, get_stat_time_crit_high(5), 1);
          gc_gmi(id(stat_90d_gmi), 5);

          // --- 180d: the statistics (file period 6) ---
          gc_stat(id(stat_180d_tir), 6, get_stat_tir(6), 0);
          gc_stat(id(stat_180d_titr), 6, get_stat_titr(6), 0);
          gc_min(id(stat_180d_min), 6);
          gc_max(id(stat_180d_max), 6);
          gc_glu(id(stat_180d_mean), 6, get_stat_mean(6));
          gc_glu(id(stat_180d_std_dev), 6, get_stat_stddev(6));
          gc_cv(id(stat_180d_cv), 6);
          gc_stat(id(stat_180d_low), 6, get_stat_time_low(6), 0);
          gc_stat(id(stat_180d_high), 6, get_stat_time_high(6), 0);
          gc_stat(id(stat_180d_crit_low), 6, get_stat_time_crit_low(6), 1);
          gc_stat(id(stat_180d_crit_high), 6, get_stat_time_crit_high(6), 1);
          gc_gmi(id(stat_180d_gmi), 6);

          ESP_LOGI("stats", "Period stats populated for all pages");


image:
  # Trend arrow: Material Design Icons arrow-right, turned at runtime (LVGL 9 rotation).
  # ESPHome 2026.9 format: images are platforms of the image component
  - platform: file
    file: mdi:arrow-right
    id: trend_arrow_img
    resize: 80x80
    type: RGB565
    transparency: alpha_channel
  # >>> weekly mini value (image)
  # the weekly pages' small current value: the same arrow at 24 px (RGB565 + alpha, 1.7 kB)
  - platform: file
    file: mdi:arrow-right
    id: trend_arrow_mini_img
    resize: 24x24
    type: RGB565
    transparency: alpha_channel
  # <<< weekly mini value (image)
  # GlucoCraft's icon on the About page: custom_components/glucocraft/brand/icon@2x.png, resized
  # with Pillow (LANCZOS) per screen size (images/glucocraft_icon_<px>.png; 96 px here, 2 bytes a pixel = 18.4 kB).
  # Stored pre-blended onto black without alpha (saves flash): the About page's background is always black
  # (about_screen bg_color 0x000000), so the look is identical.
  - platform: file
    file: images/glucocraft_icon_96.png
    id: about_icon_img
    type: RGB565

font:
  # The glyph lists come from the text catalogue (tools/make_panel_texts.py, substitutions glyphs_*): each font class's
  # fixed characters (digits and the symbols of numbers, units and dates: %, /, :, +, the decimal comma) and every
  # other character the catalogue uses, so that a language with other letters needs no change here.
  #   glyphs_text: the text fonts up to 26 px (every font that shows a name or a text from GlucoCraft), with the
  #     accented Latin letters of names such as "Jürgen" (the source name, the weekly descriptions): Latin-1 and the
  #     common Central European letters; glyphs_heading: the larger fonts (the panel's own texts and numbers only);
  #     glyphs_clock / glyphs_value / glyphs_delta: the clock, the glucose value (LO / HI) and the 5-minute delta.
  - file: "gfonts://Roboto"
    id: roboto_12
    size: 12   # statistics labels: 12 px; worst case 'GMI180d 12.9%/117' 130 of 134 px
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_14
    size: 14
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_22
    size: 22
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_26
    size: 26
    bpp: 4
    glyphs: "${glyphs_text}"
  - file: "gfonts://Roboto"
    id: roboto_32
    size: 32
    bpp: 4
    glyphs: "${glyphs_heading}"
  - file: "gfonts://Roboto"
    id: roboto_40
    size: 40
    bpp: 4
    glyphs: "${glyphs_heading}"
  # Large number-only fonts (clock, glucose value)
  - file: "gfonts://Roboto"
    id: roboto_60
    size: 60
    bpp: 4
    glyphs: "${glyphs_clock}"
  # 5 MIN DELTA value: the widest value ("+88") is 108 px at 64 px, inside the 115 px right column
  - file: "gfonts://Roboto"
    id: roboto_64
    size: 64
    bpp: 4
    glyphs: "${glyphs_delta}"
  # the glucose value; "HILO": a limit reading shows "LO" / "HI"
  - file: "gfonts://Roboto"
    id: roboto_120
    size: 120
    bpp: 4
    glyphs: "${glyphs_value}"

lvgl:
  displays:
    - my_display
  log_level: WARN
  color_depth: 16
  # 50 %: the LVGL component of ESPHome first tries internal RAM for a draw buffer of a quarter of the screen or less (lvgl_esphome.cpp,
  # "small buffers"); at 25 % the 480 x 480 panel's 115 kB buffer would take that internal RAM at boot and leave the
  # panel about 30-40 kB. From 50 % up the buffer is always in PSRAM.
  buffer_size: 50%
  touchscreens:
    # long_press_time: the glucose block and the weekly-page text change pages on a press and hold
    # of 1 second instead of a tap, so that a swipe starting on them is never read as a tap (LVGL's default: 400 ms)
    - touchscreen_id: my_touchscreen
      long_press_time: 1000ms
  page_wrap: false

  # The panel colors (gc_units.h "Panel colors"): every widget that the black design shows in black, white or gray
  # uses one of these styles instead of a fixed color, so that one script (apply_panel_theme) recolors them all. The
  # values here are the black design, the defaults; the graphs' canvases, the status bar and the value keep their own
  # colors.
  style_definitions:
    - id: theme_background       # the screen and its blocks
      bg_color: 0x000000
    - id: theme_box              # the statistics boxes: the background and their frame
      bg_color: 0x000000
      border_color: 0x808080
    - id: theme_text             # the main texts and the trend arrows
      text_color: 0xFFFFFF
      image_recolor: 0xFFFFFF
    - id: theme_text_secondary   # the 5-minute delta, the weekly description, the reading time
      text_color: 0xAAAAAA
    - id: theme_text_label       # the labels, the date and the version lines
      text_color: 0x888888
    - id: theme_text_progress    # the loading text (green, its shade for the background)
      text_color: 0x4CAF50

  # Swipes on the whole screen, not only on the graph: the top layer's objects below are clickable and catch every
  # touch, so a swipe starting on them would never reach the page. Each container therefore has its own on_swipe_left / on_swipe_right (script nav_next / nav_prev, the pages'
  # rule), scrollable: false, and gesture_bubble: false (LVGL 9 sends a gesture to the first parent WITHOUT
  # gesture_bubble - for a top-layer child that is the top layer itself, which has no handler). Their children are
  # labels / images (not clickable in LVGL) or objs with clickable: false, so the press lands on the container.
  # Not on loading_container (the loading screen covers the pages; nav_next / nav_prev do nothing while loading) and
  # not on the start-up screen.
  top_layer:
    widgets:
      - obj:
          id: header_current
          x: 0
          y: 0
          width: 480
          height: 96
          styles: theme_background
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          widgets:
            - label:
                id: clock_current
                align: LEFT_MID
                x: 15
                y: 0
                text_font: roboto_60
                styles: theme_text
                text: "${t_header_clock_initial}"
            - label:
                id: date_current
                align: RIGHT_MID
                x: -15
                y: 0
                text_font: roboto_26
                styles: theme_text_label
                text_align: RIGHT
                text: "${t_header_date_initial}"

      - obj:
          id: glucose_data_container
          hidden: true
          x: 0
          y: 96
          width: 480
          height: 160
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          # press and hold for 1 second (long_press_time above): from a graph page to the weekly pages. A return in a
          # lambda action ends only that lambda, so the page change is in its own condition (with no weekly data, or
          # on the About page, nothing changes)
          on_long_press:
            - lambda: |-
                if (!backfill_has_trends() || id(current_page) > 6) return;   // graph pages only, like the card
                id(current_page) = 7;
                id(page_idle_seconds) = 0;
            - if:
                condition:
                  lambda: 'return id(current_page) == 7;'
                then:
                  - lvgl.page.show:
                      id: page_trend_tir
                      animation: NONE
                      time: 0ms
                  - script.execute: sync_page_mode
          widgets:
            - obj:
                x: 0
                y: 0
                width: 115   # 115 | 250 | 115, so that TREND and DELTA can be large
                height: 160
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      align: CENTER
                      y: -50
                      text_font: roboto_16
                      styles: theme_text_label
                      text: "${t_glucose_trend_label}"
                  - label:
                      id: data_source_label
                      align: CENTER
                      y: 55
                      width: 111
                      height: 17   # one line of roboto_14: LVGL cuts with "..." only text taller than the label
                      text_font: roboto_14
                      styles: theme_text_label
                      text_align: CENTER
                      long_mode: DOT
                      text: ""
                  - image:
                      id: trend_arrow
                      src: trend_arrow_img
                      align: CENTER
                      y: 0
                      styles: theme_text
                      image_recolor_opa: COVER
                      hidden: true
                  # the trend word (the setting Trend shown as: word), in the text color: 26 px, wrapped at 111 px
                  # ("Changing" 109 px; "Changing slowly" on two lines between TREND and the source, worst_case_fit.py)
                  - label:
                      id: trend_word_label
                      align: CENTER
                      y: 0
                      width: 111
                      text_font: roboto_26
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: ""
                      hidden: true
                  # without a current reading: "---", as the 5-minute delta (update_glucose_display)
                  - label:
                      id: trend_none_label
                      align: CENTER
                      y: 0
                      text_font: roboto_64
                      styles: theme_text_secondary
                      text: "---"
                      hidden: true
            - obj:
                x: 115
                y: 0
                width: 250   # the value "888" @120 px needs 201
                height: 160
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      id: glucose_value
                      align: CENTER
                      y: -35
                      text_font: roboto_120
                      styles: theme_text_label   # "---" in gray until the first value
                      text: "---"
                  # the zone word under the value, in the text color (GlucoCraft's display_word; at 40 px, a text wider
                  # than the label at 32 px: "Tight range" 202 px of 248)
                  - label:
                      id: display_word_label
                      align: CENTER
                      y: 40
                      width: 248
                      text_font: roboto_40
                      styles: theme_text
                      text_align: CENTER
                      text: ""
                      long_mode: CLIP
                  # Without a current reading, in the value's place, never a number (update_glucose_display), stacked
                  # and centered in the column: the words "Sensor warming up" / "Sensor expired" / "No current data" at
                  # the zone word's large size (40 px), wrapped at its 248 px ("Sensor / warming up"), throbbing
                  # (refresh_glucose_block); under them the last reading ("Last reading: 64 mg/dL", 20 px) and when it
                  # was taken, split before the bracket on this layout: "Today at 17:39" / "(2 h 0 min ago)" (16 px;
                  # update_last_reading). Without any reading only the words. At most 2 x 48 + 24 + 2 x 19 = 158 of
                  # 160 px (LVGL's line heights; worst_case_fit.py).
                  - obj:
                      id: no_reading_box
                      align: CENTER
                      width: 248
                      height: 160
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      clickable: false
                      scrollable: false
                      hidden: true
                      layout:
                        type: flex
                        flex_flow: COLUMN
                        flex_align_main: CENTER
                        flex_align_cross: CENTER
                        flex_align_track: CENTER
                        pad_row: 0
                      widgets:
                        - label:
                            id: no_reading_label
                            width: 248
                            text_font: roboto_40
                            styles: theme_text
                            text_align: CENTER
                            long_mode: WRAP
                            text: ""
                        - label:
                            id: last_reading_label
                            width: 248
                            text_font: roboto_20
                            styles: theme_text
                            text_align: CENTER
                            long_mode: CLIP
                            text: ""
                            hidden: true
                        - label:
                            id: reading_when_label
                            width: 248
                            text_font: roboto_16
                            styles: theme_text
                            text_align: CENTER
                            long_mode: CLIP
                            text: ""
                            hidden: true
                        - label:
                            id: reading_ago_label
                            width: 248
                            text_font: roboto_16
                            styles: theme_text
                            text_align: CENTER
                            long_mode: CLIP
                            text: ""
                            hidden: true
                  # A current limit reading (LO / HI): the limit screen in the value's place, never a number
                  # (update_limit_screen; gc_units.h limit_screen), stacked and centered like the words above: the zone
                  # ("Very low" / "Very high") at the zone word's large size (40 px) in its zone color, the sensor range
                  # (20 px), since when and the last measured reading (16 px), each wrapped at 248 px; a line without
                  # data is hidden. At most 48 + 24 + 2 x 19 + 2 x 19 = 148 of 160 px (worst_case_fit.py).
                  - obj:
                      id: limit_box
                      align: CENTER
                      width: 248
                      height: 160
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      clickable: false
                      scrollable: false
                      hidden: true
                      layout:
                        type: flex
                        flex_flow: COLUMN
                        flex_align_main: CENTER
                        flex_align_cross: CENTER
                        flex_align_track: CENTER
                        pad_row: 0
                      widgets:
                        - label:
                            id: limit_title_label
                            width: 248
                            text_font: roboto_40
                            styles: theme_text
                            text_align: CENTER
                            long_mode: WRAP
                            text: ""
                        - label:
                            id: limit_range_label
                            width: 248
                            text_font: roboto_20
                            styles: theme_text
                            text_align: CENTER
                            long_mode: WRAP
                            text: ""
                            hidden: true
                        - label:
                            id: limit_since_label
                            width: 248
                            text_font: roboto_16
                            styles: theme_text
                            text_align: CENTER
                            long_mode: WRAP
                            text: ""
                            hidden: true
                        - label:
                            id: limit_measured_label
                            width: 248
                            text_font: roboto_16
                            styles: theme_text
                            text_align: CENTER
                            long_mode: WRAP
                            text: ""
                            hidden: true
            - obj:
                x: 365
                y: 0
                width: 115
                height: 160
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      align: CENTER
                      y: -50
                      text_font: roboto_16
                      styles: theme_text_label
                      text: "${t_glucose_delta_label}"   # 95 px @16 in the 115 px column (the CGM apps' term)
                  - label:
                      id: delta_value
                      align: CENTER
                      y: 0
                      text_font: roboto_64   # "+88" = 108 px in the 115 px column
                      styles: theme_text_secondary
                      text: "---"

      - obj:
          id: loading_container
          x: 0
          y: 0
          width: 480
          height: 480
          styles: theme_background
          border_width: 0
          pad_all: 0
          hidden: true
          widgets:
            - label:
                id: loading_progress_label
                align: CENTER
                y: 0
                text_font: roboto_26
                styles: theme_text_progress
                text_align: CENTER
                text: "${t_loading_initializing}"

      # ================================================================
      # TREND INFO - shown when on trend pages (current_page >= 7)
      # Positioned same as glucose_data_container + graph area
      # The small current value in the top-right corner (update_weekly_mini); the title, description and "Last 14
      # days" line below it, none of them smaller. Measured with Roboto (line
      # heights = ascent + descent; tools/worst_case_fit.py, square panel): the row y 3-32 (24 px; the value, its
      # zone word at 18 px, the arrow and the time: worst case in English the widest value + the widest zone word at
      # 18 px ("Sensor limit") + arrow + "12:59 PM" = 256 of 460 px; without a current reading "---" with no zone word
      # and no arrow), title 34-72, description
      # 76-120 (two lines at 18 px), status 124-153 of the 160 px.
      # ================================================================
      - obj:
          id: trend_info_container
          x: 0
          y: 96
          width: 480
          height: 160
          styles: theme_background
          border_width: 0
          pad_all: 0
          hidden: true
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          # press and hold for 1 second (long_press_time above): back to the 6-hour page
          on_long_press:
            - lambda: 'id(page_idle_seconds) = 0; id(current_page) = 0;'
            - lvgl.page.show:
                id: page_6h
                animation: NONE
                time: 0ms
            - script.execute: sync_page_mode
          widgets:
            - obj:
                id: weekly_mini
                x: 10
                y: 3
                width: 460
                height: 29
                clickable: false
                scrollable: false
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_main: END
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_column: 6
                widgets:
                  - label:
                      id: weekly_mini_value
                      text_font: roboto_24
                      styles: theme_text_label
                      text: "---"
                  # the zone word (update_weekly_mini sets its color: the text color, gray after the stated expiry)
                  - label:
                      id: weekly_mini_word
                      text_font: roboto_18
                      styles: theme_text
                      text: ""
                      hidden: true
                  - image:
                      id: weekly_mini_arrow
                      src: trend_arrow_mini_img
                      styles: theme_text
                      image_recolor_opa: COVER
                      hidden: true
                  - label:
                      id: weekly_mini_time
                      text_font: roboto_18
                      styles: theme_text_secondary
                      text: ""
                      hidden: true
            - label:
                id: trend_title_label
                x: 10
                y: 34
                width: 460
                text_font: roboto_32
                styles: theme_text
                text_align: CENTER
                text: ""
                clickable: false
            - label:
                id: trend_desc_label
                x: 20
                y: 76
                width: 440
                text_font: roboto_18
                styles: theme_text_secondary
                text_align: CENTER
                text: ""
                clickable: false
            - label:
                id: trend_status_label
                x: 20
                y: 124
                width: 440
                text_font: roboto_24
                styles: theme_text
                text_align: CENTER
                text: ""
                clickable: false
      - canvas:
          id: trend_canvas
          x: 0
          y: 291
          width: 480
          height: 189
          hidden: true
          clickable: false

      - obj:
          id: status_bar
          x: 0
          y: 256
          width: 480
          height: 30
          bg_color: 0x9E9E9E
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          gesture_bubble: false
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          widgets:
            - label:
                id: time_since_update
                align: LEFT_MID
                x: 10
                text_font: roboto_16
                text_color: 0xFFFFFF
                text: "${t_status_reading_none}"
            - label:
                id: warmup_countdown_label
                align: CENTER
                text_font: roboto_16
                text_color: 0xFFFFFF
                text: "${t_status_warm_up}"
                hidden: true
            - label:
                id: custom_ranges_label
                align: CENTER
                text_font: roboto_16
                text_color: 0xFFFFFF
                text: "${t_status_custom_ranges}"
                hidden: true
            # while a GlucoCraft notice is open in Repairs: taking turns with the warm-up text or "Custom ranges"; at
