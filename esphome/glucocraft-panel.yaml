interval:
  - interval: 2min
    then:
      - lambda: |-
          // Reboot only if low for 3 checks in a row (6 min) - a short dip while
          // WiFi buffers fill during a download is normal
          size_t free_heap = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          if (free_heap < 20480) {
            id(low_mem_count)++;
            ESP_LOGW("memory", "Low memory: %u bytes free (%d/3)", (unsigned) free_heap, id(low_mem_count));
            if (id(low_mem_count) >= 3) {
              ESP_LOGW("memory", "Low memory for 6 min, rebooting");
              App.safe_reboot();
            }
          } else {
            id(low_mem_count) = 0;
          }

  - interval: 5min
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - lambda: |-
                // Safety net for a stuck Wi-Fi stack only: 12 failed 5-min checks = 60 min (a shorter limit would
                // reboot the panel again and again during any Wi-Fi outage)
                id(wifi_fail_count)++;
                if (id(wifi_fail_count) >= 12) {
                  App.safe_reboot();
                }
          else:
            - lambda: 'id(wifi_fail_count) = 0;'

  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(current_page) != 0 && id(boot_sequence_complete);'
          then:
            - lambda: 'id(page_idle_seconds) += 10;'
            - if:
                condition:
                  lambda: 'return id(page_idle_seconds) >= 180;'
                then:
                  - lambda: |-
                      ESP_LOGI("page", "Auto-return to 6h page after 3 min idle");
                      id(page_idle_seconds) = 0;
                      id(current_page) = 0;
                  - lvgl.page.show:
                      id: page_6h
                      animation: NONE
                      time: 0ms
                  - lvgl.widget.hide: about_screen   # the About page
                  # Show the glucose UI; the trend UI goes as on every return from the weekly pages
                  - lvgl.widget.show: glucose_data_container
                  - lvgl.widget.show: status_bar
                  - script.execute: exit_trend_to_glucose

  # Every 5 min: refresh the 6h/24h stats from the delta file (computed by GlucoCraft: time-weighted, on the ranges
  # in its settings, intervals without data excluded). No 5-min "live point" on the graph: CGM values never hold
  # steady, so it would only repeat the last value over real short delivery gaps.
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return id(bf_ok) && delta_stats_start();'
          then:
            - wait_until:
                condition:
                  lambda: 'return delta_stats_state() != 1;'
                timeout: 60s
            - if:
                condition:
                  lambda: 'return delta_stats_apply();'
                then:
                  - script.execute: update_stats_display
                  - delay: 200ms
                  - script.execute: populate_period_stats
                  # refill the 6 h graph from the files: gaps the panel missed come back
                  - lambda: |-
                      auto tn = id(ha_time).now();
                      if (tn.is_valid()) gc_rebuild_6h(id(glucose_history), id(glucose_history_ts),
                          &id(glucose_history_count), &id(glucose_history_index), (uint32_t) tn.timestamp);
                  - delay: 200ms
                  - script.execute: draw_glucose_graph
                else:
                  # no recent-readings file: the full file's 6 h / 24 h statistics, as on the display card
                  - if:
                      condition:
                        lambda: 'return delta_stats_fallback();'
                      then:
                        - script.execute: update_stats_display
                        - delay: 200ms
                        - script.execute: populate_period_stats

  # Once a minute: redraw the glucose section and the 6 h graph, so its time axis keeps moving during an outage
  # (not only on a new value)
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return !id(loading_mode_active) && id(boot_sequence_complete);'
          then:
            - script.execute: update_glucose_display
            - delay: 300ms
            - script.execute: draw_glucose_graph

  - interval: 60min
    then:
      - if:
          condition:
            lambda: 'return id(bf_ok) && id(boot_sequence_complete);'
          then:
            - script.execute: backfill_hourly

  - interval: 1s
    then:
      - lambda: |-
          // the top layer of the page shown (the page changes call it at once; this is the safety net)
          const int cp = id(current_page);
          id(sync_page_mode).execute();
          // Home Assistant's zone, saved for the next boot when it is new or changed (gc_units.h keep_tz)
          gcu::keep_tz();
          // the About screen belongs to page 16 only (a safety net for any other way off it)
          if (cp != 16 && !lv_obj_has_flag(id(about_screen), LV_OBJ_FLAG_HIDDEN)) lv_obj_add_flag(id(about_screen), LV_OBJ_FLAG_HIDDEN);

          // Home Assistant's time zone: it comes with the time sync (until then the last zone received, gc_units.h
          // boot_tz; UTC only before the very first sync); a new or changed zone
          // redraws the time axes and labels
          {
            static int32_t tz_sig = 0;
            static bool tz_seen = false;
            const int32_t sig = gcu::tz_signature();
            if (!tz_seen || sig != tz_sig) {
              if (tz_seen && id(boot_sequence_complete) && !id(loading_mode_active)) {
                ESP_LOGI("time", "Time zone changed - redrawing the time axes");
                id(redraw_time_zone).execute();
              }
              tz_sig = sig;
              tz_seen = true;
            }
          }

          // The screen without Home Assistant (gc_units.h no_connection_screen): one hour (NO_HA_AFTER_S) without the
          // ESPHome connection to Home Assistant (lost at boot until it connects) or without a successful download of
          // GlucoCraft's files (glucocraft_panel_binary.h, from the first failure after the last success), since
          // whichever started first. Its lines are refreshed every second (the last reading keeps updating while only
          // the downloads fail); it clears by itself when both work again. Also with no clock ("--:--").
          {
            const uint32_t ms = millis();
            const bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
            if (api_ok) id(api_lost_since_ms) = 0;
            else if (id(api_lost_since_ms) == 0) id(api_lost_since_ms) = ms | 1;   // | 1: 0 means connected
            uint32_t lost_ms = 0;   // how long the older of the two problems has lasted
            if (id(api_lost_since_ms) != 0) lost_ms = ms - id(api_lost_since_ms);
            const uint32_t dl = backfill_failing_since_ms();
            if (dl != 0 && ms - dl > lost_ms) lost_ms = ms - dl;
            const bool up = (id(api_lost_since_ms) != 0 || dl != 0) && lost_ms / 1000 >= gcu::NO_HA_AFTER_S;
            if (up) {
              static std::string shown[4];
              lv_obj_t *labels[4] = {id(no_ha_title_label), id(no_ha_since_label), id(no_ha_reading_label),
                                     id(no_ha_check_label)};
              char line[4][gcu::SCREEN_LINE];
              const auto tn = id(ha_time).now();
              const bool live = !isnan(id(glucose_current).state);
              gcu::no_connection_screen(line, lost_ms / 1000, tn.is_valid() ? (uint32_t) tn.timestamp : 0,
                                        live ? id(glucose_current).state : id(saved_glucose_mgdl),
                                        live ? gcu::limit() : id(saved_glucose_limit), id(last_reading_epoch));
              for (int i = 0; i < 4; i++) {
                if (shown[i] == line[i]) continue;
                shown[i] = line[i];
                lv_label_set_text(labels[i], line[i]);
              }
            }
            if (up != id(no_ha_screen_on)) {
              id(no_ha_screen_on) = up;
              ESP_LOGW("connection", "%s", up ? "No connection to Home Assistant or no data from it for an hour"
                                              : "Home Assistant and its data are back");
              id(no_ha_screen_apply).execute();
            }
          }

          auto time = id(ha_time).now();
          if (!time.is_valid()) return;

          char time_str[32];
          char date_str[96];
          gcu::clock(time_str, sizeof(time_str), time.hour, time.minute);   // "7:46 AM" / "07:46"

          int dow = time.day_of_week;   // 1 = Sunday
          int mon = time.month;
          if (dow < 1 || dow > 7) dow = 1;
          if (mon < 1 || mon > 12) mon = 1;
          char dm[48];
          gcu::day_month(dm, sizeof(dm), mon - 1, time.day_of_month, true);   // "October 22" / "22 October"
          gcu::fill(date_str, sizeof(date_str), gct::header_date, {{"weekday", gct::weekday[dow - 1]}, {"date", dm}});

          id(global_time_str) = time_str;
          id(global_date_str) = date_str;

          // Sensor warm-up: the minutes since GlucoCraft saw it start, from its started_at (survives a panel reboot;
          // gc_units.h warm_up_text, the display card's rule); GlucoCraft ends the warm-up at the first real reading
          if (id(sensor_warmup_active)) {
            char warmup_buf[64];
            gcu::warm_up_text(warmup_buf, sizeof(warmup_buf), id(ha_warmup_started).state, (uint32_t) time.timestamp);
            id(global_warmup_str) = warmup_buf;   // the bar color is GlucoCraft's status color (one system)
          }

          // After a reboot, seed "Reading: 6 min ago" from the newest stored reading's real
          // timestamp (Home Assistant's initial value arrives during the loading screen and is not counted)
          if (id(last_glucose_update_time) == 0 && id(bf_ok) && id(glucose_history_count) > 0) {
            uint32_t newest = id(glucose_history_ts)[(id(glucose_history_index) + 179) % 180];
            uint32_t now_s = (uint32_t) time.timestamp;
            if (newest > 0 && newest <= now_s && now_s - newest < 3600) {
              uint32_t age_ms = (now_s - newest) * 1000;
              if (millis() > age_ms) id(last_glucose_update_time) = millis() - age_ms;
            }
          }

          // Age of the newest reading = the panel's synced clock - GlucoCraft's last_reading_ts: right across
          // reboots, API reconnects and Home Assistant outages. Fallback: local clock.
          bool have_age = false;
          uint32_t age_s = 0;   // seconds (milliseconds would overflow 32 bits after 49.7 days without data)
          uint32_t last_ts = (uint32_t) strtoul(id(ha_last_reading_ts).state.c_str(), nullptr, 10);
          if (last_ts <= 1600000000UL && id(saved_glucose_ts) > 1600000000UL) last_ts = id(saved_glucose_ts);   // after a reboot without Home Assistant
          // a reading time more than the one tolerance ahead of the clock cannot be trusted (gc_units.h
          // FUTURE_TOLERANCE_S; GlucoCraft's time_untrusted says the same): no age is shown ("Reading: ---"), and the
          // panel's own count uses the time it arrived
          const bool ahead = last_ts > 1600000000UL && last_ts > (uint32_t) time.timestamp + gcu::FUTURE_TOLERANCE_S;
          const bool untrusted = ahead || id(time_untrusted);
          if (last_ts > 1600000000UL && !ahead) {   // a small skew counts as 0, like the card
            uint32_t now_s = (uint32_t) time.timestamp;
            age_s = now_s > last_ts ? now_s - last_ts : 0;
            have_age = true;
          } else if (id(last_glucose_update_time) > 0) {
            age_s = (millis() - id(last_glucose_update_time)) / 1000UL;
            have_age = true;
          }
          // the last reading's time for the lines under the words without a current reading (update_last_reading) and
          // for the screen without Home Assistant; none while it cannot be trusted
          id(last_reading_epoch) = have_age && !untrusted && (uint32_t) time.timestamp > age_s
                                       ? (uint32_t) time.timestamp - age_s : 0;
          if (!lv_obj_has_flag(id(no_reading_box), LV_OBJ_FLAG_HIDDEN)) id(update_last_reading).execute();
          if (!lv_obj_has_flag(id(limit_box), LV_OBJ_FLAG_HIDDEN)) id(update_limit_screen).execute();

          // The status bar's age of the reading: "Reading: 6 min ago", after 99 minutes "Reading: 2 h ago" (gc_units.h
          // reading_age, the display card's rule), whole minutes from the seconds, with no upper cap; "Reading: ---"
          // without a reading or while its time cannot be trusted
          if (have_age && !untrusted) {
            char time_since_buf[64];
            gcu::reading_age(time_since_buf, sizeof(time_since_buf), age_s / 60);
            id(global_time_since_update) = time_since_buf;
          } else {
            id(global_time_since_update) = gct::status_reading_none;
          }
          // The value in hand is not the newest reading's for over a minute: the age and the flag still look current, but
          // the number is old (the id of Last glucose reading was changed and not undone). Never an old number as current.
          {
            static uint32_t differs_since = 0;
            const double want = gcu::attr_value(id(ha_last_reading_mgdl).state);
            const float have = id(glucose_current).state;
            const bool differs = !isnan(want) && (isnan(have) || fabs(have - want) > 0.05);
            if (!differs) differs_since = 0;
            else if (differs_since == 0) differs_since = millis() | 1;   // | 1: 0 means "not differing"
            const bool lost = differs_since != 0 && millis() - differs_since > 60000UL;
            if (lost != id(value_lost)) {
              id(value_lost) = lost;
              if (lost) ESP_LOGW("stale", "The newest reading has stopped arriving");
              else ESP_LOGI("stale", "The newest reading is arriving again");
            }
          }
          // Panel-side stale: no measurement for longer than GlucoCraft's stale threshold by the panel's own count -
          // covers Home Assistant or the API down, when Home Assistant's stale flag cannot reach the panel - or the
          // value lost (above).
          const float thr = id(stale_threshold_min) > 0 ? id(stale_threshold_min) : 15.0f;   // kept across a restart
          {
            bool ls = (have_age && age_s > (uint32_t)(thr * 60.0f)) || id(value_lost);
            // Bar color = GlucoCraft's status color (one system); the panel's own count overrides it only with red
            // "no current data" (Home Assistant cannot update it then)
            const std::string &st = id(gc_status);
            id(global_time_since_color) = (st != "warm_up" && st != "expired" && ls) ? 0xE53935 : id(gc_status_color);
            if (ls != id(local_stale)) {
              id(local_stale) = ls;
              id(refresh_glucose_block).execute();
              id(update_glucose_display).execute();   // the words in the value's place, or the value again
            }
          }
          // The words without a current reading throb for the first 30 minutes of each episode, counted from the
          // reading's age (or the warm-up's start), so a restart does not start the 30 minutes again; an episode whose
          // start is not known from the moment the panel first showed it (gc_units.h throb_window); when that changes,
          // the block is refreshed
          {
            static uint32_t shown_at = 0;   // millis() when the panel first showed this episode's words (0: none)
            static int shown_kind = 0;      // 1 a warm-up, 2 no current data
            const bool words = gcu::no_reading_words(id(sensor_warmup_active), id(data_stale) || id(local_stale),
                                                     id(sensor_expired)) != nullptr;
            const int kind = !words ? 0 : (id(sensor_warmup_active) ? 1 : 2);
            if (kind != shown_kind) {
              shown_kind = kind;
              shown_at = kind != 0 ? (millis() | 1) : 0;   // | 1: 0 means "none"
            }
            const uint32_t shown_s = shown_at != 0 ? (millis() - shown_at) / 1000UL : 0;
            const long wmin = id(sensor_warmup_active)
                                  ? gcu::warm_up_minutes(id(ha_warmup_started).state, (uint32_t) time.timestamp) : -1;
            const bool throb = gcu::throb_window(id(sensor_warmup_active), wmin, have_age && !untrusted, age_s,
                                                 (uint32_t) (thr * 60.0f), shown_s);
            if (throb != id(words_throb)) {
              id(words_throb) = throb;
              id(refresh_glucose_block).execute();
            }
          }

          // Calculate sensor expiry countdown
          if (id(sensor_expiry_epoch) > 0) {
            // minutes left from the UTC epoch (local clock minutes would be 1 h off across a DST change);
            // rounded down, like the display card
            const int64_t diff_s = (int64_t) id(sensor_expiry_epoch) - (int64_t) time.timestamp;   // 64-bit: past 2038
            const int64_t remaining_minutes = diff_s >= 0 ? diff_s / 60 : -((-diff_s + 59) / 60);

            // (expired = GlucoCraft's status, set by ha_status; the countdown is only the text, and
            // update_glucose_display decides what the value's place shows)
            char expiry_buf[64];
            if (remaining_minutes <= 0) {
              // Sensor expired
              snprintf(expiry_buf, sizeof(expiry_buf), "%s", gct::status_expired);
            } else if (remaining_minutes < 60) {
              // Less than 1 hour: show minutes only
              gcu::fill(expiry_buf, sizeof(expiry_buf), gct::status_expiry_minutes, {{"minutes", remaining_minutes}});
            } else if (remaining_minutes > 2880) {
              // More than 48 hours: show days and hours
              int remaining_hours = remaining_minutes / 60;
              int days = remaining_hours / 24;
              int hours = remaining_hours % 24;
              gcu::fill(expiry_buf, sizeof(expiry_buf), gct::status_expiry_days, {{"days", days}, {"hours", hours}});
            } else {
              // 1-48 hours: show hours and minutes
              int hours = remaining_minutes / 60;
              int mins = remaining_minutes % 60;
              gcu::fill(expiry_buf, sizeof(expiry_buf), gct::status_expiry_hours, {{"hours", hours}, {"minutes", mins}});
            }
            id(global_sensor_expiry_str) = expiry_buf;
            // "Sensor expiry passed" throbs while GlucoCraft's status is expired, or expiring past the stated time,
            // until a new sensor is seen (the status changes); no 30-minute limit (the text is small, and a new sensor
            // can take a while); the setting Fade the words ... stops it, as it stops the words' throb
            const std::string &st = id(gc_status);
            id(expiry_throb) = st == "expired" || (st == "expiring_soon" && remaining_minutes <= 0);
          } else {
            id(global_sensor_expiry_str) = "";   // no expiry known: show nothing
            id(expiry_throb) = false;
          }
          lvc_throb(id(sensor_expiry_label), id(expiry_throb) && id(flash_on));
      - lvgl.label.update:
          id: clock_current
          text: !lambda return id(global_time_str).c_str();
      - lvgl.label.update:
          id: date_current
          text: !lambda return id(global_date_str).c_str();
      # the status bar's texts in black or white, whichever reads better on the bar's color (gc_units.h text_on)
      - lvgl.label.update:
          id: time_since_update
          text: !lambda return id(global_time_since_update).c_str();
          text_color: !lambda return lv_color_hex(gcu::text_on(id(global_time_since_color)));
      - lvgl.label.update:
          id: warmup_countdown_label
          text: !lambda return id(global_warmup_str).c_str();
          text_color: !lambda return lv_color_hex(gcu::text_on(id(global_time_since_color)));
      - lvgl.label.update:
          id: custom_ranges_label
          text_color: !lambda return lv_color_hex(gcu::text_on(id(global_time_since_color)));
      - lvgl.label.update:
          id: check_ha_label
          text_color: !lambda return lv_color_hex(gcu::text_on(id(global_time_since_color)));
      # The middle of the status bar: the warm-up text during a warm-up, else "Custom ranges" while GlucoCraft's custom
      # ranges are on; while a GlucoCraft notice is open in Home Assistant's Repairs (attention_on), "Check Home
      # Assistant" takes turns with it every 3 seconds (alone when neither is shown). Nothing else changes.
      - lambda: |-
          static uint32_t tick = 0;
          tick++;
          const int base = id(sensor_warmup_active) ? 1 : (id(ha_custom_ranges).state ? 2 : 0);
          const bool check = id(attention_on) && (base == 0 || (tick / 3) % 2 == 1);
          auto show = [](lv_obj_t *o, bool on) {
            if (on == lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) {
              if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            }
          };
          show(id(warmup_countdown_label), base == 1 && !check);
          show(id(custom_ranges_label), base == 2 && !check);
          show(id(check_ha_label), check);
      - lvgl.label.update:
          id: sensor_expiry_label
          text: !lambda return id(global_sensor_expiry_str).c_str();
          text_color: !lambda return lv_color_hex(gcu::text_on(id(global_time_since_color)));
      - lvgl.obj.update:
          id: status_bar
          bg_color: !lambda return lv_color_hex(id(global_time_since_color));
      # >>> weekly mini value (call)
      - if:
          condition:
            lambda: 'return id(current_page) >= 7 && id(current_page) <= 15;'
          then:
            - script.execute: update_weekly_mini
      # <<< weekly mini value (call)
