      # >>> About screen: a full screen with nothing else on it, so that the text can be larger, above the clock
      # header, the glucose block and the status bar (the top layer's last child but the start-up screen), shown while
      # page_about (current_page 16) is shown; it takes the touches then: swipe left = the 6-hour page, swipe right =
      # the last weekly page. Texts: GlucoCraft's disclaimer in its short form (its first sentence as the title; the long form is in the
      # Documentation), then the
      # version line and the copyright line; no citations on the panels (the display card's About page shows the same
      # texts). The square panel: GlucoCraft's icon centered at the top, the title and the disclaimer centered below
      # it, together centered in the room above the footer; the footer at the bottom: a thin line, the version line
      # and the copyright line. The landscape generator replaces this block with the wide layout (the icon in a column
      # on the left, the texts and the footer centered in the column to its right; make_glucocraft_landscape.py
      # ABOUT_WIDE). The square panel (480 x 480), English, measured with Roboto (worst_case_fit.py): icon 96 px,
      # title 22 px, the disclaimer 9 lines at 18 px (92 % = 441 px), the footer 3 lines at 16 px.
      - obj:
          id: about_screen
          hidden: true
          x: 0
          y: 0
          width: 100%
          height: 100%
          styles: theme_background
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_top: 19   # about top
          pad_bottom: 12   # about bottom
          pad_left: 0
          pad_right: 0
          scrollable: false
          gesture_bubble: false   # so its own swipes below get the gesture (not the top layer)
          layout:
            type: flex
            flex_flow: COLUMN
            flex_align_main: START
            flex_align_cross: CENTER
            flex_align_track: CENTER
            pad_row: 0
          # the one navigation rule (nav_next / nav_prev handle page 16, and wait for the finger to lift)
          on_swipe_left:
            - script.execute: nav_next
          on_swipe_right:
            - script.execute: nav_prev
          widgets:
            # the icon, the title and the disclaimer, centered in the room above the footer
            - obj:
                width: 100%
                flex_grow: 1
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                scrollable: false
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_row: 12   # about gap
                widgets:
                  - image:
                      src: about_icon_img
                      clickable: false
                  - label:
                      width: 92%
                      text_font: roboto_22   # about heading font
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: "${t_about_title}"
                  - label:
                      width: 92%
                      text_font: roboto_18   # about text font
                      styles: theme_text
                      text_align: CENTER
                      long_mode: WRAP
                      text: "${t_about_disclaimer}"
            # the footer: a thin line in the frame color, the version line and the copyright line (two lines, the
            # catalogue's line break), in the version's font
            - obj:
                width: 100%
                height: SIZE_CONTENT
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                scrollable: false
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: START
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_row: 4   # about footer gap
                widgets:
                  - obj:
                      width: 40%
                      height: 9   # about footer line: the line on top, 8 px to the version line
                      styles: theme_box
                      bg_opa: TRANSP
                      border_width: 1
                      border_side: TOP
                      radius: 0
                      pad_all: 0
                      clickable: false
                      scrollable: false
                  - label:
                      text_font: roboto_16   # about version font
                      styles: theme_text_label
                      text: "${t_about_version}"
                  - label:
                      text_font: roboto_16   # about version font
                      styles: theme_text_label
                      text_align: CENTER
                      text: "${t_about_copyright}"
      # <<< About screen

      # >>> start-up screen: GlucoCraft's icon, its name, the panel version and the disclaimer line, above everything
      # (the top layer's last child); at boot for 15 seconds (on_boot; a swipe ends it early). It takes the touches
      # while it is shown: its swipes go to nav_next / nav_prev, which end it. The landscape generator keeps this
