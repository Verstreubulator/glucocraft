      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  - platform: homeassistant
    id: stats_6h_custom_titr
    entity_id: sensor.glucocraft_6h_custom_ranges
    attribute: time_in_tight_range
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  - platform: homeassistant
    id: stats_6h_custom_low
    entity_id: sensor.glucocraft_6h_custom_ranges
    attribute: time_low
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  - platform: homeassistant
    id: stats_6h_custom_high
    entity_id: sensor.glucocraft_6h_custom_ranges
    attribute: time_high
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  # Very low, Very high, the minimum and the maximum of the same summaries (glucose values in mg/dL); the LO / HI
  # marks of the minimum and the maximum follow
  - platform: homeassistant
    id: stats_6h_consensus_very_low
    entity_id: sensor.glucocraft_6h_consensus_ranges
    attribute: time_below_54
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_stats_display
  - platform: homeassistant
    id: stats_6h_consensus_very_high
    entity_id: sensor.glucocraft_6h_consensus_ranges
    attribute: time_above_250
    internal: true
    on_value:
      then:
