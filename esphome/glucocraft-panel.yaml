# ============================================================================
# GLUCOCRAFT PANEL - Guition ESP32-S3-4848S040 (4", 480 x 480)
# ============================================================================
# Hardware: Guition ESP32-S3-4848S040 (N16R8: 16 MB flash, 8 MB octal PSRAM), 480 x 480 ST7701S RGB display,
# GT911 touch.
#
# An example wall panel for the GlucoCraft integration. It reads only GlucoCraft: its entities through the ESPHome
# API, and its panel files (GLU2 v3, panel_feed.py) over plain HTTP from GlucoCraft's GET-only, local-only wall-panel
# address; the panel holds no Home Assistant token. This file is also the source of the landscape panels, which
# tools/make_glucocraft_landscape.py generates from it.
#
# Secrets (secrets.yaml): wifi_ssid, wifi_password, glucocraft_panel_api_key (also the OTA key),
# glucocraft_panel_ap_password, glucocraft_panel_webhook_id. Substitutions: ha_host / ha_port (the Home Assistant
# that runs GlucoCraft), ntp_router (an optional local time server) and language (the panel's texts, see below).
#
# What the panel shows:
#   - GlucoCraft's entities (sensor.glucocraft_*, binary_sensor.glucocraft_*); the ranges from the attributes of
#     binary_sensor.glucocraft_using_custom_ranges, and without them the consensus ranges (54 / 70 / 70 / 140 / 180 /
#     250 mg/dL), GlucoCraft's default.
#   - Left of the value, the TREND column: one arrow turned by GlucoCraft's rate of change, for any source (the
#     scale and the five words of the FreeStyle Libre convention: +-2 mg/dL/min = straight up / down, as
#     GlucoCraft sends them), or, by GlucoCraft's setting Trend shown as (the configuration attribute trend_display),
#     its trend word (the Trend arrow attribute word, the broader category of the same rate; a longer word on two
#     lines). 5 MIN DELTA = GlucoCraft's change of the smoothed glucose over 5 minutes
#     (sensor.glucocraft_5_minute_delta).
#   - The zone word under the value, in the text color, in every setting: GlucoCraft's display_word ("Very low" ...
#     "Tight range" ... "Very high"). The value is in GlucoCraft's zone color, also after the sensor's stated expiry
#     while readings still arrive (the red status bar's "Sensor expiry passed" carries the expiry; the trend follows
#     the data), as on the display card.
#   - No current reading (gc_units.h no_reading_words): never a number. During a warm-up the value's place says
#     "Sensor warming up"; without current data (GlucoCraft's flag binary_sensor.glucocraft_no_current_data, or the
#     panel's own count of the reading's age past the same limit while Home Assistant cannot reach it; never the
#     status) "Sensor expired" after the stated expiry, else "No current data", at the zone word's large size; under
#     them, smaller and still, the last reading ("Last reading: 64 mg/dL", "Last reading: LO"; kept across a reboot)
#     and when it was taken ("Today at 17:39 (2 h 0 min ago)", split before the bracket on the square and 3.5-inch
#     layouts), both omitted without any reading, and the time line also while the reading's time is ahead of the
#     clock; the zone word is empty, the trend and the 5-minute delta show "---", the status bar keeps the reading's
#     age and the status. The words throb (lvgl_compat.h lvc_throb) for the first 30 minutes of each episode, counted
#     from the reading's age, or where the episode's start is not known from the moment the panel first showed it
#     (gc_units.h throb_window), then hold still, unless GlucoCraft's setting Fade the words when there is no current reading (the
#     configuration attribute flash_no_current_data, on by default) is off.
#   - A limit reading (LO / HI) as the current reading: the limit screen in the value's place (gc_units.h
#     limit_screen): "Very low" / "Very high" large in the zone color, "Below sensor range (LO)" / "Above sensor range
#     (HI)", since when, and the last measured reading before the stretch; the trend blank. After the no-current-data
#     limit without a new reading, the screen without current data ("Last reading: LO").
#   - Without Home Assistant: after one hour without the ESPHome connection to Home Assistant or without a successful
#     download of GlucoCraft's files, everything below the clock and the date is black with "Cannot reach Home
#     Assistant or load its data", since when, the last reading and what to check (gc_units.h no_connection_screen);
#     it wins over every other screen, does not throb, the page changes do nothing while it is up, and it clears by
#     itself when both work again.
#   - The status bar: the reading's age ("Reading: ---" while its time is ahead of the clock), in the middle the
#     warm-up or "Custom ranges", taking turns with "Check Home Assistant" while a GlucoCraft notice is open in Home
#     Assistant's Repairs (the configuration attribute attention), and the expiry, whose "Sensor expiry passed"
#     throbs until a new sensor is seen (the same setting stops it).
#   - Page changes are instant, as on the display card (slides look ragged on the larger panels).
#   - Start-up screen and About page (no citations on the panels): every start shows the start-up screen for 15
#     seconds (a swipe ends it early): GlucoCraft's icon, its name, the panel version and the two lines "For development
#     and testing only." / "Not for medical use."; then the panel continues by itself. 17 pages in all: page 16 is About
#     (the icon, GlucoCraft's disclaimer in its short form, the version line and the copyright line), a full screen in the top
#     layer (no clock
#     header, no glucose information, larger text); a swipe leaves it. No on-screen buttons: every page is reached by
#     swiping (and the 1-second press and hold).
#   - International settings (sensor.glucocraft_configuration attributes, gc_units.h): decimal
#     separator for every displayed decimal, A1C / GMI unit (percent, mmol/mol, both) for every GMI; the panels show no
#     calendar weeks (the 7-day graph is a rolling window; the weekly pages' weeks come from GlucoCraft's file), so the
#     first day of the week is not needed here. Accented Latin letters in the text fonts up to 26 px.
#   - Texts: every text is in the text catalogue i18n/<language>.yaml (English: i18n/en.yaml), chosen by the substitution
#     language; tools/make_panel_texts.py generates from it the static label texts (substitutions t_*), the texts of
#     the lambdas and headers (gc_text.h, gct::*) and the fonts' glyph lists (glyphs_*), in i18n/generated/<language>/.
#     The fit of every text on every layout: tools/worst_case_fit.py <language>.
#   - Colors (sensor.glucocraft_configuration attributes, gc_units.h): the graph bands in GlucoCraft's band colors
#     (band_colors), the value (a limit reading included) in GlucoCraft's zone color (zone_color); the screen
#     background and the text color from panel_background and panel_foreground (black and white by default), with the
#     grays derived from them. The graphs keep their own black canvas, white line and white labels on every background.
#   - Outline text (the configuration attribute text_outline, off by default; lvgl_compat.h): a 1-pixel edge around
#     the graph labels and the labels in a zone color (the value, LO / HI, the weekly pages' small value).
#   - A limit reading (outside the sensor's measurement range, GlucoCraft's limit / limit_text attributes) has no
#     value: in the value's place the limit screen (above); the graphs break their line there and mark the stretch
#     with small marks at the bottom (LO) or top (HI) edge, no text (the files' GCR1 block and the live stretch;
#     glucocraft_panel_binary.h gc_draw_limit_marks); a period whose sensor covered less than 70 % shows "---" in
#     every statistic (GlucoCraft's all-zero STATS block);
#     one gap rule for every graph line (an interval longer than max(15 min, 3 x the
#     reading interval around it), gc_units.h); every local time in Home Assistant's time zone (until the first sync
#     after a start, the last zone received, kept in flash; UTC only before the very first sync); on the weekly pages
#     a small current value in the top-right corner (this panel only: the landscape
#     panels keep the glucose block there).
#   - Weekly pages: the 14-day values at each week's end, in the standard GlucoCraft's setting selects (consensus
#     ranges and targets, or custom ranges and goals; texts and targets from the file; the chart is labeled
#     "Consensus target" or "Custom goal" only where a target or goal colors it);
#     no verdicts; green = within / red = outside the cited target or the goal at 60 % over black, neutral gray
#     where there is none; direction = Increasing / Decreasing / Stable (data only, everything referenced).
#   - Full and delta files: GlucoCraft's GET-only, local-only wall-panel address (panel_feed.py, GLU2 v3).
#   - Sensor expiry: GlucoCraft's sensor_expiry (expires_at, from whatever expiry entity the user chose,
#     or none); warm-up = GlucoCraft's binary sensor (any CGM).
# ============================================================================

substitutions:
  panel_version: "0.0.1"   # GlucoCraft panel firmware (shown on the start-up screen, the About page and in Home Assistant's device info)
  # the panel's language: the text catalogue i18n/<language>.yaml (en, or any language with a catalogue there)
  language: en
  # Optional: a local NTP time server (for example a router that serves NTP), the panel's second clock, as an IP
  # address (not a .local name, which the panel may not resolve). The panel
  # takes its time from Home Assistant; the time server matters only for a panel that starts while Home Assistant
  # is not connected. Without one, keep the Home Assistant address ("${ha_host}"): where no time server answers,
  # the panel keeps Home Assistant's time only. Never a public time server (the panel stays on the home network).
  ntp_router: "${ha_host}"   # optional: a local NTP time server (see above); the default, the Home Assistant address
  # the Home Assistant that runs GlucoCraft, for the panel files (glucocraft_panel_binary.h reads them from
  # GC_HA_BASE): ha_host = its IP address (not a .local name such as homeassistant.local, which the panel may not
  # resolve), ha_port = its HTTP port (8123 unless it was changed). The panel reads over
  # plain HTTP, so a Home Assistant that answers only over HTTPS needs a plain-HTTP address the panel can reach.
  ha_host: "192.0.2.10"   # REPLACE: the address of your Home Assistant (this placeholder is a documentation address that reaches nothing)
  ha_port: "8123"   # REPLACE if needed: Home Assistant's HTTP port (8123 unless it was changed)
  # The id of GlucoCraft's wall-panel address (shown to administrators on GlucoCraft's Display card and wall panels
  # screen; secrets.yaml, never inline). The firmware must hold it, so it is also in the validated configuration
  # (esphome config, the Device Builder's Validate), in the ESPHome build folder (.esphome/build/<name>/) and, where the
  # panel reaches Home Assistant through a reverse proxy, in that proxy's access log: never share these.
  gc_webhook_id: !secret glucocraft_panel_webhook_id

# the texts in the panel's language and the fonts' glyph lists (substitutions t_* and glyphs_*), generated from the
# catalogue by tools/make_panel_texts.py
packages:
  texts: !include i18n/generated/${language}/texts.yaml

esphome:
  name: glucocraft-panel
  friendly_name: GlucoCraft Panel
  project:
    name: glucocraft.guition4848s040-480x480   # the panel type: the board and its resolution (docs/PANELS.md)
    version: "${panel_version}"
  build_flags:   # ESPHome 2026.9: replaces platformio_options: build_flags (deprecated)
    - '-DGC_WEBHOOK_ID=\"${gc_webhook_id}\"'
    - '-DGC_HA_BASE=\"http://${ha_host}:${ha_port}\"'   # where the panel files come from
  includes:
    - lvgl_compat.h
    - glucocraft_panel_binary.h
    - gc_units.h   # glucose in the display unit (mg/dL held, mmol/L shown)
    - i18n/generated/${language}/gc_text.h   # the texts in the panel's language (gct::*)
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            // Local time = Home Assistant's time zone: ESPHome keeps one zone for the device (localtime() included)
            // and the homeassistant time platform sets Home Assistant's zone with every sync. The panel applies the
            // last zone it received (kept in flash; gc_units.h boot_tz), so a reboot while Home Assistant is down
            // keeps local times; UTC only on the very first boot.
            gcu::boot_tz();
            gcu::boot_theme();   // the panel colors received last (gc_units.h "Panel colors"); applied at -10
            // the reading and graph arrays start empty (static globals, zeroed at start); the boot download fills them
            id(loading_mode_active) = false;
            id(boot_sequence_complete) = false;
            ESP_LOGI("boot", "PRIORITY 600: boot flags reset");
    - priority: -10
      then:
        # Outline text as saved last, and the labels in a zone color that take its edge (LVGL is set up by now)
        - lambda: |-
            lvc_outline_text() = id(text_outline_on);
            lvc_label_edge(id(glucose_value));
            lvc_label_edge(id(limit_title_label));   // the limit screen's zone, in the zone color
        # >>> weekly mini value (edge)
        - lambda: 'lvc_label_edge(id(weekly_mini_value));'
        # <<< weekly mini value (edge)
        # the panel colors on the screen before its first frame
        - script.execute: apply_panel_theme
        # The backfill is plain HTTP from GlucoCraft's local-only wall-panel address - it needs WiFi, not the Home Assistant API
        - wait_until:
            condition:
              wifi.connected:
            timeout: 60s
        - delay: 2s
        - logger.log: "WiFi up, starting backfill"
        - script.execute: backfill_boot_sequence
    # The start-up screen (the icon, the name, the version and the disclaimer line, top layer): every start, for 15
    # seconds (a swipe ends it early), then the panel continues by itself, with no action (the panels restart often,
    # mostly when no one is there; the About page shows the disclaimer's short form at any time)
    - priority: -100
      then:
        - delay: 15s
        - script.execute: end_startup

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_TASK_WDT: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: y
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: y
    advanced:
      include_builtin_idf_components:
        - esp_http_client
        - driver

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret glucocraft_panel_api_key
  reboot_timeout: 0s      # never reboot for a Home Assistant outage: a reboot cannot fix Home Assistant and wipes the screen

ota:
  - platform: esphome
    encryption:   # uploads need the api encryption key (the same key)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # The ESPHome default reboots after 15 min without Wi-Fi; the panel's own check (interval 5min, below) reboots after
  # 60 min instead, so a router outage does not wipe the screen every 15 min
  reboot_timeout: 0s
  ap:
    ssid: "GlucoCraft-Panel"
    password: !secret glucocraft_panel_ap_password

captive_portal:

time:
  # No timezone option: without it ESPHome takes Home Assistant's time zone with every sync
  # (Home Assistant 2026.3 and newer send it; an older one leaves the panel on UTC). Every local time on the panel
  # (the clock and date, graph hour and date labels, the weekly pages' corner time and dates) follows it; until the
  # first sync the panel shows UTC (on_boot). A changed zone redraws the time axes (interval 1 s, redraw_time_zone).
  - platform: homeassistant
    id: ha_time
    update_interval: 2min
    on_time_sync:
      # Home Assistant's zone follows this sync; the 1-second interval saves it for the next boot (gc_units.h keep_tz)
      - lambda: 'gcu::mark_ha_time_sync();'
      # the clock was set after the boot download (Home Assistant slow or down): give the period graphs their real end time once
      - if:
          condition:
            lambda: 'return id(bf_ok) && !id(loading_mode_active) && backfill_fix_file_time();'
          then:
            - script.execute: backfill_apply_full
  # Second clock (optional): the local time server ntp_router, for a panel that starts while Home Assistant is not
  # connected; once set, the clock keeps running without either source. Where no time server answers at ntp_router
  # (the Home Assistant address, without a local time server), the panel keeps Home Assistant's time only. No
  # public time server: the panel contacts nothing outside the home network
  - platform: sntp
    id: sntp_time
    timezone: "UTC"   # the fallback until Home Assistant's zone arrives (one zone for the device: Home Assistant's replaces it)
    servers:
      - ${ntp_router}

globals:
  # GlucoCraft's setting Outline text (the configuration attribute text_outline; lvgl_compat.h), kept across a restart
  - id: text_outline_on
    type: bool
    restore_value: yes
    initial_value: 'false'
  # GlucoCraft's setting Fade the words when there is no current reading (the configuration attribute
  # flash_no_current_data, on by default; lvgl_compat.h lvc_throb), kept across a restart
  - id: flash_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  # GlucoCraft's setting Trend shown as (the configuration attribute trend_display): true = the trend word in the
  # TREND column instead of the arrow, kept across a restart
  - id: trend_word_on
    type: bool
    restore_value: yes
    initial_value: 'false'
  # the start-up screen is shown (its 15 seconds after boot): a swipe ends it instead of changing the page
  - id: startup_active
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: global_time_str
    type: std::string
    restore_value: no
    initial_value: '"--:--"'    # until a clock source has set the time (no false 00:00)
  - id: global_date_str
    type: std::string
    restore_value: no
    initial_value: '""'
  # The last reading survives a reboot (saved at most every 10 min, flash wear), its own time with its value in mg/dL as
  # received (not rounded: "Last reading" rounds it once, in the display unit) and its LO / HI mark: the status bar
  # counts its age, the weekly pages' corner shows its time, and without a current reading the value's place shows it
  # ("Last reading: 64 mg/dL", update_last_reading), also after a reboot without Home Assistant
  - id: saved_glucose_ts
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: saved_glucose_mgdl
    type: float
    restore_value: yes
    initial_value: '0'
  - id: saved_glucose_limit   # the saved reading's LO / HI mark (gc_units.h: 0 none, 1 LO, 2 HI)
    type: int
    restore_value: yes
    initial_value: '0'
  # the last reading's time (epoch seconds) by the status bar's count of its age, 0 while none is known (the 1-second
  # interval sets it; update_last_reading shows it)
  - id: last_reading_epoch
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: global_glucose_str
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_glucose_color
    type: int
    restore_value: no
    initial_value: '0x888888'
  - id: global_trend_angle   # trend arrow angle in degrees (+90 = straight up), -999 = no rate yet
    type: int
    restore_value: no
    initial_value: '-999'
  - id: global_display_word   # the zone word under the value ("" = none shown)
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: global_trend_word   # the trend word of the TREND column ("" = none known)
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: global_delta_str
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_time_since_update
    type: std::string
    restore_value: no
    initial_value: 'gct::status_reading_none'
  - id: last_glucose_update_time
    type: uint32_t   # unsigned: a signed 32-bit millisecond count overflows after 24.8 days of uptime
    restore_value: no
    initial_value: '0'
  - id: global_time_since_color
    type: int
    restore_value: no
    initial_value: '0x9E9E9E'
  # ONE SYSTEM (docs/DISPLAY_CONTRACT.md): GlucoCraft's status and its color, kept through a brief
  # "unavailable"; the panel's own clock only overrides it with "no current data" when Home Assistant cannot update it
  - id: gc_status
    type: std::string
    restore_value: no
    initial_value: '"no_data"'
  - id: gc_status_color
    type: int
    restore_value: no
    initial_value: '0x9E9E9E'
  - id: global_6h_tir
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_6h_titr
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_6h_mean
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_6h_std_dev
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_6h_cv
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_6h_low
    type: std::string
    restore_value: no
    initial_value: '"---"'
  - id: global_6h_high
    type: std::string
    restore_value: no
    initial_value: '"---"'
  # the optional feature Custom ranges and goals (sensor.glucocraft_configuration custom_ranges_and_goals): the 6-hour
  # summary sensor read before the first file
  - id: gc_custom_ranges_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: glucose_history
    type: int[180]
    restore_value: no
  - id: glucose_history_ts
    type: uint32_t[180]
    restore_value: no
  - id: glucose_history_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: glucose_history_count
    type: int
    restore_value: no
    initial_value: '0'
  # Downsampled graph data for longer periods (340 = canvas pixel width)
  - id: glucose_graph_24h
    type: int[340]
    restore_value: no
  - id: glucose_graph_24h_min
    type: int[340]
    restore_value: no
  - id: glucose_graph_24h_max
    type: int[340]
    restore_value: no
  - id: glucose_graph_24h_join   # 1 = the average line joins the next slot with data, 0 = a gap (the gap rule)
    type: uint8_t[340]
    restore_value: no
  - id: glucose_graph_7d
    type: int[340]
    restore_value: no
  - id: glucose_graph_7d_min
    type: int[340]
    restore_value: no
  - id: glucose_graph_7d_max
    type: int[340]
    restore_value: no
  - id: glucose_graph_7d_join   # 1 = the average line joins the next slot with data, 0 = a gap (the gap rule)
    type: uint8_t[340]
    restore_value: no
  - id: glucose_graph_14d
    type: int[340]
    restore_value: no
  - id: glucose_graph_14d_min
    type: int[340]
    restore_value: no
  - id: glucose_graph_14d_max
    type: int[340]
    restore_value: no
  - id: glucose_graph_14d_join   # 1 = the average line joins the next slot with data, 0 = a gap (the gap rule)
    type: uint8_t[340]
    restore_value: no
  - id: glucose_graph_30d
    type: int[340]
    restore_value: no
  - id: glucose_graph_30d_min
    type: int[340]
    restore_value: no
  - id: glucose_graph_30d_max
    type: int[340]
    restore_value: no
  - id: glucose_graph_30d_join   # 1 = the average line joins the next slot with data, 0 = a gap (the gap rule)
    type: uint8_t[340]
    restore_value: no
  - id: glucose_graph_90d
    type: int[340]
    restore_value: no
  - id: glucose_graph_90d_min
    type: int[340]
    restore_value: no
  - id: glucose_graph_90d_max
    type: int[340]
    restore_value: no
  - id: glucose_graph_90d_join   # 1 = the average line joins the next slot with data, 0 = a gap (the gap rule)
    type: uint8_t[340]
    restore_value: no
  - id: glucose_graph_180d
    type: int[340]
    restore_value: no
  - id: glucose_graph_180d_min
    type: int[340]
    restore_value: no
  - id: glucose_graph_180d_max
    type: int[340]
    restore_value: no
  - id: glucose_graph_180d_join   # 1 = the average line joins the next slot with data, 0 = a gap (the gap rule)
    type: uint8_t[340]
    restore_value: no
  # Page state
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: page_idle_seconds
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_drawn_trend_page
    type: int
    restore_value: no
    initial_value: '-1'
  - id: loading_mode_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: boot_sequence_complete
    type: bool
    restore_value: no
    initial_value: 'false'
  # Sensor expiry and warmup globals
  - id: global_sensor_expiry_str
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: data_stale
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sensor_expired
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sensor_expiry_epoch       # UTC epoch of the expiry (0 = none); the countdown uses it (no DST error)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sensor_warmup_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: global_warmup_str
    type: std::string
    restore_value: no
    initial_value: 'gct::status_warm_up'

  # Backfill state (glucocraft_panel_binary.h background download)
  - id: bf_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: bf_retry_ms
    type: uint32_t
    restore_value: no
    initial_value: '15000'
  - id: bf_refresh_tries
    type: int
    restore_value: no
    initial_value: '0'
  - id: low_mem_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: wifi_fail_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: local_stale               # no measurement for longer than GlucoCraft's stale threshold (default 15 min), own count
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: value_lost                # the value in hand is not the newest reading's, for over a minute (see the 1 s check)
    type: bool
    restore_value: no
    initial_value: 'false'
  # GlucoCraft's no-current-data limit in minutes (its setting No current data after; the attribute threshold_minutes),
  # kept across a restart like the other settings, so that the panel's own count uses it also after a restart without
  # Home Assistant (15 = GlucoCraft's default until the first value arrives)
  - id: stale_threshold_min
    type: float
    restore_value: yes
    initial_value: '15.0f'
  # the throb of the words without a current reading: on for the first 30 minutes of each episode (gc_units.h
  # throb_window; the 1-second interval sets it, refresh_glucose_block applies it)
  - id: words_throb
    type: bool
    restore_value: no
    initial_value: 'false'
  # the status bar's "Sensor expiry passed" throbs (the 1-second interval): after the stated expiry until a new sensor
  - id: expiry_throb
    type: bool
    restore_value: no
    initial_value: 'false'
  # a GlucoCraft notice is open in Home Assistant's Repairs (the configuration attribute attention): "Check Home
  # Assistant" takes turns in the middle of the status bar
  - id: attention_on
    type: bool
    restore_value: no
    initial_value: 'false'
  # the newest reading's time is more than 5 minutes ahead of the clock (the Last reading time sensor's attribute
  # time_untrusted): "Reading: ---" and no time line under the words
  - id: time_untrusted
    type: bool
    restore_value: no
    initial_value: 'false'
  # the screen without Home Assistant is up (the 1-second interval; script no_ha_screen_apply): the page changes do
  # nothing while it is
  - id: no_ha_screen_on
    type: bool
    restore_value: no
    initial_value: 'false'
  # millis() since which the ESPHome connection to Home Assistant is lost (0 = connected)
  - id: api_lost_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47
    miso_pin: GPIO41

i2c:
  - id: touch_i2c
    sda: GPIO19
    scl: GPIO45

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_output
    frequency: 100Hz

light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: backlight
    initial_state:   # on at every boot, never restored from flash
      state: true
    restore_state: none
    default_transition_length: 0s

touchscreen:
  - platform: gt911
    id: my_touchscreen
    # any touch starts the 3 minutes until the return to the first page again, as any use of the display card does
    on_touch:
      - lambda: 'id(page_idle_seconds) = 0;'
    i2c_id: touch_i2c
    address: 0x5D
    display: my_display
    # The mipi_rgb driver's GUITION-4848S040 model mirrors the picture in the panel; the touch controller is not
    # mirrored with it, so its X axis is mirrored here to match the picture (swipe directions and the press-and-hold
    # areas). The touch transform is independent of the display's transform; the picture's orientation stays as it is.
    transform:
      mirror_x: true

display:
  # The mipi_rgb driver of ESPHome with its model for this board (pins, timings, the ST7701S init sequence with 0xCD 0x00,
  # mirroring; ESPHome 2026.10 or newer). The SPI bus above sends the init sequence. After a change here, check the
  # picture's orientation and colors and the free memory on the panel.
  - platform: mipi_rgb
    model: GUITION-4848S040
    id: my_display
    spi_id: lcd_spi
    update_interval: never
    auto_clear_enabled: false

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: internal_temperature
    name: "CPU Temperature"
    entity_category: diagnostic
    update_interval: 60s
  - platform: template
    name: "Free Memory"
    lambda: |-
      size_t free = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
      return free / 1024.0;
    unit_of_measurement: "KB"
    update_interval: 30s
    entity_category: diagnostic
    icon: "mdi:memory"
    accuracy_decimals: 1
  # the lowest free internal memory since boot (the low-water mark between two 30-second samples) and the largest
  # free block (an allocation larger than it fails, even with enough memory free in all)
  - platform: template
    name: "Free Memory Minimum"
    lambda: 'return heap_caps_get_minimum_free_size(MALLOC_CAP_INTERNAL) / 1024.0;'
    unit_of_measurement: "KB"
    update_interval: 60s
    entity_category: diagnostic
    icon: "mdi:memory"
    accuracy_decimals: 1
  - platform: template
    name: "Free Memory Largest Block"
    lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024.0;'
    unit_of_measurement: "KB"
    update_interval: 60s
    entity_category: diagnostic
    icon: "mdi:memory"
    accuracy_decimals: 1

  # (No minutes-since-reading sensor: "Reading: 6 min ago" and the panel-side stale check use the panel's clock
  # minus GlucoCraft's last_reading_ts, ha_last_reading_ts below.)
  # GlucoCraft's stale threshold (options flow, default 15 min); the panel's own count uses the same number, kept in
  # stale_threshold_min across a restart (nothing arrives while Home Assistant restarts: the last value stays)
  - platform: homeassistant
    id: ha_stale_threshold
    entity_id: binary_sensor.glucocraft_no_current_data
    attribute: threshold_minutes
    internal: true
    on_value:
      then:
        - lambda: 'if (x > 0 && fabsf(x - id(stale_threshold_min)) > 0.01f) id(stale_threshold_min) = x;'
  - platform: homeassistant
    id: glucose_current
    entity_id: sensor.glucocraft_last_glucose_reading
    attribute: value_mgdl   # mg/dL whatever the display unit: the panel's history stays mg/dL
    internal: true
    on_value:
      then:
        # The expired state is GlucoCraft's alone (ha_status, cgm_sensor_expiry): a reading never changes it. After the
        # stated expiry a current reading is shown in the glucose block in its zone color, as on the display card.
        # Normal operation after boot complete (not during loading)
        - if:
            condition:
              lambda: 'return id(boot_sequence_complete) && !id(loading_mode_active);'
            then:
              - lambda: |-
                  id(last_glucose_update_time) = millis();
              - script.execute: update_glucose_display
              - script.execute: store_glucose_reading

  # The arrow's angle (degrees, +-90), calculated by GlucoCraft for any source (one system)
  - platform: homeassistant
    id: ha_trend_angle
    entity_id: sensor.glucocraft_trend_arrow
    attribute: angle
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  - platform: homeassistant
    id: range_critical_min
    entity_id: binary_sensor.glucocraft_using_custom_ranges
    attribute: range_very_low
    internal: true
  - platform: homeassistant
    id: range_critical_max
    entity_id: binary_sensor.glucocraft_using_custom_ranges
    attribute: range_very_high
    internal: true
  - platform: homeassistant
    id: range_ideal_min
    entity_id: binary_sensor.glucocraft_using_custom_ranges
    attribute: range_tight_low
    internal: true
  - platform: homeassistant
    id: range_ideal_max
    entity_id: binary_sensor.glucocraft_using_custom_ranges
    attribute: range_tight_high
    internal: true
  - platform: homeassistant
    id: range_normal_min
    entity_id: binary_sensor.glucocraft_using_custom_ranges
    attribute: range_low
    internal: true
  - platform: homeassistant
    id: range_normal_max
    entity_id: binary_sensor.glucocraft_using_custom_ranges
    attribute: range_high
    internal: true

text_sensor:
  # 5 MIN DELTA = GlucoCraft's change of the smoothed glucose over 5 minutes (one system), unrounded: as text, so that
  # it is read as GlucoCraft's double and rounded once (gcu::attr_value, gcu::fmt_delta)
  - platform: homeassistant
    id: ha_change5
    entity_id: sensor.glucocraft_5_minute_delta
    attribute: value_mgdl   # mg/dL; shown in the display unit
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(loading_mode_active);'
            then:
              - script.execute: update_glucose_display
  # The 6-hour statistics before the first file: the attributes of GlucoCraft's 6-hour summary sensors (glucose
  # values in mg/dL), as text, so that update_stats_display reads each as the double GlucoCraft calculated and rounds
  # it once as GlucoCraft does (gcu::attr_value; a float32 sensor would round some values one step off). The custom
  # ranges summary exists only while the optional feature Custom ranges and goals is on (gc_custom_ranges_on);
