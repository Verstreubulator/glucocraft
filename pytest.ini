[pytest]
# GlucoCraft test suite: see tests/README.md. Run from the repository root:  python -m pytest
testpaths = tests
pythonpath = tests
addopts = -ra --strict-markers
xfail_strict = true
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    # a coroutine handed to a stand-in and never run or closed (tests/conftest.py task_list)
    error:coroutine .* was never awaited:RuntimeWarning
markers =
    slow: builds whole reports or PDFs (deselect with -m "not slow")
